    timer.running = false;
    timer.phase = "work";
    loadPhase();
  }
  renderSessions();
  updateTimerUI();
  saveTimer();
});

/* ---------- WINDOW SESSIONS ---------- */
function windowBounds(w) {
  if (!w || !w.start || !w.end) return null;
  const start = new Date(`${w.date}T${w.start}:00`);
  let end     = new Date(`${w.date}T${w.end}:00`);
  if (isNaN(start) || isNaN(end)) return null;
  if (end <= start) end = new Date(end.getTime() + DAY);
  /* time spent paused during the window pushes the end later */
  return [start.getTime(), end.getTime() + (w.pausedMs > 0 ? w.pausedMs : 0)];
}

/* End time as shown to the person: original end + paused time, e.g. 13:00 -> 13:20 */
function windowEndLabel(w) {
  const b = windowBounds(w);
  if (!b || !(w.pausedMs > 0)) return w.end;
  const d = new Date(b[1]);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function windowDelayTag(w) {
  const m = Math.round((w.pausedMs || 0) / 60000);
  return m > 0 ? `+${fmtDur(m)} paused` : "";
}

/* Pause tracking: while the timer of a window session is paused inside its window,
   the window slides later by the same amount (paused 20 min -> 13:00 becomes 13:20). */
let pauseLastTick = Date.now();
let pauseShownLabel = "";
setInterval(() => {
  const now = Date.now();
  const dt = now - pauseLastTick;
  pauseLastTick = now;
  if (!timer.sessionId || timer.running || timer.finished) return;
  const s = getSession(timer.sessionId);
  if (!s || !s.window) return;
  const b = windowBounds(s.window);
  if (!b || now < b[0] || now >= b[1]) return;
  if (dt <= 0 || dt > 5000) return;                 // ignore sleep / throttled-tab gaps

  s.window.pausedMs = (s.window.pausedMs || 0) + dt;
  pauseSaveAcc += dt;
  if (pauseSaveAcc >= 5000) { pauseSaveAcc = 0; save(); }

  /* live-update the visible numbers without re-rendering the list */
  const nb = windowBounds(s.window);
  const card = document.querySelector(`.session[data-id="${s.id}"]`);
  if (card) {
    const cd = card.querySelector("[data-wend]");  if (cd) cd.dataset.wend = nb[1];
    const pc = card.querySelector("[data-pend]");  if (pc) pc.dataset.pend = nb[1];
  }
  const label = windowEndLabel(s.window) + "|" + Math.round(s.window.pausedMs / 60000);
  if (label !== pauseShownLabel) {                  // once a minute
    pauseShownLabel = label;
    renderSessions();
  }
}, 1000);
let pauseSaveAcc = 0;

function windowStatus(s) {
  const b = windowBounds(s.window);
  if (!b) return null;

  const [startMs, endMs] = b;
  const now = Date.now();
  const mode = state.settings.mode;

  const workMin    = s.blocks.reduce((a, x) => a + x.minutes, 0);
  const doneWorkMin= s.blocks.filter(x => x.done).reduce((a, x) => a + x.minutes, 0);

  const plannedMin = effectiveMinutes(workMin, s.blocks.length, mode, s);
  const toDoMin    = remainingEffective(s, mode);

  const leftMs    = Math.max(0, endMs - now);
  const remainMin = leftMs / 60000;
  const spareMin  = remainMin - toDoMin;

  return {
    startMs, endMs, now,
    totalMin: (endMs - startMs) / 60000,
    workMin, doneWorkMin,
    plannedMin, toDoMin, remainMin, spareMin,
    started: now >= startMs,
    ended:   now >= endMs
  };
}

function renderWindowBar(s) {
  const w = windowStatus(s);
  if (!w) return "";

  let cls = "ok", label;
  if (w.toDoMin <= 0)       { cls = "ok";    label = "Done"; }
  else if (!w.started)      { cls = "ok";    label = "Upcoming"; }
  else if (w.ended)         { cls = "over";  label = "Time up"; }
  else if (w.spareMin < 0)  { cls = "over";  label = `Over by ${fmtDur(-w.spareMin)}`; }
  else if (w.spareMin < 30) { cls = "tight"; label = `Tight · ${fmtDur(w.spareMin)} spare`; }
  else                      { cls = "ok";    label = `Fits · ${fmtDur(w.spareMin)} spare`; }

  const breakMin = Math.max(0, w.plannedMin - w.workMin);
  const breakTag = s.window && s.window.breakMinutes
    ? `${s.window.breakMinutes}m break`
    : `${fmtDur(breakMin)} breaks`;
  const planTitle = breakMin > 0
    ? `${fmtDur(w.workMin)} work + ${breakTag}`
    : `${fmtDur(w.workMin)} work`;

  const showPace = w.started && !w.ended && (w.doneWorkMin > 0 || timer.sessionId === s.id);
  const paceHtml = showPace
    ? `<span class="window-pace" data-pstart="${w.startMs}" data-pend="${w.endMs}" data-pplanned="${w.workMin}" data-pdone="${w.doneWorkMin}"></span>`
    : "";

  return `
    <div class="window-bar ${cls}">
      <div class="window-line">
        <span class="window-range">${ICON_CLOCK}${esc(s.window.start)} – ${esc(windowEndLabel(s.window))}${s.window.pausedMs > 0 ? ` <span class="window-delay" title="The window end moved because the timer was paused (planned end ${esc(s.window.end)})">${esc(windowDelayTag(s.window))}</span>` : ""}</span>
        <span class="window-countdown" data-wstart="${w.startMs}" data-wend="${w.endMs}">…</span>
      </div>
      <div class="window-line window-line-2">
        <span title="${esc(planTitle)}">Planned <b>${fmtDur(w.plannedMin)}</b></span>
        <span>To go <b>${fmtDur(w.toDoMin)}</b></span>
        ${paceHtml}
        <span class="window-status">${esc(label)}</span>
      </div>
    </div>`;
}

function updateWindowCountdowns() {
  const now = Date.now();

  document.querySelectorAll("[data-wend]").forEach(el => {
    const startMs = +el.dataset.wstart;
    const endMs   = +el.dataset.wend;
    let text, cls;
    if (now < startMs) {
      const mins = (startMs - now) / 60000;
      text = `starts in ${fmtDur(mins)}`;
      cls  = "upcoming";
    } else if (now >= endMs) {
      text = "window ended";
      cls  = "ended";
    } else {
      text = `${fmtDur((endMs - now) / 60000)} left`;
      cls  = "active";
    }
    el.textContent = text;
    el.className = "window-countdown " + cls;
  });

  document.querySelectorAll("[data-pstart]").forEach(el => {
    const ps      = +el.dataset.pstart;
    const pe      = +el.dataset.pend;
    const planned = +el.dataset.pplanned;
    const done    = +el.dataset.pdone;
    if (now < ps || now >= pe || planned <= 0) {
      el.textContent = "";
      el.className = "window-pace";
      return;
    }
    const frac = Math.min(1, (now - ps) / (pe - ps));
    const expected = planned * frac;
    const pace = done - expected;

    if (Math.abs(pace) < 5) {
      el.textContent = "On pace";
      el.className = "window-pace even";
    } else if (pace > 0) {
      el.textContent = `${fmtDur(pace)} ahead`;
      el.className = "window-pace ahead";
    } else {
      el.textContent = `${fmtDur(-pace)} behind`;
      el.className = "window-pace behind";
    }
  });
}

setInterval(updateWindowCountdowns, 1000);

/* ---------- RESOURCES HELPERS ---------- */
function safeUrl(u) {
  if (!u) return "";
  try {
    const url = new URL(u.trim());
    return (url.protocol === "http:" || url.protocol === "https:") ? url.href : "";
  } catch (e) { return ""; }
}

const getResource = id => state.resources.find(r => r.id === id);

function resChipsMarkup(ids) {
  const items = (ids || []).map(getResource).filter(Boolean);
  if (!items.length) return "";
  return `<div class="res-mini">${items.map(r => {
    const url = safeUrl(r.url);
    return url
      ? `<a class="chip link" href="${esc(url)}" target="_blank" rel="noopener noreferrer"
            title="${esc(r.url)}">${esc(r.name)}</a>`
      : `<span class="chip static" title="No link">${esc(r.name)}</span>`;
  }).join("")}</div>`;
}

let pickerEl = null;

function pickItemsMarkup(selected) {
  if (!state.resources.length)
    return `<div class="pick-empty">No resources yet — add one below.</div>`;
  return state.resources.map(r => `
    <label class="pick">
      <input type="checkbox" value="${r.id}" ${selected.includes(r.id) ? "checked" : ""}>
      <span class="pick-name">${esc(r.name)}</span>
      ${r.url ? `<span class="pick-url">${esc(r.url)}</span>` : ""}
    </label>`).join("");
}

function pickerMarkup(selected) {
  return `
    <div class="pick-list" id="pickWrap">${pickItemsMarkup(selected)}</div>
    <div class="res-form" style="margin-bottom:10px">
      <input id="pickName" placeholder="New resource" autocomplete="off">
      <input id="pickUrl" placeholder="https:// (optional)" autocomplete="off">
      <button class="btn" type="button" id="pickAdd">Add</button>
    </div>`;
}

function getPicked() {
  if (!pickerEl) return [];
  return [...pickerEl.querySelectorAll("input[type=checkbox]")]
    .filter(i => i.checked).map(i => i.value);
}

function appendPickItem(r, checked) {
  if (!pickerEl) return;
  const empty = pickerEl.querySelector(".pick-empty");
  if (empty) empty.remove();

  const label = document.createElement("label");
  label.className = "pick";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = r.id;
  cb.checked = !!checked;
  label.appendChild(cb);

  const name = document.createElement("span");
  name.className = "pick-name";
  name.textContent = r.name;
  label.appendChild(name);

  if (r.url) {
    const url = document.createElement("span");
    url.className = "pick-url";
    url.textContent = r.url;
    label.appendChild(url);
  }

  pickerEl.appendChild(label);
}

function initPicker() {
  pickerEl = document.getElementById("pickWrap");
  const addBtn = document.getElementById("pickAdd");
  if (!addBtn) return;

  addBtn.addEventListener("click", () => {
    const nameEl = document.getElementById("pickName");
    const urlEl  = document.getElementById("pickUrl");
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }

    const r = { id: uid(), name, url: urlEl.value.trim() };
    state.resources.push(r);
    save();

    appendPickItem(r, true);
    nameEl.value = "";
    urlEl.value = "";
    nameEl.focus();
    renderResources();
  });
}

function openAttachModal(kind, id) {
  let item, title;
  if (kind === "template") {
    item = findTemplate(id);
    title = "Template resources";
  } else if (kind === "plan") {
    item = state.plans.find(x => x.id === id);
    title = "Plan item resources";
  } else {
    item = getSession(id);
    title = "Session resources";
  }
  if (!item) return;
  if (!Array.isArray(item.resources)) item.resources = [];

  openModal(title, `
    <p class="hint">Pick the resources attached to <b>${esc(item.title)}</b>.</p>
    ${pickerMarkup(item.resources)}
    <button class="btn primary wide" id="pickSave">Save</button>
  `);

  initPicker();

  document.getElementById("pickSave").addEventListener("click", () => {
    item.resources = getPicked();
    save();
    const backToSection = (kind === "template") ? openSectionId : null;
    closeModal();
    if (kind === "template") {
      renderTemplates();
      renderPlan();
      if (backToSection) openSectionModal(backToSection);
    } else if (kind === "plan") {
      renderPlan();
    } else {
      renderSessions();
    }
    toast("Resources updated");
  });
}

/* ---------- BACKUP ---------- */
const PRE_KEY = "studyplan.prerestore.v1";

function backupCounts() {
  return {
    sessions: state.sessions.length,
    templates: state.templateGroups.reduce((a, g) => a + g.templates.length, 0),
    sections: state.templateGroups.length,
    plans: state.plans.length,
    resources: state.resources.length,
    history: state.history.length,
    tasks: state.checklist.reduce((a, g) => a + g.tasks.length, 0)
  };
}

function storageOk() {
  try {
    localStorage.setItem("studyplan.test", "1");
    localStorage.removeItem("studyplan.test");
    return true;
  } catch (e) { return false; }
}

function backupText() {
  return JSON.stringify({ app: "studyplan", version: BACKUP_VERSION, exportedAt: new Date().toISOString(), data: backupData() }, null, 2);
}

function backupData() {
  return {
    theme: state.theme,
    ui: state.ui,
    settings: state.settings,
    sessions: state.sessions,
    resources: state.resources,
    templateGroups: state.templateGroups,
    checklist: state.checklist,
    goals: state.goals,
    plans: state.plans,
    recurLog: state.recurLog,
    history: state.history
  };
}

/* ----- backup reminder: a dot on the backup button when data is unsaved for 7+ days ----- */
const BACKUP_NUDGE_DAYS = 7;
function backupAgeDays() {
  return state.lastBackup ? (Date.now() - state.lastBackup) / DAY : Infinity;
}
function updateBackupNudge() {
  const c = backupCounts();
  const hasData = c.sessions + c.templates + c.plans + c.resources + c.history + c.tasks > 0;
  const stale = hasData && backupAgeDays() >= BACKUP_NUDGE_DAYS;
  const btn = $("#backupBtn");
  btn.classList.toggle("nudge", stale);
  btn.title = stale
    ? (state.lastBackup ? `Backup & restore — last backup ${Math.floor(backupAgeDays())} days ago` : "Backup & restore — you haven't backed up yet")
    : "Backup & restore";
}

function exportBackup() {
  const payload = {
    app: "studyplan",
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    data: backupData()
  };

  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const a = document.createElement("a");
    a.href = url;
    a.download = `studyplan-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    state.lastBackup = Date.now();
    save();
    updateBackupNudge();
    closeModal();
    toast("Backup exported");
  } catch (e) {
    toast("Download blocked — use “Copy backup text” instead");
    const box = document.getElementById("pasteBox");
    if (box) { box.value = backupText(); const det = box.closest("details"); if (det) det.open = true; }
  }
}

/* Clean a parsed backup so a malformed file can't break the app */
function sanitizeBackup(data) {
  const objs = a => Array.isArray(a) ? a.filter(x => x && typeof x === "object") : [];
  let groups = [];
  if (Array.isArray(data.templateGroups)) {
    groups = data.templateGroups;
  } else if (Array.isArray(data.templates) && data.templates.length) {
    groups = [{ id: uid(), name: "Imported", templates: data.templates }];
  }
  groups = objs(groups).map(g => ({ ...g, templates: objs(g.templates) }));
  return {
    sessions:  objs(data.sessions),
    resources: objs(data.resources),
    templateGroups: groups,
    plans:     objs(data.plans),
    recurLog:  (data.recurLog && typeof data.recurLog === "object" && !Array.isArray(data.recurLog)) ? data.recurLog : {},
    history:   objs(data.history),
    checklist: Array.isArray(data.checklist) ? objs(data.checklist).map(g => ({ ...g, tasks: objs(g.tasks) })) : null,
    goals:     (data.goals && typeof data.goals === "object" && !Array.isArray(data.goals)) ? data.goals : null,
    settings:  (data.settings && typeof data.settings === "object") ? data.settings : null,
    ui:        (data.ui && typeof data.ui === "object") ? data.ui : null
  };
}

function applyBackupData(c) {
  state.sessions       = c.sessions;
  state.resources      = c.resources;
  state.templateGroups = c.templateGroups;
  state.plans          = c.plans;
  state.recurLog       = c.recurLog;
  state.history        = c.history;
  if (c.checklist) state.checklist = c.checklist;
  if (c.goals) state.goals = c.goals;
  if (c.settings) state.settings = { ...state.settings, ...c.settings };
  if (c.ui) {
    const { tab, hideResForm, dashRange, planRange, histRange } = c.ui;
    if (["day", "week", "month", "all"].includes(histRange)) state.ui.histRange = histRange;
    if (TABS.includes(tab)) state.ui.tab = tab;
    if (typeof hideResForm === "boolean") state.ui.hideResForm = hideResForm;
    if (["day", "week", "month", "all"].includes(dashRange)) state.ui.dashRange = dashRange;
    if (["day", "week", "month"].includes(planRange)) state.ui.planRange = planRange;
  }

  normalise();

  timer.sessionId = null;
  timer.running = false;
  timer.finished = false;
  clearSavedTimer();

  save();

  $("#setFocus").value = state.settings.focus;
  $("#setShort").value = state.settings.short;
  $("#setLong").value  = state.settings.long;
  $("#setEvery").value = state.settings.longEvery;

  setTab(state.ui.tab);
  applyResFormToggle();
  renderSessions();
  renderResources();
  renderTemplates();
  renderDashboard();
  renderPlan();
  renderHistory();
  updateTimerUI();
  updateBackupNudge();
}

/* One-step safety net: what was stored right before the last restore */
function saveSafetySnapshot() {
  try { localStorage.setItem(PRE_KEY, JSON.stringify({ at: Date.now(), data: backupData() })); return true; }
  catch (e) { return false; }
}
function readSafetySnapshot() {
  try {
    const raw = localStorage.getItem(PRE_KEY);
    const o = raw && JSON.parse(raw);
    return o && o.data && typeof o.data === "object" ? o : null;
  } catch (e) { return null; }
}

function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importBackupText(String(reader.result || ""));
  reader.onerror = () => alert("Could not read that file. Try \"Paste backup text\" in the Backup window instead.");
  reader.readAsText(file);
}

function importBackupText(text) {
  {
    let parsed;
    try {
      parsed = JSON.parse(String(text).replace(/^\uFEFF/, "").trim());
    } catch (e) {
      alert("That file is not valid JSON.");
      return;
    }

    const data = (parsed && typeof parsed === "object" && parsed.data && typeof parsed.data === "object")
      ? parsed.data
      : parsed;

    if (!data || typeof data !== "object") {
      alert("Unrecognised backup format.");
      return;
    }

    const hasAny = ["sessions", "plans", "templateGroups", "templates", "resources", "history", "checklist"]
      .some(k => Array.isArray(data[k]));
    if (!hasAny) {
      alert("This file doesn't look like a Study Plan backup.");
      return;
    }

    const c = sanitizeBackup(data);
    const taskCount = c.checklist ? c.checklist.reduce((a, g) => a + g.tasks.length, 0) : null;
    const exported = parsed && parsed.exportedAt ? new Date(parsed.exportedAt) : null;

    const ok = confirm(
      "Restore this backup?\n\n" +
      (exported && !isNaN(exported) ? `Exported:   ${exported.toLocaleString()}\n\n` : "") +
      `Sessions:   ${c.sessions.length}\n` +
      `Sections:   ${c.templateGroups.length}\n` +
      `Templates:  ${c.templateGroups.reduce((a, g) => a + g.templates.length, 0)}\n` +
      `Plans:      ${c.plans.length}\n` +
      `Resources:  ${c.resources.length}\n` +
      `History:    ${c.history.length}\n` +
      `Checklist:  ${taskCount === null ? "not in this file (kept as is)" : taskCount + " tasks"}\n\n` +
      "This REPLACES your current data. A safety copy of what you have now is kept so you can undo."
    );
    if (!ok) return;

    const saved = saveSafetySnapshot();
    applyBackupData(c);
    closeModal();
    toast(saved ? "Backup restored — you can undo from Backup & Restore" : "Backup restored");
  }
}

function undoRestore() {
  const snap = readSafetySnapshot();
  if (!snap) { toast("Nothing to undo"); return; }
  if (!confirm(`Go back to the data you had before the last restore (${new Date(snap.at).toLocaleString()})?\n\nYour current data will be kept as a new safety copy.`)) return;
  const current = { at: Date.now(), data: backupData() };
  applyBackupData(sanitizeBackup(snap.data));
  try { localStorage.setItem(PRE_KEY, JSON.stringify(current)); } catch (e) {}
  closeModal();
  toast("Previous data restored");
}

function openBackupModal() {
  const c = backupCounts();
  const age = backupAgeDays();
  const lastBackup = state.lastBackup
    ? `${new Date(state.lastBackup).toLocaleString()} (${age < 1 ? "today" : Math.floor(age) + " day" + (Math.floor(age) !== 1 ? "s" : "") + " ago"})`
    : "Never";
  const total = c.sessions + c.templates + c.plans + c.resources + c.history + c.tasks;
  const snap = readSafetySnapshot();

  openModal("Backup & Restore", `
    <p class="hint">Save all your data as a JSON file, or restore from a previous backup. Data lives only in this browser, so export regularly.</p>

    <div class="backup-stat-grid">
      <div class="backup-stat"><b>${c.sessions}</b><span>Sessions</span></div>
      <div class="backup-stat"><b>${c.templates}</b><span>Templates</span></div>
      <div class="backup-stat"><b>${c.plans}</b><span>Plans</span></div>
      <div class="backup-stat"><b>${c.tasks}</b><span>Tasks</span></div>
      <div class="backup-stat"><b>${c.history}</b><span>History</span></div>
      <div class="backup-stat"><b>${c.resources}</b><span>Resources</span></div>
    </div>

    <div class="backup-row">
      <button class="btn primary" id="exportBtn" ${total === 0 ? "disabled" : ""}>
        Export backup
      </button>
    </div>

    <div class="bk-file">
      <div class="bk-file-lbl">Restore from a backup file</div>
      <div class="bk-file-row">
        <label class="btn bk-browse" for="importFile">Browse…</label>
        <span class="bk-fname" id="importName">No file selected</span>
      </div>
      <input type="file" id="importFile" class="bk-file-in" accept=".json,.txt,application/json,text/plain,*/*">
    </div>

    ${storageOk() ? "" : `<div class="backup-warn" style="margin-bottom:12px"><span><b>Storage is blocked</b> in this window (private mode or a preview frame), so changes won't survive a reload. Open the file directly in your browser, and use <b>Export</b> to keep a copy.</span></div>`}

    <details class="bk-alt">
      <summary>Having trouble? Copy / paste backup text</summary>
      <p class="hint" style="margin:8px 0">If downloads or the file picker don't work here, copy your backup as text, or paste a backup below and restore from it.</p>
      <textarea id="pasteBox" rows="4" spellcheck="false" placeholder="Paste backup text here to restore, or press Copy to fill it with your current data"></textarea>
      <div class="backup-row" style="margin-top:8px">
        <button class="btn" id="copyBkBtn" type="button">Copy backup text</button>
        <button class="btn" id="pasteBkBtn" type="button">Restore from text</button>
      </div>
    </details>

    <p class="backup-meta">
      Last export: <b>${esc(lastBackup)}</b><br>
      File includes sessions, plans, templates, checklist, resources, history, and settings.
    </p>

    ${snap ? `
    <div class="backup-row" style="margin-top:0">
      <button class="btn" id="undoRestoreBtn">Undo last restore <span style="opacity:.6;font-weight:400">· ${esc(new Date(snap.at).toLocaleDateString())}</span></button>
    </div>` : ""}

    <div class="backup-warn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>Importing <b>replaces</b> everything currently stored. The data you had just before is kept once, so a mistaken restore can be undone.</span>
    </div>
  `);

  const exportBtn = document.getElementById("exportBtn");
  const fileInput = document.getElementById("importFile");

  if (exportBtn) exportBtn.addEventListener("click", exportBackup);
  const undoBtn = document.getElementById("undoRestoreBtn");
  if (undoBtn) undoBtn.addEventListener("click", undoRestore);

  const pasteBox = document.getElementById("pasteBox");
  document.getElementById("copyBkBtn").addEventListener("click", async () => {
    const text = backupText();
    pasteBox.value = text;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
    if (!ok) { pasteBox.focus(); pasteBox.select(); try { ok = document.execCommand("copy"); } catch (e) {} }
    if (ok) { state.lastBackup = Date.now(); save(); updateBackupNudge(); }
    toast(ok ? "Backup copied — paste it somewhere safe" : "Select the text and copy it manually");
  });
  document.getElementById("pasteBkBtn").addEventListener("click", () => {
    if (!pasteBox.value.trim()) { toast("Paste your backup text first"); return; }
    importBackupText(pasteBox.value);
  });
  fileInput.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    const nm = document.getElementById("importName");
    if (nm) nm.textContent = f ? f.name : "No file selected";
    if (f) importBackupFile(f);
    e.target.value = "";
  });
}

/* ---------- SESSIONS ---------- */
const sessionList = $("#sessionList");
const overviewBtn = $("#overviewBtn");

function renderSessions() {
  overviewBtn.hidden = !state.sessions.some(s => s.window && windowBounds(s.window));
  if (!state.sessions.length) {
    sessionList.innerHTML =
      `<div class="empty">No sessions yet.<br>Create one, import one, start from a <b>template</b>, or use <b>Time window</b>.</div>`;
    return;
  }

  sessionList.innerHTML = state.sessions.map(s => {
    const total = s.blocks.length;
    const done  = s.blocks.filter(b => b.done).length;
    const mins  = s.blocks.reduce((a, b) => a + b.minutes, 0);
    const pct   = total ? (done / total) * 100 : 0;
    const active = timer.sessionId === s.id;
    const isWindow = !!s.window;

    return `
      <div class="session${active ? " active" : ""}${isWindow ? " windowed" : ""}" data-id="${s.id}">
        <div class="session-head">
          <div>
            <div class="session-title">${esc(s.title)}</div>
            <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min · ${done}/${total} done</div>
          </div>
          <div class="session-actions">
            <button class="btn" data-act="start">${active ? "Restart" : "Start"}</button>
            ${isWindow ? `<button class="icon-btn sm" data-act="overview" title="Overview &amp; study order">${ICON_TIMELINE}</button>` : ""}
            ${isWindow ? `<button class="icon-btn sm" data-act="editWin" title="Edit window">✎</button>` : ""}
            <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
            <button class="icon-btn sm" data-act="tmpl" title="Save as template">★</button>
            <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
          </div>
        </div>
        ${isWindow ? renderWindowBar(s) : ""}
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="blocks">
          ${s.blocks.map((b, i) => `
            <span class="chip${b.done ? " done" : ""}${isChoice(b) ? " choice" : ""}" data-act="toggle" data-i="${i}"
                  title="Toggle done">${esc(b.topic || "Block " + (i + 1))} · ${b.minutes}m${isChoice(b) ? `<span class="chip-choose" data-act="choose" data-i="${i}" title="${b.chosen ? "Change choice" : "Choose now"}">⇄</span>` : ""}</span>
          `).join("")}
        </div>
        ${resChipsMarkup(s.resources)}
      </div>`;
  }).join("");

  updateWindowCountdowns();
}

sessionList.addEventListener("click", e => {
  const card = e.target.closest(".session");
  if (!card) return;
  const id  = card.dataset.id;
  const s   = getSession(id);
  if (!s) return;

  const el  = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "start") {
    startSession(id);
  } else if (act === "overview") {
    openWindowOverview(id);
  } else if (act === "editWin") {
    openWindowModal(id);
  } else if (act === "res") {
    openAttachModal("session", id);
  } else if (act === "del") {
    if (!confirm(`Delete "${s.title}"?`)) return;
    state.sessions = state.sessions.filter(x => x.id !== id);
    if (timer.sessionId === id) {
      timer.sessionId = null;
      timer.running = false;
      timer.finished = false;
      clearSavedTimer();
    }
    save(); renderSessions(); updateTimerUI();
  } else if (act === "tmpl") {
    if (!state.templateGroups.length) {
      state.templateGroups.push({ id: uid(), name: "General", templates: [] });
    }
    const targetGroup = state.templateGroups[0];
    targetGroup.templates.push({
      id: uid(),
      title: s.title,
      blocks: s.blocks.map(b => cpBlock(b)),
      resources: [...(s.resources || [])],
      created: Date.now()
    });
    save();
    renderTemplates();
    const prev = el.textContent;
    el.textContent = "✓";
    setTimeout(() => { el.textContent = prev; }, 900);
    toast(`Saved to "${targetGroup.name}"`);
  } else if (act === "choose") {
    openChoiceModal(id, +el.dataset.i, false);
  } else if (act === "toggle") {
    const i = +el.dataset.i;
    s.blocks[i].done = !s.blocks[i].done;
    if (s.blocks[i].done) completeTaskFromBlock(s.blocks[i]);
    save(); renderSessions();
  }
});

/* ---------- WINDOW MODAL (create + edit) ---------- */
function openWindowModal(editId) {
  const editing = editId ? getSession(editId) : null;

  const today = dateKey(new Date());
  const dateVal  = editing && editing.window ? editing.window.date  : today;
  const startVal = editing && editing.window ? editing.window.start : "07:00";
  const endVal   = editing && editing.window ? editing.window.end   : "14:00";
  const titleVal = editing ? editing.title : "";
  const picked   = editing && editing.window ? (editing.window.templateIds || []) : [];

  // "Default break" — per-window break override
  const hasOverride = !!(editing && editing.window &&
                         typeof editing.window.breakMinutes === "number" &&
                         editing.window.breakMinutes > 0);
  const breakVal = hasOverride ? editing.window.breakMinutes : "";

  const hasTemplates = state.templateGroups.some(g => g.templates.length);

  const tplListHtml = hasTemplates
    ? state.templateGroups.map(g => {
        if (!g.templates.length) return "";
        return `<div class="pick-head">${esc(g.name)}</div>` +
          g.templates.map(t => `
            <label class="pick">
              <input type="checkbox" value="${t.id}" ${picked.includes(t.id) ? "checked" : ""}>
              <span class="pick-name">${esc(t.title)}</span>
              <span class="pick-url">${t.blocks.length}b · ${planTotal(t.blocks)}m</span>
            </label>`).join("");
      }).join("")
    : `<div class="pick-empty">No templates yet — create one in the Templates tab first.</div>`;

  openModal(editing ? "Edit time window" : "Time window session", `
    <p class="hint">
      ${editing
        ? "Update the frame, times, break length, or templates. Blocks that are already done keep their state when the layout is unchanged."
        : "Fit a set of templates inside a fixed time frame. The session tracks how much study time is planned versus what is left in the window."}
    </p>

    <label class="fld">Title
      <input id="wTitle" placeholder="e.g. Saturday morning block" value="${esc(titleVal)}" autocomplete="off">
    </label>

    <div class="two">
      <label class="fld">Date
        <input id="wDate" type="date" value="${esc(dateVal)}">
      </label>
      <label class="fld">Start
        <input id="wStart" type="time" value="${esc(startVal)}">
      </label>
    </div>

    <div class="two">
      <label class="fld">End
        <input id="wEnd" type="time" value="${esc(endVal)}">
      </label>
      <label class="fld">Default break (min)
        <input id="wBreak" type="number" min="1" max="60" placeholder="Auto"
               value="${breakVal === "" ? "" : breakVal}">
      </label>
    </div>
    <p class="hint" style="margin:-6px 0 12px">
      Leave empty to use the global short/long break settings. A value here overrides
      <b>every</b> break inside this window.
    </p>

    <div class="fld" style="margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <span>Templates to fit inside the window</span>
      <button class="btn sm" type="button" id="wFit">Fit to window</button>
    </div>
    <div class="pick-list" id="wPick" style="max-height:200px">${tplListHtml}</div>

    <div class="window-preview" id="wPreview"></div>

    <button class="btn primary wide" id="wCreate" ${hasTemplates ? "" : "disabled"}>
      ${editing ? "Save changes" : "Create window session"}
    </button>
  `);

  const $title  = document.getElementById("wTitle");
  const $date   = document.getElementById("wDate");
  const $start  = document.getElementById("wStart");
  const $end    = document.getElementById("wEnd");
  const $break  = document.getElementById("wBreak");
  const $pick   = document.getElementById("wPick");
  const $prev   = document.getElementById("wPreview");
  const $create = document.getElementById("wCreate");
  const $fit    = document.getElementById("wFit");

  $title.focus();

  function readBreakOverride() {
    const raw = $break.value.trim();
    if (!raw) return null;
    const n = +raw;
    if (!isFinite(n) || n <= 0) return null;
    return Math.max(1, Math.min(60, Math.round(n)));
  }

  function pickedTemplates() {
    return [...$pick.querySelectorAll("input[type=checkbox]")]
      .filter(i => i.checked)
      .map(i => i.value)
      .map(findTemplate)
      .filter(Boolean);
  }

  function windowMinutes() {
    const s = $start.value, e = $end.value;
    if (!s || !e) return 0;
    const [sh, sm] = s.split(":").map(Number);
    const [eh, em] = e.split(":").map(Number);
    let diff = (eh * 60 + em) - (sh * 60 + sm);
    if (diff <= 0) diff += 1440;
    return diff;
  }

  function updatePreview() {
    const winMin = windowMinutes();
    const pk     = pickedTemplates();
    const wDow = dowOfKey($date.value || today);
    const workMin = pk.reduce((a, t) => a + planTotal(blocksForDay(t.blocks, wDow)), 0);
    const blockCnt = pk.reduce((a, t) => a + blocksForDay(t.blocks, wDow).length, 0);
    const mode = state.settings.mode;
    const override = readBreakOverride();
    const effMin = effectiveMinutes(workMin, blockCnt, mode, editing, override);
    const breakMin = effMin - workMin;
    const delta = winMin - effMin;

    let cls = "", status, statusCls = "";

    if (!pk.length) {
      cls = ""; statusCls = "";
      status = "Pick at least one template";
    } else if (delta < 0) {
      cls = "over"; statusCls = "over";
      status = `Doesn't fit — over by ${fmtDur(-delta)}`;
    } else if (delta < 30) {
      cls = "tight"; statusCls = "tight";
      status = `Tight — only ${fmtDur(delta)} of spare time`;
    } else {
      cls = "ok"; statusCls = "ok";
      status = `Fits with ${fmtDur(delta)} spare`;
    }

    $prev.className = "window-preview " + cls;
    $prev.innerHTML = `
      <div class="wp-row"><span>Window length</span><b>${winMin ? fmtDur(winMin) : "—"}</b></div>
      <div class="wp-row"><span>Work time</span><b>${workMin ? fmtDur(workMin) : "—"}</b></div>
      ${breakMin > 0 ? `<div class="wp-row"><span>Breaks${override ? ` (${override}m each)` : ""}</span><b>+${fmtDur(breakMin)}</b></div>` : ""}
      ${breakMin > 0 ? `<div class="wp-row"><span>Effective total</span><b>${fmtDur(effMin)}</b></div>` : ""}
      <div class="wp-row"><span>Templates picked</span><b>${pk.length}</b></div>
      <div class="wp-row wp-status ${statusCls}">${esc(status)}</div>
    `;
  }

  $pick.addEventListener("change", updatePreview);
  ["input", "change"].forEach(evt => {
    $start.addEventListener(evt, updatePreview);
    $end.addEventListener(evt, updatePreview);
    $break.addEventListener(evt, updatePreview);
    $date.addEventListener(evt, updatePreview);
  });
  updatePreview();

  // Fit to window
  $fit.addEventListener("click", () => {
    const winMin = windowMinutes();
    if (!winMin) { toast("Set a start and end time"); return; }

    const mode = state.settings.mode;
    const override = readBreakOverride();
    const all = [];
    state.templateGroups.forEach(g => g.templates.forEach(t => all.push(t)));

    if (!all.length) { toast("No templates available"); return; }

    const fitIds = [];
    let totalWork = 0;
    let totalBlocks = 0;

    const fDow = dowOfKey($date.value || today);
    for (const t of all) {
      const tWork = blocksForDay(t.blocks, fDow).reduce((a, b) => a + b.minutes, 0);
      const tBlocks = blocksForDay(t.blocks, fDow).length;
      const nextWork = totalWork + tWork;
      const nextBlocks = totalBlocks + tBlocks;
      const eff = effectiveMinutes(nextWork, nextBlocks, mode, editing, override);
      if (eff <= winMin) {
        totalWork = nextWork;
        totalBlocks = nextBlocks;
        fitIds.push(t.id);
      }
    }

    [...$pick.querySelectorAll("input[type=checkbox]")].forEach(cb => {
      cb.checked = fitIds.includes(cb.value);
    });
    updatePreview();

    if (!fitIds.length) toast("Nothing fits — try a longer window");
    else toast(`Fitted ${fitIds.length} template${fitIds.length !== 1 ? "s" : ""}`);
  });

  $create.addEventListener("click", () => {
    const pk = pickedTemplates();
    if (!pk.length) { toast("Pick at least one template"); return; }

    const start = $start.value || "07:00";
    const end   = $end.value   || "14:00";
    const date  = $date.value  || today;
    const breakMinutes = readBreakOverride();

    // Keep the current study order for templates that stay selected;
    // newly picked templates go at the end.
    const prevOrder = editing && editing.window ? (editing.window.templateIds || []) : [];
    const ordered = [
      ...prevOrder.map(id => pk.find(t => t.id === id)).filter(Boolean),
      ...pk.filter(t => !prevOrder.includes(t.id))
    ];

    // Old blocks per template, so done state survives an edit
    const oldByKey = new Map();
    if (editing) blockGroups(editing).forEach(g => oldByKey.set(g.key, g.blocks));

    const newBlocks = [];
    ordered.forEach(t => {
      const old = oldByKey.get(t.id) || [];
      const used = new Set();
      const fresh = blocksForDay(t.blocks, dowOfKey(date)).map(b => {
        if (isChoice(b)) {
          const match = old.find(o => !used.has(o) && sameOptions(o.options, b.options) && o.minutes === b.minutes);
          if (match) used.add(match);
          const keep = match && match.chosen;
          return { topic: keep ? match.topic : choiceLabel(b.options), minutes: b.minutes,
                   taskId: keep ? match.taskId : undefined, options: b.options.map(o => ({ ...o })),
                   chosen: !!keep, match };
        }
        const topic = b.topic || t.title;
        const match = old.find(o => !used.has(o) && o.topic === topic && o.minutes === b.minutes);
        if (match) used.add(match);
        return { topic, minutes: b.minutes, taskId: b.taskId, match };
      });

      if (old.length && fresh.every(f => f.match) && old.length === fresh.length) {
        old.forEach(o => { o.tplTitle = t.title; newBlocks.push(o); });
      } else {
        fresh.forEach(f => newBlocks.push({
          topic: f.topic,
          minutes: f.minutes,
          ...(f.taskId ? { taskId: f.taskId } : {}),
          ...(f.options ? { options: f.options, chosen: f.chosen } : {}),
          done: f.match ? !!f.match.done : false,
          tpl: t.id,
          tplTitle: t.title
        }));
      }
    });

    // Merge resources
    const resSet = new Set();
    pk.forEach(t => (t.resources || []).forEach(r => resSet.add(r)));

    const title = $title.value.trim() || "Study window";
    const templateIds = ordered.map(t => t.id);

    if (editing) {
      const current = timer.sessionId === editing.id ? editing.blocks[timer.blockIndex] : null;
      const breakChanged = (editing.window.breakMinutes || null) !== (breakMinutes || null);

      editing.title = title;
      editing.blocks = newBlocks;
      editing.resources = [...resSet];
      const o = editing.window;
      const sameFrame = o.date === date && o.start === start && o.end === end;
      editing.window = { date, start, end, templateIds, breakMinutes,
                         pausedMs: sameFrame ? (o.pausedMs || 0) : 0 };

      if (current) {
        const ni = newBlocks.indexOf(current);
        timer.blockIndex = ni >= 0 ? ni : Math.max(0, Math.min(timer.blockIndex, newBlocks.length - 1));
        updateTimerUI();
      }

      // If the break length changed while the active session is on a break,
      // reload the current break phase so the new duration takes effect.
      if (breakChanged && timer.sessionId === editing.id && timer.phase === "break" && !timer.finished) {
        timer.running = false;
        loadPhase();
        updateTimerUI();
        saveTimer();
      }

      save();
      closeModal();
      renderSessions();
      toast("Window updated");
    } else {
      state.sessions.push({
        id: uid(),
        title,
        blocks: newBlocks,
        resources: [...resSet],
        window: { date, start, end, templateIds, breakMinutes },
        created: Date.now()
      });
      save();
      closeModal();
      renderSessions();
      toast("Window session created");
    }
  });
}
