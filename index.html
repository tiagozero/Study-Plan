    <div class="pick-list" id="wPick" style="max-height:200px">${tplListHtml}</div>

    <div class="window-preview" id="wPreview"></div>

    <button class="btn primary wide" id="wCreate" ${hasTemplates ? "" : "disabled"}>
      ${editing ? "Save changes" : "Create window session"}
    </button>
  `);

  const $title  = document.getElementById("wTitle");
  const $date   = document.getElementById("wDate");
  const $start  = document.getElementById("wStart");
  const $end    = document.getElementById("wEnd");
  const $break  = document.getElementById("wBreak");
  const $pick   = document.getElementById("wPick");
  const $prev   = document.getElementById("wPreview");
  const $create = document.getElementById("wCreate");
  const $fit    = document.getElementById("wFit");

  $title.focus();

  function readBreakOverride() {
    const raw = $break.value.trim();
    if (!raw) return null;
    const n = +raw;
    if (!isFinite(n) || n <= 0) return null;
    return Math.max(1, Math.min(60, Math.round(n)));
  }

  function pickedTemplates() {
    return [...$pick.querySelectorAll("input[type=checkbox]")]
      .filter(i => i.checked)
      .map(i => i.value)
      .map(findTemplate)
      .filter(Boolean);
  }

  function windowMinutes() {
    const s = $start.value, e = $end.value;
    if (!s || !e) return 0;
    const [sh, sm] = s.split(":").map(Number);
    const [eh, em] = e.split(":").map(Number);
    let diff = (eh * 60 + em) - (sh * 60 + sm);
    if (diff <= 0) diff += 1440;
    return diff;
  }

  function updatePreview() {
    const winMin = windowMinutes();
    const pk     = pickedTemplates();
    const workMin = pk.reduce((a, t) => a + planTotal(t.blocks), 0);
    const blockCnt = pk.reduce((a, t) => a + t.blocks.length, 0);
    const mode = state.settings.mode;
    const override = readBreakOverride();
    const effMin = effectiveMinutes(workMin, blockCnt, mode, editing, override);
    const breakMin = effMin - workMin;
    const delta = winMin - effMin;

    let cls = "", status, statusCls = "";

    if (!pk.length) {
      cls = ""; statusCls = "";
      status = "Pick at least one template";
    } else if (delta < 0) {
      cls = "over"; statusCls = "over";
      status = `Doesn't fit — over by ${fmtDur(-delta)}`;
    } else if (delta < 30) {
      cls = "tight"; statusCls = "tight";
      status = `Tight — only ${fmtDur(delta)} of spare time`;
    } else {
      cls = "ok"; statusCls = "ok";
      status = `Fits with ${fmtDur(delta)} spare`;
    }

    $prev.className = "window-preview " + cls;
    $prev.innerHTML = `
      <div class="wp-row"><span>Window length</span><b>${winMin ? fmtDur(winMin) : "—"}</b></div>
      <div class="wp-row"><span>Work time</span><b>${workMin ? fmtDur(workMin) : "—"}</b></div>
      ${breakMin > 0 ? `<div class="wp-row"><span>Breaks${override ? ` (${override}m each)` : ""}</span><b>+${fmtDur(breakMin)}</b></div>` : ""}
      ${breakMin > 0 ? `<div class="wp-row"><span>Effective total</span><b>${fmtDur(effMin)}</b></div>` : ""}
      <div class="wp-row"><span>Templates picked</span><b>${pk.length}</b></div>
      <div class="wp-row wp-status ${statusCls}">${esc(status)}</div>
    `;
  }

  $pick.addEventListener("change", updatePreview);
  ["input", "change"].forEach(evt => {
    $start.addEventListener(evt, updatePreview);
    $end.addEventListener(evt, updatePreview);
    $break.addEventListener(evt, updatePreview);
  });
  updatePreview();

  // Fit to window
  $fit.addEventListener("click", () => {
    const winMin = windowMinutes();
    if (!winMin) { toast("Set a start and end time"); return; }

    const mode = state.settings.mode;
    const override = readBreakOverride();
    const all = [];
    state.templateGroups.forEach(g => g.templates.forEach(t => all.push(t)));

    if (!all.length) { toast("No templates available"); return; }

    const fitIds = [];
    let totalWork = 0;
    let totalBlocks = 0;

    for (const t of all) {
      const tWork = t.blocks.reduce((a, b) => a + b.minutes, 0);
      const tBlocks = t.blocks.length;
      const nextWork = totalWork + tWork;
      const nextBlocks = totalBlocks + tBlocks;
      const eff = effectiveMinutes(nextWork, nextBlocks, mode, editing, override);
      if (eff <= winMin) {
        totalWork = nextWork;
        totalBlocks = nextBlocks;
        fitIds.push(t.id);
      }
    }

    [...$pick.querySelectorAll("input[type=checkbox]")].forEach(cb => {
      cb.checked = fitIds.includes(cb.value);
    });
    updatePreview();

    if (!fitIds.length) toast("Nothing fits — try a longer window");
    else toast(`Fitted ${fitIds.length} template${fitIds.length !== 1 ? "s" : ""}`);
  });

  $create.addEventListener("click", () => {
    const pk = pickedTemplates();
    if (!pk.length) { toast("Pick at least one template"); return; }

    const start = $start.value || "07:00";
    const end   = $end.value   || "14:00";
    const date  = $date.value  || today;
    const breakMinutes = readBreakOverride();

    // Keep the current study order for templates that stay selected;
    // newly picked templates go at the end.
    const prevOrder = editing && editing.window ? (editing.window.templateIds || []) : [];
    const ordered = [
      ...prevOrder.map(id => pk.find(t => t.id === id)).filter(Boolean),
      ...pk.filter(t => !prevOrder.includes(t.id))
    ];

    // Old blocks per template, so done state survives an edit
    const oldByKey = new Map();
    if (editing) blockGroups(editing).forEach(g => oldByKey.set(g.key, g.blocks));

    const newBlocks = [];
    ordered.forEach(t => {
      const old = oldByKey.get(t.id) || [];
      const used = new Set();
      const fresh = t.blocks.map(b => {
        const topic = b.topic || t.title;
        const match = old.find(o => !used.has(o) && o.topic === topic && o.minutes === b.minutes);
        if (match) used.add(match);
        return { topic, minutes: b.minutes, match };
      });

      if (old.length && fresh.every(f => f.match) && old.length === fresh.length) {
        old.forEach(o => { o.tplTitle = t.title; newBlocks.push(o); });
      } else {
        fresh.forEach(f => newBlocks.push({
          topic: f.topic,
          minutes: f.minutes,
          done: f.match ? !!f.match.done : false,
          tpl: t.id,
          tplTitle: t.title
        }));
      }
    });

    // Merge resources
    const resSet = new Set();
    pk.forEach(t => (t.resources || []).forEach(r => resSet.add(r)));

    const title = $title.value.trim() || "Study window";
    const templateIds = ordered.map(t => t.id);

    if (editing) {
      const current = timer.sessionId === editing.id ? editing.blocks[timer.blockIndex] : null;
      const breakChanged = (editing.window.breakMinutes || null) !== (breakMinutes || null);

      editing.title = title;
      editing.blocks = newBlocks;
      editing.resources = [...resSet];
      editing.window = { date, start, end, templateIds, breakMinutes };

      if (current) {
        const ni = newBlocks.indexOf(current);
        timer.blockIndex = ni >= 0 ? ni : Math.max(0, Math.min(timer.blockIndex, newBlocks.length - 1));
        updateTimerUI();
      }

      // If the break length changed while the active session is on a break,
      // reload the current break phase so the new duration takes effect.
      if (breakChanged && timer.sessionId === editing.id && timer.phase === "break" && !timer.finished) {
        timer.running = false;
        loadPhase();
        updateTimerUI();
        saveTimer();
      }

      save();
      closeModal();
      renderSessions();
      toast("Window updated");
    } else {
      state.sessions.push({
        id: uid(),
        title,
        blocks: newBlocks,
        resources: [...resSet],
        window: { date, start, end, templateIds, breakMinutes },
        created: Date.now()
      });
      save();
      closeModal();
      renderSessions();
      toast("Window session created");
    }
  });
}

$("#addWindowBtn").addEventListener("click", () => openWindowModal(null));

/* ---------- TIME WINDOW OVERVIEW ---------- */
const OTHER = "__other";
const ovOpen = new Set();   // template groups whose blocks are expanded

const fmtClock = ms => {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
const ovColor = i => `hsl(${(i * 57 + 255) % 360} 62% 58%)`;

/* Blocks grouped by the template they came from, in study order */
function blockGroups(s) {
  const map = new Map();
  s.blocks.forEach(b => {
    const key = b.tpl || OTHER;
    if (!map.has(key)) map.set(key, { key, blocks: [] });
    map.get(key).blocks.push(b);
  });
  return [...map.values()].map(g => {
    const live = g.key !== OTHER ? findTemplate(g.key) : null;
    g.title = g.key === OTHER ? "Other blocks"
            : (live ? live.title : (g.blocks[0].tplTitle || "Template"));
    return g;
  });
}

/* Clock times for every block, following the planned breaks */
function buildSchedule(s) {
  const wb = windowBounds(s.window);
  if (!wb) return null;
  const pomodoro = state.settings.mode === "pomodoro";
  const every = state.settings.longEvery;
  const n = s.blocks.length;
  let t = wb[0];
  const items = s.blocks.map((b, i) => {
    const start = t, end = t + b.minutes * 60000;
    t = end;
    let brk = 0;
    if (pomodoro && i < n - 1) {
      brk = getBreakMins(s, (i + 1) % every === 0) * 60000;
      t += brk;
    }
    return { b, i, start, end, brk };
  });
  return {
    startMs: wb[0],
    endMs: wb[1],
    items,
    finish: items.length ? items[items.length - 1].end : wb[0]
  };
}

function applyBlockOrder(s, groups, flashKey) {
  const current = timer.sessionId === s.id ? s.blocks[timer.blockIndex] : null;
  s.blocks = groups.flatMap(g => g.blocks);
  s.window.templateIds = groups.map(g => g.key).filter(k => k !== OTHER);
  if (current) {
    const ni = s.blocks.indexOf(current);
    if (ni >= 0) timer.blockIndex = ni;
  }
  save();
  renderSessions();
  updateTimerUI();
  openWindowOverview(s.id, flashKey);
}

function moveGroup(s, key, dir) {
  const groups = blockGroups(s);
  const i = groups.findIndex(g => g.key === key);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= groups.length) return;
  [groups[i], groups[j]] = [groups[j], groups[i]];
  applyBlockOrder(s, groups, key);
}

function moveBlock(s, key, bi, dir) {
  const groups = blockGroups(s);
  const g = groups.find(x => x.key === key);
  if (!g) return;
  const j = bi + dir;
  if (j < 0 || j >= g.blocks.length) return;
  [g.blocks[bi], g.blocks[j]] = [g.blocks[j], g.blocks[bi]];
  applyBlockOrder(s, groups, key);
}

function defaultOverviewId() {
  const wins = state.sessions.filter(x => x.window && windowBounds(x.window));
  if (!wins.length) return null;
  const now = Date.now();
  const startOf = x => windowBounds(x.window)[0];
  const endOf   = x => windowBounds(x.window)[1];
  const live = wins.find(x => now >= startOf(x) && now < endOf(x));
  if (live) return live.id;
  const next = wins.filter(x => startOf(x) > now).sort((a, b) => startOf(a) - startOf(b))[0];
  if (next) return next.id;
  return wins.sort((a, b) => startOf(b) - startOf(a))[0].id;
}

function openWindowOverview(id, flashKey) {
  const wins = state.sessions
    .filter(x => x.window && windowBounds(x.window))
    .sort((a, b) => windowBounds(a.window)[0] - windowBounds(b.window)[0]);
  if (!wins.length) { toast("Create a time window first"); return; }

  const s = wins.find(x => x.id === id) || getSession(defaultOverviewId());
  if (!s) return;

  const sched  = buildSchedule(s);
  const groups = blockGroups(s);
  const itemOf = new Map(sched.items.map(it => [it.b, it]));
  const winMin = (sched.endMs - sched.startMs) / 60000;
  const workMin = s.blocks.reduce((a, b) => a + b.minutes, 0);
  const breakMin = sched.items.reduce((a, it) => a + it.brk, 0) / 60000;
  const spare = (sched.endMs - sched.finish) / 60000;

  let cls, status;
  if (!s.blocks.length)  { cls = "";      status = "No blocks in this window"; }
  else if (spare < 0)    { cls = "over";  status = `Doesn't fit — over by ${fmtDur(-spare)}`; }
  else if (spare < 30)   { cls = "tight"; status = `Tight — only ${fmtDur(spare)} of spare time`; }
  else                   { cls = "ok";    status = `Fits with ${fmtDur(spare)} spare`; }

  /* timeline */
  const spanMs = Math.max(sched.endMs - sched.startMs, sched.finish - sched.startMs, 1);
  const pct = ms => (ms / spanMs) * 100;
  const colorOf = new Map(groups.map((g, i) => [g.key, ovColor(i)]));
  const now = Date.now();

  const segs = sched.items.map(it => {
    const key = it.b.tpl || OTHER;
    const late = it.end > sched.endMs ? " late" : "";
    const g = groups.find(x => x.key === key);
    const tip = `${g.title} · ${it.b.topic || "Block"} · ${fmtClock(it.start)}–${fmtClock(it.end)}`;
    return `<i class="ov-seg${late}" style="flex:0 0 ${pct(it.end - it.start)}%;background-color:${colorOf.get(key)}" title="${esc(tip)}"></i>`
         + (it.brk ? `<i class="ov-seg brk" style="flex:0 0 ${pct(it.brk)}%" title="Break · ${fmtDur(it.brk / 60000)}"></i>` : "");
  }).join("");

  const endLine = spanMs > sched.endMs - sched.startMs
    ? `<span class="ov-endline" style="left:${pct(sched.endMs - sched.startMs)}%" title="Window ends ${fmtClock(sched.endMs)}"></span>` : "";
  const nowLine = (now >= sched.startMs && now <= sched.startMs + spanMs)
    ? `<span class="ov-now" style="left:${pct(now - sched.startMs)}%" title="Now"></span>` : "";

  /* study order rows */
  const rows = groups.map((g, gi) => {
    const its   = g.blocks.map(b => itemOf.get(b));
    const gS    = its[0].start;
    const gE    = its[its.length - 1].end;
    const work  = g.blocks.reduce((a, b) => a + b.minutes, 0);
    const done  = g.blocks.filter(b => b.done).length;
    const over  = gS >= sched.endMs ? "Outside the window"
                : gE > sched.endMs  ? `Runs ${fmtDur((gE - sched.endMs) / 60000)} over` : "";
    const open  = ovOpen.has(g.key);
    const lastBrk = its[its.length - 1].brk;

    const blockRows = its.map((it, bi) => `
      <div class="ov-blk${it.b.done ? " done" : ""}" data-bi="${bi}">
        <span class="t">${fmtClock(it.start)}–${fmtClock(it.end)}</span>
        <span class="n">${esc(it.b.topic || "Block")}</span>
        <span class="m">${it.b.minutes}m</span>
        <button class="icon-btn sm" data-act="ov-b-up" title="Move block earlier" aria-label="Move block earlier" ${bi === 0 ? "disabled" : ""}>▲</button>
        <button class="icon-btn sm" data-act="ov-b-down" title="Move block later" aria-label="Move block later" ${bi === its.length - 1 ? "disabled" : ""}>▼</button>
      </div>
      ${it.brk && bi < its.length - 1 ? `<div class="ov-brk">${fmtClock(it.end)} · ${fmtDur(it.brk / 60000)} break</div>` : ""}
    `).join("");

    return `
      <div class="ov-group${open ? " open" : ""}${g.key === flashKey ? " flash" : ""}" data-key="${esc(g.key)}">
        <div class="ov-row">
          <span class="ov-dot" style="background:${colorOf.get(g.key)}"></span>
          <div class="ov-info">
            <div class="ov-name">${gi + 1}. ${esc(g.title)}</div>
            <div class="ov-sub${over ? " late" : ""}">${fmtClock(gS)} – ${fmtClock(gE)} · ${fmtDur(work)} · ${done}/${g.blocks.length} done${over ? ` · ${over}` : ""}</div>
          </div>
          <div class="ov-move">
            <button class="icon-btn sm" data-act="ov-g-up" title="Study earlier" aria-label="Study earlier" ${gi === 0 ? "disabled" : ""}>▲</button>
            <button class="icon-btn sm" data-act="ov-g-down" title="Study later" aria-label="Study later" ${gi === groups.length - 1 ? "disabled" : ""}>▼</button>
            <button class="icon-btn sm" data-act="ov-toggle" title="Show blocks" aria-label="Show blocks" aria-expanded="${open}"><span class="ov-chev">›</span></button>
          </div>
        </div>
        ${open ? `<div class="ov-blocks">${blockRows}${lastBrk && gi < groups.length - 1 ? `<div class="ov-brk">${fmtClock(its[its.length - 1].end)} · ${fmtDur(lastBrk / 60000)} break</div>` : ""}</div>` : ""}
      </div>`;
  }).join("");

  const dateLabel = new Date(`${s.window.date}T00:00:00`)
    .toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  const topHtml = wins.length > 1
    ? `<select id="ovSel" aria-label="Choose time window">${wins.map(w => {
        const d = new Date(`${w.window.date}T00:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric" });
        return `<option value="${w.id}" ${w.id === s.id ? "selected" : ""}>${esc(w.title)} · ${d} ${esc(w.window.start)}–${esc(w.window.end)}</option>`;
      }).join("")}</select>`
    : `<div class="ov-title">${esc(s.title)}</div>`;

  const modalEl = overlay.querySelector(".modal");
  const keepScroll = !overlay.hidden && modalEl.classList.contains("wide") ? modalEl.scrollTop : 0;

  openModal("Time window overview", `
    <div class="ov-top">
      ${topHtml}
      <div class="ov-when">${esc(dateLabel)} · ${esc(s.window.start)} – ${esc(s.window.end)}</div>
    </div>

    <div class="ov-tl" role="img" aria-label="Timeline of the window">${segs}${endLine}${nowLine}</div>
    <div class="ov-axis"><span>${fmtClock(sched.startMs)}</span><span>${fmtClock(sched.startMs + spanMs)}</span></div>

    <div class="window-preview ${cls}">
      <div class="wp-row"><span>Window</span><b>${fmtDur(winMin)}</b></div>
      <div class="wp-row"><span>Work</span><b>${workMin ? fmtDur(workMin) : "—"}</b></div>
      ${breakMin > 0 ? `<div class="wp-row"><span>Breaks${s.window.breakMinutes ? ` (${s.window.breakMinutes}m each)` : ""}</span><b>+${fmtDur(breakMin)}</b></div>` : ""}
      <div class="wp-row"><span>Planned finish</span><b>${s.blocks.length ? fmtClock(sched.finish) : "—"}</b></div>
      <div class="wp-row wp-status ${cls}">${esc(status)}</div>
    </div>

    <div class="ov-head">
      <h3>Study order</h3>
      <span>${groups.length} template${groups.length !== 1 ? "s" : ""} · ▲▼ to move</span>
    </div>
    ${rows || `<div class="tpl-empty">Nothing in this window yet.</div>`}

    <div class="backup-row" style="margin:14px 0 0">
      <button class="btn" data-act="ov-edit">Edit window</button>
      <button class="btn primary" data-act="ov-close">Done</button>
    </div>
  `, e => {
    const btn = e.target.closest("[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    const grp = btn.closest("[data-key]");
    const key = grp ? grp.dataset.key : null;

    if (act === "ov-g-up")        moveGroup(s, key, -1);
    else if (act === "ov-g-down") moveGroup(s, key, 1);
    else if (act === "ov-b-up")   moveBlock(s, key, +btn.closest("[data-bi]").dataset.bi, -1);
    else if (act === "ov-b-down") moveBlock(s, key, +btn.closest("[data-bi]").dataset.bi, 1);
    else if (act === "ov-toggle") {
      if (ovOpen.has(key)) ovOpen.delete(key); else ovOpen.add(key);
      openWindowOverview(s.id);
    }
    else if (act === "ov-edit")   openWindowModal(s.id);
    else if (act === "ov-close")  closeModal();
  });

  modalEl.classList.add("wide");
  modalEl.scrollTop = keepScroll;

  const sel = document.getElementById("ovSel");
  if (sel) sel.addEventListener("change", () => openWindowOverview(sel.value));
}

overviewBtn.addEventListener("click", () => openWindowOverview(defaultOverviewId()));

/* ---------- PLAN ---------- */
const planSeg   = $("#planSeg");
const planLabel = $("#planLabel");
const planBody  = $("#planBody");
const planPrev  = $("#planPrev");
const planNext  = $("#planNext");
const planToday = $("#planToday");

function planAnchorDate() {
  const d = state.ui.planAnchor
    ? new Date(state.ui.planAnchor + "T00:00:00")
    : new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function shiftPlan(dir) {
  const d = planAnchorDate();
  if (state.ui.planRange === "day")        d.setDate(d.getDate() + dir);
  else if (state.ui.planRange === "week")  d.setDate(d.getDate() + 7 * dir);
  else                                     d.setMonth(d.getMonth() + dir);
  state.ui.planAnchor = dateKey(d);
  save();
  renderPlan();
}

function planTotal(blocks) {
  return (blocks || []).reduce((a, b) => a + b.minutes, 0);
}

/* ----- recurring days ----- */
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];            // Monday first
const DOW_NAMES = { 0: "Sun", 1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri", 6: "Sat" };

function daysLabel(days) {
  const set = new Set(days || []);
  if (set.size === 7) return "Every day";
  if (set.size === 5 && [1, 2, 3, 4, 5].every(d => set.has(d))) return "Weekdays";
  if (set.size === 2 && set.has(6) && set.has(0)) return "Weekends";
  return DOW_ORDER.filter(d => set.has(d)).map(d => DOW_NAMES[d]).join(" · ");
}

function dayPickerMarkup(days) {
  const set = new Set(days || []);
  return `
    <div class="dp" id="dayPicker">
      ${DOW_ORDER.map(d => `
        <label><input type="checkbox" value="${d}" ${set.has(d) ? "checked" : ""}><span>${DOW_NAMES[d]}</span></label>
      `).join("")}
    </div>
    <div class="dp-presets" id="dayPresets">
      <button class="btn sm" type="button" data-preset="weekdays">Weekdays</button>
      <button class="btn sm" type="button" data-preset="weekends">Weekends</button>
      <button class="btn sm" type="button" data-preset="all">Every day</button>
      <button class="btn sm" type="button" data-preset="none">Clear</button>
    </div>`;
}

function initDayPicker() {
  const presets = document.getElementById("dayPresets");
  const picker  = document.getElementById("dayPicker");
  if (!presets || !picker) return;
  const sets = { weekdays: [1, 2, 3, 4, 5], weekends: [6, 0], all: [0, 1, 2, 3, 4, 5, 6], none: [] };
  presets.addEventListener("click", e => {
    const b = e.target.closest("[data-preset]");
    if (!b) return;
    const on = new Set(sets[b.dataset.preset] || []);
    picker.querySelectorAll("input").forEach(i => { i.checked = on.has(+i.value); });
  });
}

function readDays() {
  const picker = document.getElementById("dayPicker");
  if (!picker) return [];
  return [...picker.querySelectorAll("input:checked")].map(i => +i.value);
}

const recKey = (tplId, date) => `${tplId}|${date}`;

function isRecurringOn(t, key, dow) {
  return Array.isArray(t.days) && t.days.includes(dow) && (!t.daysSince || key >= t.daysSince);
}

/* Everything planned for a day: weekly template occurrences + one-off plan items */
function planItemsFor(d, includeSkipped) {
  const key = dateKey(d), dow = d.getDay();
  const out = [];

  state.templateGroups.forEach(g => g.templates.forEach(t => {
    if (!isRecurringOn(t, key, dow)) return;
    const log = state.recurLog[recKey(t.id, key)] || {};
    if (log.skipped && !includeSkipped) return;
    out.push({
      kind: "rec", id: t.id, date: key, title: t.title, blocks: t.blocks,
      resources: t.resources || [], done: !!log.done, skipped: !!log.skipped,
      sessionId: log.sessionId || null
    });
  }));

  state.plans
    .filter(p => p.date === key)
    .sort((a, b) => a.created - b.created)
    .forEach(p => out.push({
      kind: "plan", id: p.id, date: key, title: p.title, blocks: p.blocks,
      resources: p.resources || [], done: !!p.done, skipped: false,
      sessionId: p.sessionId || null
    }));

  return out;
}

function renderPlanItem(it) {
  const sess  = it.sessionId ? getSession(it.sessionId) : null;
  const total = planTotal(it.blocks);
  const doneB = sess ? sess.blocks.filter(b => b.done).length : 0;
  const pct   = sess && sess.blocks.length ? Math.round(doneB / sess.blocks.length * 100) : 0;

  return `
    <div class="plan-card ${it.done ? "done" : ""} ${it.kind === "rec" ? "rec" : ""}"
         data-kind="${it.kind}" data-id="${it.id}" data-date="${it.date}">
      <div class="plan-item">
        <input type="checkbox" data-act="toggle" ${it.done ? "checked" : ""}>
        <span class="plan-title">${it.kind === "rec" ? `<span class="rec-mark" title="Repeats weekly">↻</span>` : ""}${esc(it.title)}</span>
        <span class="plan-meta">${it.blocks.length}b · ${total}m</span>
        <button class="btn sm" data-act="start">Start</button>
        <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
        <button class="icon-btn sm" data-act="del" title="${it.kind === "rec" ? "Skip this day" : "Remove"}">✕</button>
      </div>
      <div class="plan-blocks">
        ${it.blocks.map((b, i) => `
          <span class="chip static ${sess && sess.blocks[i] && sess.blocks[i].done ? "done" : ""}">${esc(b.topic || "Block")} · ${b.minutes}m</span>
        `).join("")}
      </div>
      ${sess && pct > 0 ? `<div class="plan-prog" title="${doneB}/${sess.blocks.length} blocks done"><i style="width:${pct}%"></i></div>` : ""}
    </div>`;
}

function renderPlanDay(d) {
  const key = dateKey(d);
  const todayKey = dateKey(new Date());
  const all = planItemsFor(d, true);
  const items = all.filter(i => !i.skipped);
  const skipped = all.filter(i => i.skipped);
  const mins = items.reduce((a, i) => a + planTotal(i.blocks), 0);
  const doneN = items.filter(i => i.done).length;

  return `
    <div class="plan-day ${key === todayKey ? "today" : ""}">
      <div class="plan-day-head">
        <b>${d.toLocaleDateString(undefined, { weekday: "long" })}</b>
        <span>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
        ${items.length ? `<span class="plan-day-sum">${doneN}/${items.length} done · ${fmtDur(mins)}</span>` : ""}
      </div>
      <div class="plan-day-list">
        ${items.length ? items.map(renderPlanItem).join("") : `<div class="plan-empty">Nothing planned</div>`}
        ${skipped.map(i => `
          <div class="plan-skipped">↻ ${esc(i.title)} skipped
            <button data-restore="${i.id}" data-date="${key}">Restore</button>
          </div>`).join("")}
        <button class="plan-add" data-add="${key}">+ Add to ${d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" })}</button>
      </div>
    </div>`;
}

function renderWeekStrip(anchor, range) {
  const start = startOfWeek(anchor);
  const todayKey = dateKey(new Date());
  const selKey = dateKey(anchor);
  return `<div class="week-strip">${
    Array.from({ length: 7 }, (_, i) => {
      const d = addDays(start, i), key = dateKey(d);
      const items = planItemsFor(d);
      const mins = items.reduce((a, it) => a + planTotal(it.blocks), 0);
      const doneN = items.filter(it => it.done).length;
      return `
        <button class="ws-day ${key === todayKey ? "today" : ""} ${range === "day" && key === selKey ? "sel" : ""}" data-strip="${key}">
          <span class="ws-dow">${d.toLocaleDateString(undefined, { weekday: "short" })}</span>
          <span class="ws-num">${d.getDate()}</span>
          <span class="ws-meta">${items.length ? `${doneN}/${items.length} · ${fmtDur(mins)}` : "—"}</span>
        </button>`;
    }).join("")
  }</div>`;
}

function renderMonthGrid(anchor) {
  const year = anchor.getFullYear();
  const month = anchor.getMonth();
  const first = new Date(year, month, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) {
    cells.push({ d: new Date(year, month - 1, prevMonthDays - i), out: true });
  }
  for (let i = 1; i <= daysInMonth; i++) {
    cells.push({ d: new Date(year, month, i), out: false });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].d;
    cells.push({ d: addDays(last, 1), out: true });
  }

  const todayKey = dateKey(new Date());

  return `
    <div class="plan-cal">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="cal-h">${d}</div>`).join("")}
      ${cells.map(c => {
        const key = dateKey(c.d);
        const items = planItemsFor(c.d);
        return `<div class="cal-cell ${c.out ? "out" : ""} ${key === todayKey ? "today" : ""}" data-day="${key}">
          <div class="cal-num">${c.d.getDate()}</div>
          ${items.slice(0, 3).map(p => `<div class="cal-item ${p.kind === "rec" ? "rec" : ""} ${p.done ? "done" : ""}">${esc(p.title)}</div>`).join("")}
          ${items.length > 3 ? `<div style="font-size:10px;color:var(--muted)">+${items.length - 3} more</div>` : ""}
        </div>`;
      }).join("")}
    </div>`;
}

function renderPlan() {
  const range = state.ui.planRange;
  [...planSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));

  const anchor = planAnchorDate();
  let label = "";

  if (range === "day") {
    label = anchor.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
  } else if (range === "week") {
    const start = startOfWeek(anchor);
    const end = addDays(start, 6);
    label = `${start.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${end.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
  } else {
    label = anchor.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  planLabel.textContent = label;

  let html = "";
  if (range === "day") {
    html = renderWeekStrip(anchor, "day") + renderPlanDay(anchor);
  } else if (range === "week") {
    const start = startOfWeek(anchor);
    html = renderWeekStrip(anchor, "week");
    for (let i = 0; i < 7; i++) html += renderPlanDay(addDays(start, i));
  } else {
    html = renderMonthGrid(anchor);
  }

  planBody.innerHTML = html;
}

planSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");
  if (!b) return;
  state.ui.planRange = b.dataset.range;
  save();
  renderPlan();
});

planPrev.addEventListener("click", () => shiftPlan(-1));
planNext.addEventListener("click", () => shiftPlan(1));
planToday.addEventListener("click", () => {
  state.ui.planAnchor = dateKey(new Date());
  save();
  renderPlan();
});

function recEntry(tplId, date) {
  const k = recKey(tplId, date);
  if (!state.recurLog[k]) state.recurLog[k] = {};
  return state.recurLog[k];
}

planBody.addEventListener("click", e => {
  const addBtn = e.target.closest("[data-add]");
  if (addBtn) { openPlanAddModal(addBtn.dataset.add); return; }

  const strip = e.target.closest("[data-strip]");
  if (strip) {
    state.ui.planAnchor = strip.dataset.strip;
    state.ui.planRange = "day";
    save();
    renderPlan();
    return;
  }

  const restore = e.target.closest("[data-restore]");
  if (restore) {
    const ent = recEntry(restore.dataset.restore, restore.dataset.date);
    delete ent.skipped;
    save(); renderPlan();
    return;
  }

  const cell = e.target.closest("[data-day]");
  if (cell) {
    state.ui.planAnchor = cell.dataset.day;
    state.ui.planRange = "day";
    save();
    renderPlan();
    return;
  }

  const card = e.target.closest(".plan-card");
  if (!card) return;
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const { kind, id, date } = card.dataset;
  const action = act.dataset.act;

  if (action === "toggle") {
    if (kind === "rec") {
      const ent = recEntry(id, date);
      ent.done = !ent.done;
    } else {
      const p = state.plans.find(x => x.id === id);
      if (p) p.done = !p.done;
    }
    save(); renderPlan();
  } else if (action === "del") {
    if (kind === "rec") {
      recEntry(id, date).skipped = true;
      toast("Skipped for this day. Change repeat days in the template.");
    } else {
      state.plans = state.plans.filter(x => x.id !== id);
    }
    save(); renderPlan();
  } else if (action === "start") {
    if (kind === "rec") startRecItem(id, date);
    else startPlanItem(id);
  } else if (action === "res") {
    openAttachModal(kind === "rec" ? "template" : "plan", id);
  }
});

function startRecItem(tplId, date) {
  const t = findTemplate(tplId);
  if (!t) return;
  const ent = recEntry(tplId, date);

  let s = ent.sessionId ? getSession(ent.sessionId) : null;
  if (!s) {
    s = {
      id: uid(),
      title: t.title,
      blocks: t.blocks.map(b => ({ topic: b.topic, minutes: b.minutes, done: false })),
      resources: [...(t.resources || [])],
      created: Date.now()
    };
    state.sessions.push(s);
    ent.sessionId = s.id;
    save();
    renderSessions();
  }

  startSession(s.id);
  setTab("sessions");
}

function startPlanItem(planId) {
  const p = state.plans.find(x => x.id === planId);
  if (!p) return;

  let s = p.sessionId ? getSession(p.sessionId) : null;
  if (!s) {
    s = {
      id: uid(),
      title: p.title,
      blocks: p.blocks.map(b => ({ topic: b.topic, minutes: b.minutes, done: false })),
      resources: [...(p.resources || [])],
      created: Date.now()
    };
    state.sessions.push(s);
    p.sessionId = s.id;
    save();
    renderSessions();
  }

  startSession(s.id);
  setTab("sessions");
}

function openPlanAddModal(dateStr) {
  const sessions = state.sessions;
  const allTemplates = state.templateGroups.flatMap(g =>
    g.templates.map(t => ({ t, groupName: g.name }))
  );

  const nothing = !sessions.length && !allTemplates.length;

  openModal("Add to plan", `
    <label class="fld">Date
      <input id="plDate" type="date" value="${esc(dateStr)}">
    </label>
    <div class="fld" style="margin-bottom:6px">Pick a session or template</div>
    <div class="pick-list" style="max-height:300px" id="planPickWrap">
      ${nothing ? `<div class="pick-empty">Nothing to add. Create a session or template first.</div>` : ""}
      ${sessions.map(s => `
        <div class="pick" data-pick="session" data-id="${s.id}">
          <span class="pick-name">${esc(s.title)}</span>
          <span class="pick-url">${s.blocks.length}b · ${planTotal(s.blocks)}m</span>
        </div>`).join("")}
      ${allTemplates.map(({ t, groupName }) => `
        <div class="pick" data-pick="template" data-id="${t.id}">
          <span class="pick-name">${esc(t.title)}
            <span style="color:var(--muted);font-size:11px">· ${esc(groupName)}</span>
          </span>
          <span class="pick-url">${t.blocks.length}b · ${planTotal(t.blocks)}m</span>
        </div>`).join("")}
    </div>
  `, e => {
    const el = e.target.closest("[data-pick]");
    if (!el) return;
    const date = (document.getElementById("plDate") || {}).value || dateStr;
    addPlanFromSource(el.dataset.pick, el.dataset.id, date);
    closeModal();
    renderPlan();
    toast("Added to plan");
  });
}

function addPlanFromSource(kind, id, dateStr) {
  let title, blocks, resources;
  if (kind === "session") {
    const s = getSession(id); if (!s) return;
    title = s.title;
    blocks = s.blocks.map(b => ({ topic: b.topic, minutes: b.minutes }));
    resources = [...(s.resources || [])];
  } else {
    const t = findTemplate(id); if (!t) return;
    title = t.title;
    blocks = t.blocks.map(b => ({ topic: b.topic, minutes: b.minutes }));
    resources = [...(t.resources || [])];
  }

  state.plans.push({
    id: uid(),
    date: dateStr,
    title,
    blocks: blocks.map(b => ({ ...b, done: false })),
    resources,
    done: false,
    created: Date.now()
  });
  save();
}

/* ---------- TEMPLATES ---------- */
const templateList = $("#templateList");

function sectionStats(g) {
  const tpls = g.templates || [];
  return {
    count:  tpls.length,
    blocks: tpls.reduce((a, t) => a + (t.blocks ? t.blocks.length : 0), 0),
    mins:   tpls.reduce((a, t) => a + planTotal(t.blocks), 0)
  };
}

function renderTemplateCard(t, groupId) {
  const total = t.blocks.length;
  const mins  = planTotal(t.blocks);
  const MAX   = 8;
  const shown = t.blocks.slice(0, MAX);
  const extra = total - shown.length;

  return `
    <div class="session tpl-card" data-tpl="${t.id}" data-group="${groupId}">
      <div>
        <div class="session-title">${esc(t.title)}</div>
        <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min total${(t.days && t.days.length) ? `<span class="rec-badge" title="Repeats weekly">↻ ${esc(daysLabel(t.days))}</span>` : ""}</div>
      </div>
      <div class="blocks" style="margin-top:11px">
        ${shown.map(b => `
          <span class="chip static">${esc(b.topic || "Block")} · ${b.minutes}m</span>
        `).join("")}
        ${extra > 0 ? `<span class="chip static more" title="${esc(t.blocks.slice(MAX).map(b => (b.topic || "Block") + " · " + b.minutes + "m").join(", "))}">+${extra} more</span>` : ""}
      </div>
      ${resChipsMarkup(t.resources)}
      <div class="session-actions">
        <button class="btn primary" data-act="use">Create session</button>
        <button class="btn" data-act="schedule" title="Add this template to your plan on a chosen date">Add to plan</button>
        <button class="icon-btn sm" data-act="edit" title="Edit template">✎</button>
        <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
        <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
      </div>
    </div>`;
}

function renderTemplates() {
  if (!state.templateGroups.length) {
    templateList.innerHTML =
      `<div class="empty">No sections yet.<br>Create a <b>section</b> to organise your templates.</div>`;
    return;
  }

  templateList.innerHTML = `<div class="section-grid">${
    state.templateGroups.map(g => {
      const st = sectionStats(g);

      return `
      <div class="section-card" data-group="${g.id}">
        <div class="section-card-top">
          <span class="section-icon">${ICON_SECTION}</span>
          <span class="section-card-actions">
            <button class="icon-btn sm" data-act="rename-group" title="Rename section">✎</button>
            <button class="icon-btn sm" data-act="del-group" title="Delete section">✕</button>
          </span>
        </div>
        <div class="section-info">
          <div class="section-name">${esc(g.name)}</div>
          <div class="section-meta">${st.count} template${st.count !== 1 ? "s" : ""} · ${st.blocks} block${st.blocks !== 1 ? "s" : ""} · ${st.mins} min</div>
        </div>
        <div class="section-card-foot">
          <button class="btn sm" data-act="add-tpl">+ Template</button>
          <button class="btn sm primary" data-act="open">Open</button>
        </div>
      </div>`;
    }).join("")
  }</div>`;
}

function openSectionModal(groupId) {
  const group = state.templateGroups.find(g => g.id === groupId);
  if (!group) return;

  const st = sectionStats(group);
  const list = group.templates.length
    ? group.templates.map(t => renderTemplateCard(t, group.id)).join("")
    : `<div class="tpl-empty">No templates in this section yet.</div>`;

  openModal(group.name, `
    <div class="tpl-toolbar">
      <p class="hint">
        ${st.count} template${st.count !== 1 ? "s" : ""} ·
        ${st.blocks} block${st.blocks !== 1 ? "s" : ""} ·
        ${fmtDur(st.mins)} total
      </p>
      <button class="btn primary sm" data-act="add-tpl">+ New template</button>
    </div>
    <div id="sectionTplList" class="tpl-grid">${list}</div>
  `, e => {
    const actEl = e.target.closest("[data-act]");
    if (!actEl) return;
    const act = actEl.dataset.act;

    if (act === "add-tpl") { openCreateModal("template", groupId); return; }

    const tplEl = e.target.closest("[data-tpl]");
    if (!tplEl) return;
    const tplId = tplEl.dataset.tpl;
    const tpl   = findTemplate(tplId);
    if (!tpl) return;

    if (act === "use") {
      const session = {
        id: uid(),
        title: tpl.title,
        blocks: tpl.blocks.map(b => ({ topic: b.topic, minutes: b.minutes, done: false })),
        resources: [...(tpl.resources || [])],
        created: Date.now()
      };
      state.sessions.push(session);
      save();
      renderSessions();
      closeModal();
      setTab("sessions");
      toast(`Session "${session.title}" created`);
    } else if (act === "schedule") {
      openScheduleModal(tplId);
    } else if (act === "edit") {
      openEditTemplateModal(tplId, group.id);
    } else if (act === "res") {
      openAttachModal("template", tplId);
    } else if (act === "del") {
      if (!confirm(`Delete template "${tpl.title}"?`)) return;
      group.templates = group.templates.filter(x => x.id !== tplId);
      save();
      renderTemplates();
      openSectionModal(groupId);
      toast("Template deleted");
    }
  });

  const mEl = overlay.querySelector(".modal");
  if (mEl) mEl.classList.add("xwide");

  openSectionId = groupId;
}

  document.getElementById("eAddBlock").addEventListener("click", addBlockRow);

  document.getElementById("eSave").addEventListener("click", () => {
    const title  = $title.value.trim() || "Untitled template";
    const newGid = document.getElementById("eGroup").value;
    const resources = getPicked();

    const blocks = [...$blocks.querySelectorAll(".block-row")].map(r => ({
      topic:   r.querySelector(".be-topic").value.trim(),
      minutes: Math.max(1, Math.min(300, +r.querySelector(".be-mins").value || 25))
    }));

    if (!blocks.length) { toast("Add at least one block"); return; }

    tpl.title     = title;
    tpl.blocks    = blocks;
    tpl.resources = resources;

    const newDays = readDays();
    const oldKey = [...(tpl.days || [])].sort().join(",");
    if (newDays.slice().sort().join(",") !== oldKey) {
      tpl.days = newDays;
      tpl.daysSince = newDays.length ? dateKey(new Date()) : "";
    }

    if (newGid !== groupId) {
      const from = state.templateGroups.find(g => g.id === groupId);
      const to   = state.templateGroups.find(g => g.id === newGid);
      if (from && to) {
        from.templates = from.templates.filter(x => x.id !== tplId);
        to.templates.push(tpl);
      }
    }

    save();
    closeModal();
    renderTemplates();
    renderPlan();
    openSectionModal(newGid);
    toast("Template updated");
  });
}

templateList.addEventListener("click", e => {
  const card = e.target.closest("[data-group]");
  if (!card) return;
  const groupId = card.dataset.group;
  const group = state.templateGroups.find(x => x.id === groupId);
  if (!group) return;

  const actEl = e.target.closest("[data-act]");
  const act = actEl ? actEl.dataset.act : "open";

  if (act === "rename-group") {
    const name = prompt("Section name:", group.name);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    group.name = trimmed;
    save();
    renderTemplates();
    return;
  }

  if (act === "del-group") {
    if (!confirm(`Delete section "${group.name}" and all its templates?`)) return;
    state.templateGroups = state.templateGroups.filter(x => x.id !== groupId);
    save();
    renderTemplates();
    return;
  }

  if (act === "add-tpl") {
    openCreateModal("template", groupId);
    return;
  }

  openSectionModal(groupId);
});

/* ---------- DASHBOARD ---------- */
const dashBody = $("#dashBody");
const dashSeg  = $("#dashSeg");

function startOfToday() {
  const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
}
function dayKey(t) {
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtDur(mins) {
  const m = Math.round(mins);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function rangeBounds(range) {
  const t0 = startOfToday();
  if (range === "day")   return [t0, t0 + DAY];
  if (range === "week")  return [t0 - 6 * DAY, t0 + DAY];
  if (range === "month") return [t0 - 29 * DAY, t0 + DAY];
  return [0, Infinity];
}

function buildBuckets(range) {
  const t0 = startOfToday();
  const out = [];

  if (range === "day") {
    for (let h = 0; h < 24; h++) {
      const s = t0 + h * 3600000;
      out.push({
        start: s, end: s + 3600000,
        label: h % 3 === 0 ? String(h).padStart(2, "0") : "",
        tip: `${String(h).padStart(2, "0")}:00`
      });
    }
  } else if (range === "week") {
    for (let i = 6; i >= 0; i--) {
      const s = t0 - i * DAY, d = new Date(s);
      out.push({
        start: s, end: s + DAY,
        label: d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2),
        tip: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
    }
  } else if (range === "month") {
    for (let i = 29; i >= 0; i--) {
      const s = t0 - i * DAY, d = new Date(s);
      out.push({
        start: s, end: s + DAY,
        label: (i % 5 === 0 || i === 0) ? String(d.getDate()) : "",
        tip: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
    }
  } else {
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const s = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const e = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      out.push({
        start: s.getTime(), end: e.getTime(),
        label: s.toLocaleDateString(undefined, { month: "short" }),
        tip: s.toLocaleDateString(undefined, { month: "long", year: "numeric" })
      });
    }
  }
  return out;
}

function computeStreak() {
  const keys = new Set(state.history.map(h => dayKey(h.ts)));
  let streak = 0;
  const cur = new Date(); cur.setHours(0, 0, 0, 0);
  if (!keys.has(dayKey(cur.getTime()))) cur.setDate(cur.getDate() - 1);
  while (keys.has(dayKey(cur.getTime()))) { streak++; cur.setDate(cur.getDate() - 1); }
  return streak;
}

function renderDashboard() {
  const range = state.ui.dashRange;
  [...dashSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));

  if (!state.history.length) {
    dashBody.innerHTML =
      `<div class="empty">No study data yet.<br>Finish a focus block and your stats will appear here.</div>`;
    return;
  }

  const [start, end] = rangeBounds(range);
  const entries = state.history.filter(h => h.ts >= start && h.ts < end);

  const total    = entries.reduce((a, h) => a + h.minutes, 0);
  const blocks   = entries.length;
  const sessions = new Set(entries.map(h => h.sessionId)).size;
  const days     = new Set(entries.map(h => dayKey(h.ts))).size;

  const spanDays = range === "day"   ? 1
                 : range === "week"  ? 7
                 : range === "month" ? 30
                 : Math.max(1, Math.ceil((Date.now() - (state.history[0] ? state.history[0].ts : Date.now())) / DAY));
  const avg = total / spanDays;

  const streak = computeStreak();

  const buckets = buildBuckets(range);
  const values  = buckets.map(b =>
    entries.filter(h => h.ts >= b.start && h.ts < b.end)
           .reduce((a, h) => a + h.minutes, 0));
  const maxV    = Math.max(...values, 1);
  const bestIdx = values.indexOf(Math.max(...values));

  const byS = new Map();
  entries.forEach(h => {
    const k = h.sessionTitle || "Untitled";
    const o = byS.get(k) || { minutes: 0, count: 0 };
    o.minutes += h.minutes; o.count++;
    byS.set(k, o);
  });
  const bySList = [...byS.entries()].sort((a, b) => b[1].minutes - a[1].minutes).slice(0, 8);
  const maxS = bySList.length ? bySList[0][1].minutes : 1;

  const byT = new Map();
  entries.forEach(h => {
    const k = (h.topic || "").trim();
    if (!k) return;
    byT.set(k, (byT.get(k) || 0) + h.minutes);
  });
  const byTList = [...byT.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxT = byTList.length ? byTList[0][1] : 1;

  dashBody.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="stat-v">${total > 0 ? fmtDur(total) : "0m"}</div><div class="stat-l">Focus time</div></div>
      <div class="stat"><div class="stat-v">${blocks}</div><div class="stat-l">Blocks</div></div>
      <div class="stat"><div class="stat-v">${sessions}</div><div class="stat-l">Sessions</div></div>
      <div class="stat"><div class="stat-v">${days}</div><div class="stat-l">Active days</div></div>
      <div class="stat"><div class="stat-v">${avg >= 1 ? fmtDur(avg) : "0m"}</div><div class="stat-l">Avg / day</div></div>
      <div class="stat"><div class="stat-v">${streak}d</div><div class="stat-l">Streak</div></div>
    </div>

    <div class="dash-block">
      <div class="dash-head">
        <h3>Activity</h3>
        <span>${total > 0
          ? `Best ${esc(buckets[bestIdx].tip)} · ${fmtDur(values[bestIdx])}`
          : "No activity in this range"}</span>
      </div>
      <div class="chart">
        ${buckets.map((b, i) => {
          const v = values[i];
          const h = v > 0 ? Math.max(3, (v / maxV) * 100) : 0;
          return `<div class="bar-col" title="${esc(b.tip)} · ${fmtDur(v)}">
                    <div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div>
                    <div class="bar-lbl">${esc(b.label)}</div>
                  </div>`;
        }).join("")}
      </div>
    </div>

    <div class="dash-block">
      <div class="dash-head">
        <h3>By session</h3>
        <span>${sessions} session${sessions !== 1 ? "s" : ""}</span>
      </div>
      ${bySList.length ? bySList.map(([name, o]) => `
        <div class="brk-row">
          <div class="brk-name">${esc(name)}</div>
          <div class="brk-val">${fmtDur(o.minutes)} · ${o.count} block${o.count !== 1 ? "s" : ""}</div>
          <div class="brk-bar"><i style="width:${(o.minutes / maxS) * 100}%"></i></div>
        </div>`).join("")
        : `<div class="empty" style="padding:14px">No sessions in this range.</div>`}
    </div>

    ${byTList.length ? `
    <div class="dash-block">
      <div class="dash-head"><h3>By topic</h3><span>top ${byTList.length}</span></div>
      ${byTList.map(([name, m]) => `
        <div class="brk-row">
          <div class="brk-name">${esc(name)}</div>
          <div class="brk-val">${fmtDur(m)}</div>
          <div class="brk-bar"><i style="width:${(m / maxT) * 100}%"></i></div>
        </div>`).join("")}
    </div>` : ""}
  `;
}

dashSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");
  if (!b) return;
  if (state.ui.dashRange === b.dataset.range) return;
  state.ui.dashRange = b.dataset.range;
  save();
  renderDashboard();
});

/* ---------- IMPORT PARSER ---------- */
function parseSessions(text) {
  const out = [];

  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    let title = "", spec = line;

    const m = line.match(/^(.*)\s*[-–—]\s*(.+)$/);
    if (m && /\d/.test(m[2])) {
      title = m[1].trim();
      spec  = m[2].trim();
    }

    const blocks = [];
    spec.split(/[,;]/).map(p => p.trim()).filter(Boolean).forEach(part => {
      const pair = part.match(/(\d+)\s*(?:x|\*|×|X)\s*(\d+)/);
      if (pair) {
        let a = +pair[1], b = +pair[2], count, minutes;
        if (a <= 12 && b > 12) { count = a; minutes = b; }
        else                   { minutes = a; count = b; }
        count   = Math.max(1, Math.min(50, count));
        minutes = Math.max(1, Math.min(300, minutes));
        for (let i = 0; i < count; i++) blocks.push({ topic: "", minutes, done: false });
      } else {
        const single = part.match(/(\d+)/);
        if (single) blocks.push({ topic: "", minutes: Math.min(300, +single[1]), done: false });
      }
    });

    if (!blocks.length) return;

    const topics = title ? title.split(",").map(t => t.trim()).filter(Boolean) : [];
    if (topics.length === blocks.length && topics.length > 1) {
      blocks.forEach((b, i) => (b.topic = topics[i]));
    } else {
      blocks.forEach((b, i) => (b.topic = "Topic " + (i + 1)));
    }

    out.push({ title: title || "Session", blocks });
  });

  return out;
}

/* ---------- MODAL ---------- */
const overlay    = $("#overlay");
const modalTitle = $("#modalTitle");
const modalBody  = $("#modalBody");

let modalClickHandler = null;
let openSectionId = null;

function openModal(title, html, onClick) {
  if (modalClickHandler) {
    modalBody.removeEventListener("click", modalClickHandler);
    modalClickHandler = null;
  }
  const modalEl = overlay.querySelector(".modal");
  if (modalEl) modalEl.classList.remove("wide", "xwide", "form-wide");
  modalTitle.textContent = title;
  modalBody.innerHTML = html;
  overlay.hidden = false;
  if (typeof onClick === "function") {
    modalClickHandler = onClick;
    modalBody.addEventListener("click", modalClickHandler);
  }
}

function closeModal() {
  if (modalClickHandler) {
    modalBody.removeEventListener("click", modalClickHandler);
    modalClickHandler = null;
  }
  overlay.hidden = true;
  const modalEl = overlay.querySelector(".modal");
  if (modalEl) modalEl.classList.remove("wide", "xwide", "form-wide");
  modalBody.innerHTML = "";
  pickerEl = null;
  openSectionId = null;
}

$("#modalClose").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !overlay.hidden) closeModal();
});

/* ---------- CREATE MODAL ---------- */
function openCreateModal(kind, groupId) {
  const isTpl = kind === "template";
  const backToSection = isTpl ? openSectionId : null;

  if (isTpl && !state.templateGroups.length) {
    state.templateGroups.push({ id: uid(), name: "General", templates: [] });
    save();
    renderTemplates();
  }

  const groupSelect = isTpl ? `
    <label class="fld">Section
      <select id="bGroup">
        ${state.templateGroups.map(g => `
          <option value="${g.id}" ${g.id === groupId ? "selected" : ""}>${esc(g.name)}</option>
        `).join("")}
      </select>
    </label>` : "";

  openModal(isTpl ? "New template" : "New session", `
    <div class="form-grid">
      <div class="fg-col">
        <label class="fld">Title
          <input id="bTitle" placeholder="${isTpl ? "e.g. Deep work 3h" : "e.g. Calculus"}" autocomplete="off">
        </label>
        ${groupSelect}
        <div class="two">
          <label class="fld">Minutes / block
            <input id="bMins" type="number" min="1" max="300" value="${state.settings.focus}">
          </label>
          <label class="fld">Blocks
            <input id="bCount" type="number" min="1" max="50" value="4">
          </label>
        </div>
        <label class="fld">Topics <span class="opt">— optional, comma separated</span>
          <textarea id="bTopics" rows="3" placeholder="Limits, Derivatives, Integrals, Series" autocomplete="off"></textarea>
        </label>
      </div>
      <div class="fg-col">
        ${isTpl ? `<div class="fld" style="margin-bottom:6px">Repeat on <span class="opt">— optional, shows in your Plan every week</span></div>${dayPickerMarkup([])}` : ""}
        <div class="fld" style="margin-bottom:6px">Resources <span class="opt">— optional</span></div>
        ${pickerMarkup([])}
      </div>
    </div>
    <div class="form-foot">
      <button class="btn primary wide" id="bCreate">
        ${isTpl ? "Create template" : "Create session"}
      </button>
    </div>
  `);
  { const mEl = overlay.querySelector(".modal"); if (mEl) mEl.classList.add("form-wide"); }

  initPicker();
  if (isTpl) initDayPicker();

  const titleIn = document.getElementById("bTitle");
  titleIn.focus();

  document.getElementById("bCreate").addEventListener("click", () => {
    const title    = titleIn.value.trim() || (isTpl ? "Untitled template" : "Untitled session");
    const mins     = Math.max(1, Math.min(300, +document.getElementById("bMins").value || 25));
    const count    = Math.max(1, Math.min(50, +document.getElementById("bCount").value || 1));
    const topics   = document.getElementById("bTopics").value.split(",").map(t => t.trim()).filter(Boolean);
    const resources = getPicked();

    const blocks = Array.from({ length: count }, (_, i) => ({
      topic: topics[i] || "",
      minutes: mins
    }));

    if (isTpl) {
      const gid = document.getElementById("bGroup").value;
      const group = state.templateGroups.find(g => g.id === gid) || state.templateGroups[0];
      const days = readDays();
      group.templates.push({ id: uid(), title, blocks, resources, days, daysSince: days.length ? dateKey(new Date()) : "", created: Date.now() });
      save(); closeModal(); renderTemplates();
      if (backToSection) openSectionModal(group.id);
      toast(`Template added to "${group.name}"`);
    } else {
      state.sessions.push({
        id: uid(), title,
        blocks: blocks.map(b => ({ ...b, done: false })),
        resources,
        created: Date.now()
      });
      save(); closeModal(); renderSessions();
    }
  });
}

$("#addBtn").addEventListener("click", () => openCreateModal("session"));
$("#addTplBtn").addEventListener("click", () => openCreateModal("template"));

/* ---------- IMPORT MODAL ---------- */
function openImportModal(kind) {
  const isTpl = kind === "template";

  if (isTpl && !state.templateGroups.length) {
    state.templateGroups.push({ id: uid(), name: "General", templates: [] });
    save();
  }

  const groupSelect = isTpl ? `
    <label class="fld">Add to section
      <select id="impGroup">
        ${state.templateGroups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}
      </select>
    </label>` : "";

  openModal(isTpl ? "Import templates" : "Import session", `
    <p class="hint">
      One ${isTpl ? "template" : "session"} per line. Format: <code>Title - 50x4</code> = 4 blocks of 50 min.<br>
      Name the blocks with commas: <code>Limits, Derivatives - 50x2</code>
    </p>
    ${groupSelect}
    <textarea id="impText" rows="5" spellcheck="false"
      placeholder="4 topics - 50x4&#10;Calculus - 25x2, 50x1"></textarea>
    <div class="preview" id="impPreview"></div>
    <button class="btn primary wide" id="impGo">Import</button>
  `);

  const ta   = document.getElementById("impText");
  const prev = document.getElementById("impPreview");

  let previewTimer = null;

  const doRefresh = () => {
    const list = parseSessions(ta.value);
    if (!list.length) {
      prev.innerHTML = `<div class="prev-empty">Nothing to import yet</div>`;
      return;
    }
    const shown = list.slice(0, 30);
    let html = shown.map(s => {
      const mins = s.blocks.reduce((a, b) => a + b.minutes, 0);
      return `<div class="prev-item">
                <b>${esc(s.title)}</b>
                <span>${s.blocks.length} block${s.blocks.length !== 1 ? "s" : ""} · ${mins} min</span>
              </div>`;
    }).join("");
    if (list.length > shown.length) {
      html += `<div class="prev-more">… and ${list.length - shown.length} more</div>`;
    }
    prev.innerHTML = html;
  };

  ta.addEventListener("input", () => {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(doRefresh, 90);
  });
  doRefresh();
  ta.focus();

  document.getElementById("impGo").addEventListener("click", () => {
    const list = parseSessions(ta.value);
    if (!list.length) return;

    if (isTpl) {
      const gid = document.getElementById("impGroup").value;
      const group = state.templateGroups.find(g => g.id === gid) || state.templateGroups[0];
      list.forEach(s => {
        group.templates.push({
          id: uid(),
          title: s.title,
          blocks: s.blocks.map(b => ({ topic: b.topic, minutes: b.minutes })),
          resources: [],
          created: Date.now()
        });
      });
    } else {
      list.forEach(s => {
        state.sessions.push({
          id: uid(), title: s.title, blocks: s.blocks, resources: [], created: Date.now()
        });
      });
    }

    save();
    closeModal();
    if (isTpl) renderTemplates(); else renderSessions();
    toast(`Imported ${list.length} ${isTpl ? "template" : "session"}${list.length !== 1 ? "s" : ""}`);
  });
}

$("#importBtn").addEventListener("click", () => openImportModal("session"));
$("#importTplBtn").addEventListener("click", () => openImportModal("template"));

/* ---------- SETTINGS ---------- */
function bindSetting(id, key, min, max) {
  const el = $(id);
  el.value = state.settings[key];
  el.addEventListener("change", () => {
    let v = +el.value || min;
    v = Math.max(min, Math.min(max, v));
    el.value = v;
    state.settings[key] = v;
    save();
    if (!timer.running && !timer.finished && !timer.sessionId) updateTimerUI();
    renderSessions();
  });
}

/* ---------- RESOURCES PANEL ---------- */
const resList = $("#resList");
const resForm = $("#resForm");

function renderResources() {
  if (!state.resources.length) {
    resList.innerHTML = `<div class="empty">No resources yet.${
      state.ui.hideResForm ? "" : "<br>Add links, books, PDFs above."
    }</div>`;
    return;
  }
  resList.innerHTML = state.resources.map(r => {
    const url = safeUrl(r.url);
    const name = url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`
      : esc(r.name);
    return `
      <div class="res" data-id="${r.id}">
        <div class="res-name">${name}</div>
        ${url ? `<span style="font-size:11px;color:var(--muted)">link</span>` : ""}
        <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
      </div>`;
  }).join("");
}

resForm.addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#resName").value.trim();
  if (!name) return;
  state.resources.push({ id: uid(), name, url: $("#resUrl").value.trim() });
  save(); renderResources();
  resForm.reset();
  $("#resName").focus();
});

resList.addEventListener("click", e => {
  const btn = e.target.closest("[data-act='del']");
  if (!btn) return;
  const row = e.target.closest(".res");
  const rid = row.dataset.id;

  state.resources = state.resources.filter(r => r.id !== rid);
  state.sessions.forEach(s => {
    if (Array.isArray(s.resources)) s.resources = s.resources.filter(x => x !== rid);
  });
  state.templateGroups.forEach(g => {
    g.templates.forEach(t => {
      if (Array.isArray(t.resources)) t.resources = t.resources.filter(x => x !== rid);
    });
  });

  save();
  renderResources();
  renderSessions();
  renderTemplates();
});

/* ---------- BOOT ---------- */
load();
restoreTimer();

bindSetting("#setFocus", "focus", 1, 180);
bindSetting("#setShort", "short", 1, 60);
bindSetting("#setLong",  "long",  1, 60);
bindSetting("#setEvery", "longEvery", 2, 12);

setTab(state.ui.tab);
applyResFormToggle();

renderSessions();
renderResources();
renderTemplates();
renderDashboard();
renderPlan();
updateTimerUI();

})();
</script>
