<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Plan</title>
<style>
  :root{
    --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f0f0f2;
    --text:#18181b; --muted:#71717a; --border:#e6e6e9;
    --accent:#5b5bd6; --accent-soft:rgba(91,91,214,.12); --on-accent:#fff;
    --break:#0f9d76;
    --warn:#d97706;
    --danger:#dc2626;
    --seg-track:#efeff1; --seg-active:#ffffff;
  }
  [data-theme="dark"]{
    --bg:#0a0a0c; --surface:#131316; --surface-2:#1b1b1f;
    --text:#f2f2f4; --muted:#8c8c96; --border:#26262c;
    --accent:#8b87ff; --accent-soft:rgba(139,135,255,.16); --on-accent:#0a0a0c;
    --break:#3ddc9a;
    --warn:#fbbf24;
    --danger:#f87171;
    --seg-track:#1b1b1f; --seg-active:#2c2c34;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    transition:background .2s ease,color .2s ease;
  }
  button{font:inherit}
  a{color:var(--accent)}

  .app{max-width:1020px;margin:0 auto;padding:26px 20px 60px}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .brand span{color:var(--accent)}
  .top-actions{display:flex;gap:6px}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--muted)}
  .icon-btn.sm{width:28px;height:28px;border-radius:8px;font-size:12px;background:transparent;border-color:transparent;color:var(--muted)}
  .icon-btn.sm:hover{background:var(--surface-2);color:var(--text)}

  .layout{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
  @media(max-width:860px){ .layout{grid-template-columns:1fr} }

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:18px;margin-bottom:18px;
  }
  .col-left .card{position:sticky;top:22px}
  @media(max-width:860px){ .col-left .card{position:static} }

  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .sec-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .sec-actions{display:flex;gap:8px;flex-wrap:wrap}

  .tabs{
    display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);
    border-radius:13px;padding:4px;margin-bottom:18px;
  }
  .tabs button{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:500;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--surface-2);color:var(--text)}
  @media(max-width:620px){ .tabs button{font-size:11.5px;padding:8px 3px} }
  .tab-panel[hidden]{display:none}

  .switch{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;border:0;padding:2px;cursor:pointer;
    font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);
  }
  .switch:hover{color:var(--text)}
  .switch .track{
    position:relative;width:32px;height:18px;flex-shrink:0;
    border-radius:99px;background:var(--surface-2);
    border:1px solid var(--border);transition:.18s;
  }
  .switch .track::after{
    content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:var(--muted);transition:.18s;
  }
  .switch.on .track{background:var(--accent-soft);border-color:var(--accent)}
  .switch.on .track::after{transform:translateX(14px);background:var(--accent)}

  .btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.wide{width:100%;margin-top:4px;padding:10px}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--border)}

  .timer-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .pill{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);
    padding:4px 9px;border-radius:99px;
  }
  .timer-session{
    font-size:12.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;
  }

  .ring-wrap{position:relative;width:196px;margin:10px auto 0}
  .ring{display:block;width:196px;height:196px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bg{stroke:var(--surface-2)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s linear,stroke .3s ease}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;pointer-events:none;
  }
  .time{
    font-size:38px;font-weight:300;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .time.over{color:var(--break)}
  .sub{font-size:12px;color:var(--muted);max-width:150px;text-align:center;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .adjust{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
  .adjust .btn{padding:5px 12px;font-size:12.5px;border-radius:99px;min-width:64px}
  .controls{display:flex;gap:8px;margin-top:18px}
  .controls.second{margin-top:8px}
  .controls .btn{flex:1;text-align:center;padding:9px 8px}

  .seg{display:flex;background:var(--seg-track);border-radius:11px;padding:3px;gap:3px;margin-top:14px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:7px 6px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--seg-active);color:var(--text);font-weight:500}
  .seg.sm{margin-top:0;flex:0 0 auto}
  .seg.sm button{padding:6px 11px;font-size:12.5px;flex:0 0 auto}

  details.settings{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  details.settings summary{
    cursor:pointer;font-size:12px;color:var(--muted);list-style:none;
    user-select:none;display:flex;align-items:center;gap:6px;
  }
  details.settings summary::-webkit-details-marker{display:none}
  details.settings summary::before{content:"›";transition:.2s;display:inline-block}
  details.settings[open] summary::before{transform:rotate(90deg)}
  details.settings .inner{padding-top:12px}

  .fld{display:block;margin-bottom:12px;font-size:12px;font-weight:500;color:var(--muted)}
  .fld .opt{font-weight:400;opacity:.7}
  input,textarea,select{
    display:block;width:100%;margin-top:5px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;
    font-weight:400;outline:none;transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;font-family:inherit}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}
  .session{
    border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px;
    transition:.18s;
  }
  .session.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .session.windowed{border-left:3px solid var(--accent)}
  .session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .session-title{font-weight:550;font-size:14.5px;letter-spacing:-.01em}
  .session-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .session-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .session-actions .btn{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .bar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:11px 0 9px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .blocks{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    font-size:11.5px;padding:3px 9px;border-radius:99px;
    background:var(--surface-2);color:var(--muted);
    cursor:pointer;user-select:none;transition:.15s;border:1px solid transparent;
  }
  .chip:hover{border-color:var(--border)}
  .chip.done{background:var(--accent-soft);color:var(--accent)}
  .chip.static{cursor:default}
  .chip.static:hover{border-color:transparent}
  .chip.link{text-decoration:none;color:var(--accent);background:var(--accent-soft);cursor:pointer}
  .chip.link:hover{border-color:var(--accent)}

  .res-mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}

  /* window session bar */
  .window-bar{
    display:flex;flex-direction:column;gap:6px;
    border-radius:11px;padding:10px 12px;margin-top:11px;
    background:var(--surface-2);border:1px solid var(--border);
    font-size:12.5px;color:var(--muted);
  }
  .window-bar.ok{border-color:rgba(15,157,118,.35);background:rgba(15,157,118,.07);color:var(--text)}
  .window-bar.tight{border-color:rgba(217,119,6,.35);background:rgba(217,119,6,.07);color:var(--text)}
  .window-bar.over{border-color:rgba(220,38,38,.35);background:rgba(220,38,38,.07);color:var(--text)}

  .window-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .window-range{
    display:inline-flex;align-items:center;gap:6px;
    font-variant-numeric:tabular-nums;color:var(--text);font-weight:500;
  }
  .window-range svg{color:var(--accent);flex-shrink:0}
  .window-delay{font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 6px}
  .window-countdown{font-variant-numeric:tabular-nums;font-weight:600}
  .window-countdown.active{color:var(--accent)}
  .window-countdown.upcoming{color:var(--muted)}
  .window-countdown.ended{color:var(--break)}

  .window-line-2{font-size:11.5px;gap:10px}
  .window-line-2 b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .window-status{
    margin-left:auto;font-weight:600;padding:2px 8px;border-radius:99px;
    font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .window-bar.ok .window-status{background:rgba(15,157,118,.16);color:var(--break)}
  .window-bar.tight .window-status{background:rgba(217,119,6,.16);color:var(--warn)}
  .window-bar.over .window-status{background:rgba(220,38,38,.16);color:var(--danger)}

  .window-pace{
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    letter-spacing:.02em;
  }
  .window-pace.ahead{background:rgba(15,157,118,.16);color:var(--break)}
  .window-pace.behind{background:rgba(217,119,6,.16);color:var(--warn)}
  .window-pace.even{background:rgba(139,139,150,.16);color:var(--muted)}
  .window-pace:empty{display:none}

  .res-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:14px}
  .res-form input{margin-top:0}
  @media(max-width:560px){ .res-form{grid-template-columns:1fr} }
  .res{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:7px;
  }
  .res-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-name a{text-decoration:none}
  .res-name a:hover{text-decoration:underline}

  .pick-list{max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:11px;padding:6px;overscroll-behavior:contain}
  .pick{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;
    content-visibility: auto;
    contain-intrinsic-size: auto 34px;
  }
  .pick:hover{background:var(--surface-2)}
  .pick input[type=checkbox]{
    display:block;width:15px;height:15px;margin:0;padding:0;flex:0 0 auto;
    accent-color:var(--accent);border-radius:4px;
  }
  .pick-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-url{font-size:11px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:16px}
  .pick-head{
    font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);padding:9px 9px 4px;
  }
  .pick-head:first-child{padding-top:2px}

  .window-preview{
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:11px;padding:11px 13px;margin:12px 0;
    display:flex;flex-direction:column;gap:6px;
  }
  .window-preview.ok{border-color:rgba(15,157,118,.4)}
  .window-preview.tight{border-color:rgba(217,119,6,.4)}
  .window-preview.over{border-color:rgba(220,38,38,.4)}
  .wp-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
  .wp-row b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .wp-status{
    color:var(--text);font-weight:500;padding-top:7px;
    border-top:1px solid var(--border);margin-top:2px;
  }
  .wp-status.ok{color:var(--break)}
  .wp-status.tight{color:var(--warn)}
  .wp-status.over{color:var(--danger)}

  .block-editor{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding:2px;overscroll-behavior:contain}
  [hidden]{display:none!important}
  /* plan checklist */
  .plan-view{margin:0 0 14px}
  .ck-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .ck-prog{flex:1;min-width:160px;font-size:12.5px;color:var(--muted)}
  .ck-prog b{color:var(--text);font-weight:600}
  .ck-bar{height:5px;margin-top:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .ck-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
  .ck-sec{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;background:var(--surface)}
  .ck-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px}
  .ck-fold{border:0;background:transparent;color:var(--muted);cursor:pointer;width:22px;height:22px;padding:0;font-size:12px}
  .ck-name{flex:1;min-width:0;font-weight:600;font-size:14px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ck-count{font-size:12px;color:var(--muted);margin-right:4px;white-space:nowrap}
  .ck-body{border-top:1px solid var(--border);padding:2px 10px 10px}
  .ck-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .ck-row input[type=checkbox]{display:block;width:17px;height:17px;margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
  .ck-title{font-size:14px;word-break:break-word}
  .ck-row.done .ck-title{text-decoration:line-through;color:var(--muted)}
  .ck-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .ck-meta:empty{display:none}
  .ck-chip{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .ck-chip.tpl{background:var(--accent-soft);color:var(--accent)}
  .ck-chip.over{background:rgba(220,38,38,.12);color:var(--danger)}
  .ck-chip.today{background:rgba(217,119,6,.14);color:var(--warn)}
  .ck-addrow{display:flex;gap:8px;margin-top:10px}
  .ck-addrow input{margin-top:0}
  .ck-pick{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:12px}
  .ck-pk{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .ck-pk:hover{background:var(--surface-2)}
  .ck-pk input{display:block;width:15px;height:15px;margin:0;padding:0;flex:0 0 auto;accent-color:var(--accent)}
  .ck-sech{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:8px 8px 2px}
  .ck-tplbox{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0 12px}
  .ck-tplbox pre{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px;font-size:11.5px;line-height:1.5;overflow:auto;max-height:170px;margin:6px 0 8px;white-space:pre}
  .ck-tplbox h4{margin:10px 0 0;font-size:12.5px}
  .ck-tplbox h4:first-child{margin-top:0}
  .ck-tplrow{display:flex;gap:8px;flex-wrap:wrap}
  .ck-ioacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  /* template editor: link block to task */
  .bt{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .bt .btn{padding:3px 9px;font-size:11px;border-radius:7px}
  .bt-state b{color:var(--accent);font-weight:500}
  .bt-unlink{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;text-decoration:underline;padding:0 2px}
  .bt-list{grid-column:1/-1;max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:3px;background:var(--surface)}
  .bt-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:6px 8px;border-radius:7px;font-size:13px;cursor:pointer}
  .bt-item:hover{background:var(--surface-2)}
  /* choice blocks: several tasks, pick one when the block starts */
  .block-row.is-choice{border-color:var(--accent);background:var(--accent-soft)}
  .block-row.is-choice .be-topic{color:var(--muted);font-style:italic}
  .block-row.is-choice .bt{display:none}
  .bc{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .bc-head{font-size:11.5px;color:var(--muted)}
  .bc-opt{display:flex;align-items:center;gap:6px;width:100%}
  .bc-opt input{flex:1;min-width:0}
  .bc-link{font-size:12px;color:var(--accent)}
  .bc-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bc-acts .btn,.bc>.btn{padding:3px 9px;font-size:11px;border-radius:7px}
  .bc-pick{width:100%;max-height:170px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:4px 8px;background:var(--surface)}
  .bc-pick[hidden]{display:none}
  .bc-pick .btn{margin:6px 0 2px}
  .chip-choose{margin-left:6px;padding:0 5px;border-radius:6px;color:var(--accent);background:var(--accent-soft);cursor:pointer;font-weight:600}
  .chip.choice:not(.done){border-style:dashed}
  .choice-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:55vh;overflow:auto}
  .choice-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:11px;font-size:14px;cursor:pointer;transition:.15s}
  .choice-opt:hover{border-color:var(--accent)}
  .choice-opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .choice-opt em{font-style:normal;font-size:11px;color:var(--accent);white-space:nowrap}
  .choice-foot{display:flex;gap:8px;flex-wrap:wrap}
  #backupBtn{position:relative}
  #backupBtn.nudge::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
  /* goals */

  .dp{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:8px}

  .dp input{position:absolute;opacity:0;pointer-events:none}
  .dp span{display:block;text-align:center;padding:7px 0;font-size:12.5px;border:1px solid var(--border);border-radius:9px;color:var(--muted);transition:.15s;user-select:none}
  .dp label:hover span{border-color:var(--muted)}
  .dp input:checked + span{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:500}
  .dp input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .dp-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .rec-badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;white-space:nowrap}

  /* plan: week strip + cards */
  .week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}
  .ws-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;transition:.15s;min-width:0}
  .ws-day:hover{border-color:var(--muted)}
  .ws-day.today .ws-num{color:var(--accent)}
  .ws-day.sel{border-color:var(--accent);background:var(--accent-soft)}
  .ws-dow{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .ws-num{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .ws-meta{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  @media(max-width:560px){ .ws-meta{display:none} }
  .plan-day-sum{display:block;margin-top:3px;font-size:11px}
  .plan-card{border:1px solid var(--border);border-radius:10px;transition:.15s;content-visibility:auto;contain-intrinsic-size:auto 70px}
  .plan-card:hover{border-color:var(--muted)}
  .plan-card .plan-item{border:0;border-radius:10px}
  .plan-card.done > .plan-item,.plan-card.done > .plan-blocks{opacity:.55}
  .plan-card.done .plan-title{text-decoration:line-through}
  .plan-card.rec{border-left:3px solid var(--accent)}
  .plan-blocks{display:flex;flex-wrap:wrap;gap:4px;padding:0 11px 9px 35px}
  .plan-blocks .chip{font-size:11px;padding:2px 8px}
  .plan-prog{height:3px;background:var(--surface-2);margin:0 11px 9px 35px;border-radius:99px;overflow:hidden}
  .plan-prog i{display:block;height:100%;background:var(--accent)}
  .rec-mark{color:var(--accent);margin-right:5px;font-weight:600}
  .plan-skipped{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .plan-skipped button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
  .cal-item.rec{background:transparent;border:1px dashed var(--accent)}

  .section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .section-card{
    display:flex;flex-direction:column;gap:10px;
    border:1px solid var(--border);border-radius:14px;padding:14px;
    background:var(--surface);cursor:pointer;transition:.15s;
  }
  .section-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .section-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .section-icon{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);flex-shrink:0;
  }
  .section-card-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
  .section-card:hover .section-card-actions,
  .section-card:focus-within .section-card-actions{opacity:1}
  @media(hover:none){ .section-card-actions{opacity:1} }
  .section-info{display:flex;flex-direction:column;gap:2px;min-width:0}
  .section-name{font-size:15px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .section-meta{font-size:12px;color:var(--muted)}
  .section-card-foot{display:flex;gap:6px;margin-top:auto}
  .section-card-foot .btn{flex:1;text-align:center}
  .tpl-empty{font-size:12.5px;color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--border);border-radius:10px}

  .bk-file{margin:0 0 12px}
  .bk-file-lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .bk-file-row{display:flex;align-items:center;gap:10px;min-width:0}
  .bk-browse{cursor:pointer;padding:9px 16px;flex:0 0 auto}
  .bk-fname{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .bk-file-in{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
  .bk-file:focus-within .bk-browse{outline:2px solid var(--accent);outline-offset:2px}
  .bk-alt{margin:0 0 12px;font-size:12.5px}
  .bk-alt summary{cursor:pointer;color:var(--muted);padding:4px 0}
  .bk-alt textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
  .backup-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  @media(max-width:480px){ .backup-stat-grid{grid-template-columns:repeat(2,1fr)} }
  .backup-stat{background:var(--surface-2);border-radius:10px;padding:9px 11px;text-align:center}
  .backup-stat b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .backup-stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .backup-row{display:flex;gap:8px;margin-bottom:12px}
  .backup-row .btn{flex:1;padding:11px}
  .backup-meta{font-size:11.5px;color:var(--muted);line-height:1.55;margin:0}
  .backup-warn{
    display:flex;gap:9px;align-items:flex-start;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;margin-top:12px;
    font-size:12px;color:var(--muted);line-height:1.5;
  }
  .backup-warn svg{flex-shrink:0;margin-top:1px;color:var(--accent)}

  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(0,0,0,.55);
    contain: strict;
  }
  .overlay[hidden]{display:none}
  .modal{
    width:100%;max-width:470px;max-height:86vh;overflow:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
    contain: content;
    overscroll-behavior: contain;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .modal-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--text);
  }
  .preview{margin:12px 0;max-height:160px;overflow:auto;overscroll-behavior:contain}
  .prev-item{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface-2);margin-bottom:5px;
    content-visibility: auto;
    contain-intrinsic-size: auto 34px;
  }
  .prev-item span{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .prev-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:10px}
  .prev-more{font-size:11.5px;color:var(--muted);text-align:center;padding:8px}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:var(--bg);
    padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;
    opacity:0;pointer-events:none;transition:.22s ease;z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    contain: layout paint;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">study<span>plan</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="backupBtn" title="Backup & restore" aria-label="Backup & restore">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <div class="layout">
    <aside class="col-left">
      <div class="card">
        <div class="timer-top">
          <span class="pill" id="phaseEl">Focus</span>
          <span class="timer-session" id="sessionEl">No session</span>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200">
            <circle class="bg" cx="100" cy="100" r="92"></circle>
            <circle class="fg" id="ringFg" cx="100" cy="100" r="92"
                    stroke-dasharray="578.05" stroke-dashoffset="578.05"></circle>
          </svg>
          <div class="ring-center">
            <div class="time" id="timeEl">25:00</div>
            <div class="sub" id="subEl">Pick a session</div>
          </div>
        </div>

        <div class="adjust">
          <button class="btn" id="minusBtn" title="Remove 1 minute" aria-label="Remove 1 minute">− 1 min</button>
          <button class="btn" id="plusBtn" title="Add 1 minute" aria-label="Add 1 minute">+ 1 min</button>
        </div>

        <div class="controls">
          <button class="btn primary" id="startBtn" disabled>Start</button>
          <button class="btn" id="resetBtn">Reset</button>
          <button class="btn" id="skipBtn">Skip</button>
        </div>
        <div class="controls second">
          <button class="btn" id="completeBtn" title="Mark this block as done now and move on">✓ Complete block</button>
        </div>

        <div class="seg" id="modeSeg">
          <button data-mode="pomodoro">Pomodoro</button>
          <button data-mode="freeflow">Free flow</button>
        </div>

        <details class="settings">
          <summary>Timer settings</summary>
          <div class="inner">
            <div class="two">
              <label class="fld">Focus (min)<input id="setFocus" type="number" min="1" max="180"></label>
              <label class="fld">Short break<input id="setShort" type="number" min="1" max="60"></label>
            </div>
            <div class="two">
              <label class="fld">Long break<input id="setLong" type="number" min="1" max="60"></label>
              <label class="fld">Long every<input id="setEvery" type="number" min="2" max="12"></label>
            </div>
          </div>
        </details>
      </div>
    </aside>

    <main class="col-right">

      <div class="tabs" id="tabBar" role="tablist">
        <button data-tab="sessions"  role="tab" class="on">Sessions</button>
        <button data-tab="plan"      role="tab">Plan</button>
        <button data-tab="dashboard" role="tab">Dashboard</button>
        <button data-tab="history"   role="tab">History</button>
        <button data-tab="resources" role="tab">Resources</button>
        <button data-tab="templates" role="tab">Templates</button>
      </div>

      <section class="card tab-panel" data-panel="sessions" role="tabpanel">
        <div class="sec-head">
          <h2>Sessions</h2>
          <div class="sec-actions">
            <button class="btn" id="importBtn">Import</button>
            <button class="btn" id="overviewBtn" hidden>Overview</button>
            <button class="btn" id="logBtnSessions">Log activity</button>
            <button class="btn" id="addWindowBtn">Time window</button>
            <button class="btn primary" id="addBtn">+ New</button>
          </div>
        </div>
        <div id="sessionList"></div>
      </section>

      <section class="card tab-panel" data-panel="plan" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Plan</h2>
          <div class="seg sm" id="planSeg">
            <button data-range="day">Day</button>
            <button data-range="week" class="on">Week</button>
            <button data-range="month">Month</button>
          </div>
        </div>
        <div class="seg plan-view" id="planViewSeg">
          <button data-view="calendar" class="on">Schedule</button>
          <button data-view="checklist">Checklist</button>
        </div>
        <div id="planCal">
          <div class="plan-nav">
            <button class="icon-btn sm" id="planPrev" title="Previous">‹</button>
            <span class="lbl" id="planLabel"></span>
            <button class="icon-btn sm" id="planNext" title="Next">›</button>
            <button class="btn sm" id="planToday">Today</button>
          </div>
          <div id="planBody"></div>
        </div>
        <div id="planChecklist" hidden></div>
      </section>

      <section class="card tab-panel" data-panel="dashboard" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Dashboard</h2>
          <div class="seg sm" id="dashSeg">
            <button data-range="day">Day</button>
            <button data-range="week" class="on">Week</button>
            <button data-range="month">Month</button>
            <button data-range="all">All</button>
          </div>
        </div>
        <div id="dashBody"></div>
      </section>

      <section class="card tab-panel" data-panel="history" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>History</h2>
          <div class="sec-actions">
            <div class="seg sm" id="histViewSeg">
              <button data-hview="list" class="on">List</button>
              <button data-hview="calendar">Calendar</button>
            </div>
            <div class="seg sm" id="histSeg">
              <button data-range="day">Today</button>
              <button data-range="week" class="on">7 days</button>
              <button data-range="month">30 days</button>
              <button data-range="all">All</button>
            </div>
            <button class="btn primary" id="logBtn">+ Log activity</button>
          </div>
        </div>
        <div class="h-filters">
          <input id="histSearch" type="search" placeholder="Search activity, topic or note" autocomplete="off">
          <select id="histSource" aria-label="Filter by source">
            <option value="all">All entries</option>
            <option value="timer">From timer</option>
            <option value="manual">Logged manually</option>
          </select>
        </div>
        <div id="historyBody"></div>
        <div id="historyCal" hidden></div>
      </section>

      <section class="card tab-panel" data-panel="resources" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Resources</h2>
          <button class="switch on" id="formToggle" role="switch" aria-checked="true"
                  title="Show or hide the add-resource form">
            <span class="track"></span>
            <span class="lbl">Add form</span>
          </button>
        </div>

        <div id="resFormWrap">
          <form class="res-form" id="resForm">
            <input id="resName" placeholder="Resource name" autocomplete="off" required>
            <input id="resUrl" placeholder="https:// (optional)" autocomplete="off">
            <button class="btn primary" type="submit">Add</button>
          </form>
        </div>

        <div id="resList"></div>
      </section>

      <section class="card tab-panel" data-panel="templates" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Templates</h2>
          <div class="sec-actions">
            <button class="btn" id="importTplBtn">Import</button>
            <button class="btn" id="addGroupBtn">+ Section</button>
            <button class="btn primary" id="addTplBtn">+ Template</button>
          </div>
        </div>
        <p class="hint" style="margin-top:-4px">
          Sections are shown as cards. Click a card to open its templates — each one can
          <b>create a session</b>, be <b>added to your plan</b>, be <b>edited</b>, or hold resources.
        </p>
        <div id="templateList"></div>
      </section>

    </main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn sm" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

const KEY = "studyplan.v1";
const TIMER_KEY = "studyplan.timer.v1";
const BASE_TITLE = "Study Plan";
const TABS = ["sessions", "plan", "dashboard", "history", "resources", "templates"];
const DAY = 86400000;
const BACKUP_VERSION = 2;
const $ = (s, r = document) => r.querySelector(s);

let state = {
  theme: null,
  lastBackup: null,
  ui: {
    tab: "sessions",
    hideResForm: false,
    dashRange: "week",
    planRange: "week",
    histRange: "week",
    histView: "list",
    planView: "calendar",
    ckHideDone: false,
    planAnchor: null
  },
  settings: { mode: "pomodoro", focus: 25, short: 5, long: 15, longEvery: 4 },
  sessions: [],
  resources: [],
  templates: [],
  templateGroups: [],
  checklist: [],
  goals: { daily: 0, weekly: 0, streak: 0, streakMode: "any" },
  plans: [],
  recurLog: {},
  history: []
};

let timer = {
  sessionId: null, blockIndex: 0, phase: "work",
  running: false, remaining: 0, elapsed: 0, total: 0,
  lastTick: 0, longBreak: false, notified: false, finished: false,
  skippedBreaks: 0
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const RING_C = 2 * Math.PI * 92;

const ICON_LINK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
const ICON_SECTION = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-7.5l-2-2H4a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1z"/></svg>`;
const ICON_TIMELINE = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>`;
const ICON_CLOCK = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

function dateKey(d) {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function startOfWeek(d) {
  const x = startOfDay(d);
  const dow = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - dow);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

/* ---------- BREAK HELPERS ---------- */
/* Per-window break override: if the session has window.breakMinutes set,
   it is used for every break (short and long) inside that window.
   Otherwise the global settings are used. */
function getBreakMins(s, isLong, explicitOverride) {
  if (typeof explicitOverride === "number" && explicitOverride > 0) return explicitOverride;
  if (s && s.window && typeof s.window.breakMinutes === "number" && s.window.breakMinutes > 0) {
    return s.window.breakMinutes;
  }
  return isLong ? state.settings.long : state.settings.short;
}

/* ---------- PERSISTENCE ---------- */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = {
        ...state, ...d,
        ui:        { ...state.ui, ...(d.ui || {}) },
        settings:  { ...state.settings, ...(d.settings || {}) },
        sessions:  Array.isArray(d.sessions)  ? d.sessions  : [],
        resources: Array.isArray(d.resources) ? d.resources : [],
        plans:     Array.isArray(d.plans)     ? d.plans     : [],
        recurLog:  (d.recurLog && typeof d.recurLog === "object" && !Array.isArray(d.recurLog)) ? d.recurLog : {},
        history:   Array.isArray(d.history)   ? d.history   : []
      };

      if (Array.isArray(d.templateGroups)) {
        state.templateGroups = d.templateGroups;
      } else if (Array.isArray(d.templates) && d.templates.length) {
        state.templateGroups = [{ id: uid(), name: "General", templates: d.templates }];
      } else {
        state.templateGroups = [];
      }
      state.templates = [];
    }
  } catch (e) {}

  if (!state.theme) {
    state.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  if (!TABS.includes(state.ui.tab)) state.ui.tab = "sessions";
  if (!["day", "week", "month", "all"].includes(state.ui.dashRange)) state.ui.dashRange = "week";
  if (!["day", "week", "month"].includes(state.ui.planRange)) state.ui.planRange = "week";
  if (!["day", "week", "month", "all"].includes(state.ui.histRange)) state.ui.histRange = "week";
  if (!["calendar", "checklist"].includes(state.ui.planView)) state.ui.planView = "calendar";
  state.ui.ckHideDone = !!state.ui.ckHideDone;
  if (!["list", "calendar"].includes(state.ui.histView)) state.ui.histView = "list";
  if (!state.ui.planAnchor) state.ui.planAnchor = dateKey(new Date());
  if (typeof state.lastBackup !== "number") state.lastBackup = null;

  normalise();
  applyTheme();
}

function normalise() {
  state.sessions.forEach(s => {
    if (!Array.isArray(s.blocks)) s.blocks = [];
    if (!Array.isArray(s.resources)) s.resources = [];
    s.blocks.forEach(b => { if (typeof b.done !== "boolean") b.done = false; });
    if (s.window) {
      if (typeof s.window.start !== "string" || typeof s.window.end !== "string") {
        s.window = null;
      } else {
        if (!Array.isArray(s.window.templateIds)) s.window.templateIds = [];
        if (typeof s.window.pausedMs !== "number" || !(s.window.pausedMs > 0)) s.window.pausedMs = 0;
        if (typeof s.window.breakMinutes !== "number" || !(s.window.breakMinutes > 0)) {
          s.window.breakMinutes = null;
        }
      }
    }
  });
  state.templateGroups.forEach(g => {
    if (!Array.isArray(g.templates)) g.templates = [];
    g.templates.forEach(t => {
      if (!Array.isArray(t.blocks)) t.blocks = [];
      t.blocks.forEach(b => { b.days = cleanDays(b.days); normBlockOptions(b); });
      if (!Array.isArray(t.resources)) t.resources = [];
      t.days = Array.isArray(t.days) ? [...new Set(t.days.map(Number).filter(n => n >= 0 && n <= 6))] : [];
      if (typeof t.daysSince !== "string") t.daysSince = "";
      const w = t.window;
      if (!w || typeof w.start !== "string" || typeof w.end !== "string" || !w.start || !w.end) {
        t.window = null;
      } else if (typeof w.breakMinutes !== "number" || !(w.breakMinutes > 0)) {
        w.breakMinutes = null;
      }
    });
  });
  if (!state.recurLog || typeof state.recurLog !== "object") state.recurLog = {};
  {
    const gl = (state.goals && typeof state.goals === "object") ? state.goals : {};
    const n = (v, max) => Math.max(0, Math.min(max, Math.round(+v) || 0));
    state.goals = { daily: n(gl.daily, 1440), weekly: n(gl.weekly, 10080), streak: n(gl.streak, 3650),
                    streakMode: gl.streakMode === "goal" ? "goal" : "any" };
  }
  if (!Array.isArray(state.checklist)) state.checklist = [];
  state.checklist = state.checklist.filter(g => g && typeof g === "object");
  state.checklist.forEach(g => {
    if (!g.id) g.id = uid();
    if (typeof g.name !== "string" || !g.name.trim()) g.name = "Section";
    g.collapsed = !!g.collapsed;
    if (!Array.isArray(g.tasks)) g.tasks = [];
    g.tasks = g.tasks.filter(t => t && typeof t.title === "string");
    g.tasks.forEach(t => {
      if (!t.id) t.id = uid();
      t.done = !!t.done;
      if (typeof t.due !== "string") t.due = "";
      if (typeof t.created !== "number") t.created = Date.now();
    });
  });
  state.templateGroups.forEach(g => g.templates.forEach(t => t.blocks.forEach(b => {
    if (b.taskId && !findTask(b.taskId)) delete b.taskId;
    if (isChoice(b)) b.options.forEach(o => { if (o.taskId && !findTask(o.taskId)) delete o.taskId; });
  })));
  state.history = state.history.filter(h => h && typeof h.ts === "number" && isFinite(h.ts) && typeof h.minutes === "number" && h.minutes > 0);
  state.history.forEach(h => {
    if (!h.id) h.id = uid();
    if (typeof h.sessionTitle !== "string") h.sessionTitle = "";
    if (typeof h.topic !== "string") h.topic = "";
    if (typeof h.note !== "string") h.note = "";
    if (!h.sessionId) h.sessionId = h.manual ? "manual:" + h.sessionTitle.toLowerCase() : "unknown";
  });
  state.history.sort((a, b) => a.ts - b.ts);
  state.sessions.forEach(tagLegacyWindowBlocks);
  state.sessions.forEach(x => (x.blocks || []).forEach(normBlockOptions));
  state.plans.forEach(p => {
    if (!Array.isArray(p.blocks)) p.blocks = [];
    p.blocks.forEach(normBlockOptions);
    if (!Array.isArray(p.resources)) p.resources = [];
    if (typeof p.done !== "boolean") p.done = false;
    const w = p.window;
    if (!w || typeof w.start !== "string" || typeof w.end !== "string" || !w.start || !w.end) p.window = null;
    else if (typeof w.breakMinutes !== "number" || !(w.breakMinutes > 0)) w.breakMinutes = null;
  });
}

/* Older window sessions don't know which template each block came from.
   Rebuild that link when the block count still matches the chosen templates. */
function tagLegacyWindowBlocks(s) {
  if (!s.window || !s.blocks.length) return;
  if (s.blocks.some(b => b.tpl)) return;
  const tpls = (s.window.templateIds || []).map(findTemplate);
  if (!tpls.length || tpls.some(t => !t)) return;
  if (tpls.reduce((a, t) => a + t.blocks.length, 0) !== s.blocks.length) return;
  let i = 0;
  tpls.forEach(t => {
    for (let k = 0; k < t.blocks.length; k++, i++) {
      s.blocks[i].tpl = t.id;
      s.blocks[i].tplTitle = t.title;
    }
  });
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- TIMER PERSISTENCE ---------- */
function saveTimer() {
  try {
    localStorage.setItem(TIMER_KEY, JSON.stringify({
      sessionId:     timer.sessionId,
      blockIndex:    timer.blockIndex,
      phase:         timer.phase,
      longBreak:     timer.longBreak,
      running:       timer.running,
      remaining:     timer.remaining,
      elapsed:       timer.elapsed,
      total:         timer.total,
      finished:      timer.finished,
      notified:      timer.notified,
      skippedBreaks: timer.skippedBreaks,
      mode:          state.settings.mode,
      savedAt:       Date.now()
    }));
  } catch (e) {}
}

function clearSavedTimer() {
  try { localStorage.removeItem(TIMER_KEY); } catch (e) {}
}

let timerSaveAcc = 0;

function restoreTimer() {
  let snap = null;
  try {
    const raw = localStorage.getItem(TIMER_KEY);
    if (raw) snap = JSON.parse(raw);
  } catch (e) { snap = null; }
  if (!snap || !snap.sessionId) return;

  const s = getSession(snap.sessionId);
  if (!s || !s.blocks.length) { clearSavedTimer(); return; }

  timer.sessionId     = snap.sessionId;
  timer.blockIndex    = Math.max(0, Math.min(snap.blockIndex || 0, s.blocks.length - 1));
  timer.phase         = snap.phase === "break" ? "break" : "work";
  timer.longBreak     = !!snap.longBreak;
  timer.total         = +snap.total || 0;
  timer.remaining     = Math.max(0, +snap.remaining || 0);
  timer.elapsed       = Math.max(0, +snap.elapsed || 0);
  timer.finished      = !!snap.finished;
  timer.notified      = !!snap.notified;
  timer.skippedBreaks = snap.skippedBreaks || 0;
  timer.running       = !!snap.running && !timer.finished;

  const awaySec = Math.max(0, (Date.now() - (+snap.savedAt || Date.now())) / 1000);
  if (timer.running && awaySec > 0.5) catchUp(awaySec);
  else if (!timer.running && !timer.finished && s.window && awaySec > 0.5) {
    const b = windowBounds(s.window);
    if (b) {
      const from = Math.max(+snap.savedAt || Date.now(), b[0]);
      const to   = Math.min(Date.now(), b[1]);
      if (to > from) s.window.pausedMs = (s.window.pausedMs || 0) + (to - from);
    }
  }

  timer.lastTick = Date.now();
  save();
  saveTimer();
}

/* Replay the time that passed while the page was closed. */
function catchUp(dt) {
  const s = getSession(timer.sessionId);
  if (!s) { timer.running = false; return; }

  if (state.settings.mode === "freeflow") { timer.elapsed += dt; return; }

  let guard = 0;
  while (dt > 0.001 && guard++ < 200) {
    if (timer.finished) { timer.running = false; break; }
    if (dt < timer.remaining) { timer.remaining -= dt; dt = 0; break; }
    dt -= timer.remaining;
    timer.remaining = 0;
    timer.running = true;
    endPhase({ silent: true });
  }
  if (guard >= 200) timer.running = false;
}

/* ---------- TOAST ---------- */
const toastEl = $("#toast");
let toastTimer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* ---------- THEME ---------- */
const themeBtn = $("#themeBtn");

function applyTheme() {

    : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
}

themeBtn.addEventListener("click", () => {

  applyTheme();
  save();
});

/* ---------- TABS ---------- */
const tabBar = $("#tabBar");

function setTab(tab) {

  state.ui.tab = tab;

  [...tabBar.children].forEach(b => {

/* ---------- RESOURCE FORM TOGGLE ---------- */
const formToggle  = $("#formToggle");
const resFormWrap = $("#resFormWrap");

function applyResFormToggle() {

  resFormWrap.hidden = !visible;
  formToggle.classList.toggle("on", visible);
  formToggle.setAttribute("aria-checked", String(visible));
}

  save();
  applyResFormToggle();

/* ---------- AUDIO ---------- */
let actx = null;
function beep(freq = 660, dur = 0.45) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = "sine"; o.frequency.value = freq;
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

/* ---------- HISTORY ---------- */
function logStudy(minutes, session, block) {
  if (!minutes || minutes < 0.05) return;
  const before = goalSnapshot();
  state.history.push({
    id: uid(),
    ts: Date.now(),
    minutes: Math.round(minutes * 100) / 100,
    sessionId: session.id,
    sessionTitle: session.title,
    topic: (block && block.topic) || ""
  });
  if (state.history.length > 8000) state.history = state.history.slice(-8000);
  save();
  const msg = milestoneMsg(before, goalSnapshot());
  if (msg) toast(msg);
  if (state.ui.tab === "dashboard") renderDashboard();
  if (state.ui.tab === "history") renderHistory();
}

/* ---------- TIMER CORE ---------- */
const ringFg   = $("#ringFg");
const timeEl   = $("#timeEl");
const subEl    = $("#subEl");
const phaseEl  = $("#phaseEl");
const sessionEl= $("#sessionEl");
const startBtn = $("#startBtn");
const resetBtn = $("#resetBtn");
const skipBtn  = $("#skipBtn");
const plusBtn  = $("#plusBtn");
const minusBtn = $("#minusBtn");
const completeBtn = $("#completeBtn");
const modeSeg  = $("#modeSeg");

const getSession = id => state.sessions.find(s => s.id === id);

function findTemplate(id) {
  for (const g of state.templateGroups) {
    const t = g.templates.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}

function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}

/* Effective time including breaks, using the session's own break override. */
function effectiveMinutes(workMinutes, blockCount, mode, s, explicitOverride) {
  if (mode !== "pomodoro" || blockCount <= 1) return workMinutes;
  const every = state.settings.longEvery;
  let total = workMinutes;
  for (let i = 1; i <= blockCount - 1; i++) {
    total += getBreakMins(s, i % every === 0, explicitOverride);
  }
  return total;
}

/* Effective time still to do for a (partially done) session */
function remainingEffective(s, mode) {
  const firstUndone = s.blocks.findIndex(b => !b.done);
  if (firstUndone === -1) return 0;

  const remainWork = s.blocks.slice(firstUndone).reduce((a, b) => a + b.minutes, 0);
  if (mode !== "pomodoro") return remainWork;

  const n = s.blocks.length;
  const every = state.settings.longEvery;

  const startGap = Math.max(0, firstUndone - 1);
  let breakMin = 0;
  for (let i = startGap; i <= n - 2; i++) {
    breakMin += getBreakMins(s, (i + 1) % every === 0);
  }
  return remainWork + breakMin;
}

function loadPhase() {
  const s = getSession(timer.sessionId);
  if (!s) return;
  const b = s.blocks[timer.blockIndex];
  if (!b) return;

  timer.notified = false;
  timer.elapsed = 0;

  if (state.settings.mode === "freeflow") {
    timer.total = b.minutes * 60;
    timer.remaining = 0;
  } else {
    if (timer.phase === "work") {
      timer.total = b.minutes * 60;
    } else {
      timer.total = getBreakMins(s, timer.longBreak) * 60;
    }
    timer.remaining = timer.total;
  }
}

function startSession(id) {
  const s = getSession(id);
  if (!s || !s.blocks.length) return;

  let idx = s.blocks.findIndex(b => !b.done);
  if (idx === -1) {
    s.blocks.forEach(b => (b.done = false));
    idx = 0;
    save();
  }

  timer.sessionId  = id;
  timer.blockIndex = idx;
  timer.phase      = "work";
  timer.longBreak  = false;
  timer.finished   = false;
  timer.notified   = false;
  timer.skippedBreaks = 0;

  loadPhase();
  timer.running  = true;
  timer.lastTick = Date.now();

  renderSessions();
  updateTimerUI();
  saveTimer();
  promptChoiceIfNeeded();
}

function resetPhase() {
  if (!timer.sessionId) return;
  timer.finished = false;
  timer.running  = false;
  timer.skippedBreaks = 0;
  loadPhase();
  updateTimerUI();
  saveTimer();
}

function finishSession(s, silent) {
  timer.running  = false;
  timer.finished = true;
  if (!silent) {
    beep(880, 0.35);
    setTimeout(() => beep(1046, 0.5), 170);
  }
  renderSessions();
}

/* Should we skip the upcoming break because it doesn't fit in the window? */
function shouldSkipBreak(s, nextBlockIndex) {
  if (!s.window) return false;
  if (state.settings.mode !== "pomodoro") return false;

  const wb = windowBounds(s.window);
  if (!wb) return false;

  const nowSec = Date.now() / 1000;
  const startSec = wb[0] / 1000;
  const endSec   = wb[1] / 1000;

  if (nowSec < startSec || nowSec >= endSec) return false;

  const isLong = ((nextBlockIndex) % state.settings.longEvery === 0);
  const breakSecs = getBreakMins(s, isLong) * 60;

  const remainWorkSecs = s.blocks.slice(nextBlockIndex)
    .reduce((a, x) => a + x.minutes * 60, 0);

  let futureBreakSecs = 0;
  const n = s.blocks.length;
  for (let i = nextBlockIndex; i <= n - 2; i++) {
    const lng = ((i + 1) % state.settings.longEvery === 0);
    futureBreakSecs += getBreakMins(s, lng) * 60;
  }

  return (nowSec + breakSecs + remainWorkSecs + futureBreakSecs) > endSec;
}

function endPhase(opts) {
  const silent = !!(opts && opts.silent);
  const s = getSession(timer.sessionId);
  if (!s) return;

  const wasRunning = timer.running;
  const mode = state.settings.mode;

  if (mode === "freeflow") {
    logStudy(timer.elapsed / 60, s, s.blocks[timer.blockIndex]);
    s.blocks[timer.blockIndex].done = true;
    completeTaskFromBlock(s.blocks[timer.blockIndex]);
    if (timer.blockIndex < s.blocks.length - 1) {
      timer.blockIndex++;
      loadPhase();
      timer.running  = wasRunning;
      timer.lastTick = Date.now();
    } else {
      finishSession(s, silent);
    }
  } else if (timer.phase === "work") {
    logStudy((timer.total - timer.remaining) / 60, s, s.blocks[timer.blockIndex]);
    s.blocks[timer.blockIndex].done = true;
    completeTaskFromBlock(s.blocks[timer.blockIndex]);
    if (timer.blockIndex >= s.blocks.length - 1) {
      finishSession(s, silent);
    } else {
      const nextIdx = timer.blockIndex + 1;
      const isLong = ((nextIdx) % state.settings.longEvery === 0);

      if (shouldSkipBreak(s, nextIdx)) {
        timer.blockIndex = nextIdx;
        timer.phase = "work";
        timer.longBreak = false;
        timer.skippedBreaks = (timer.skippedBreaks || 0) + 1;
        loadPhase();
        timer.running  = wasRunning;
        timer.lastTick = Date.now();
        if (!silent) toast("Break skipped — no time to spare");
      } else {
        timer.longBreak = isLong;
        timer.phase = "break";
        loadPhase();
        timer.running  = wasRunning;
        timer.lastTick = Date.now();
        if (!silent) beep(520, 0.4);
      }
    }
  } else {
    timer.blockIndex++;
    timer.phase = "work";
    loadPhase();
    timer.running  = wasRunning;
    timer.lastTick = Date.now();
    if (!silent) beep(760, 0.35);
  }

  save();
  if (!silent) saveTimer();
  renderSessions();
  updateTimerUI();
}

setInterval(() => {
  if (!timer.running || !timer.sessionId) return;

  const now = Date.now();
  const dt  = (now - timer.lastTick) / 1000;
  timer.lastTick = now;

  const s = getSession(timer.sessionId);
  if (!s) { timer.running = false; return; }
  if (promptChoiceIfNeeded()) return;

  if (state.settings.mode === "freeflow") {
    timer.elapsed += dt;
    const b = s.blocks[timer.blockIndex];
    if (b && !timer.notified && timer.elapsed >= b.minutes * 60) {
      timer.notified = true;
      beep(700, 0.4);
    }
  } else {
    timer.remaining -= dt;
    if (timer.remaining <= 0) {
      timer.remaining = 0;
      updateTimerUI();
      endPhase();
      return;
    }
  }

  timerSaveAcc += dt;
  if (timerSaveAcc >= 1) { timerSaveAcc = 0; saveTimer(); }

  updateTimerUI();
}, 250);

window.addEventListener("pagehide", saveTimer);
window.addEventListener("beforeunload", saveTimer);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) saveTimer();
});

/* ---------- TIMER UI ---------- */
function updateTimerUI() {
  const s    = getSession(timer.sessionId);
  const mode = state.settings.mode;

  let secs, progress, phase, sub, over = false;

  if (!s) {
    secs     = mode === "pomodoro" ? state.settings.focus * 60 : 0;
    progress = 0;
    phase    = mode === "pomodoro" ? "Focus" : "Free flow";
    sub      = "Pick a session";
    sessionEl.textContent = "No session";
  } else if (timer.finished) {
    secs     = 0;
    progress = 1;
    phase    = "Complete";
    sub      = "All blocks done";
    sessionEl.textContent = s.title;
  } else {
    const b = s.blocks[timer.blockIndex] || { minutes: 25, topic: "" };

    if (mode === "freeflow") {
      secs     = timer.elapsed;
      progress = Math.min(timer.elapsed / (b.minutes * 60), 1);
      over     = timer.elapsed >= b.minutes * 60;
      phase    = "Free flow";
    } else if (timer.phase === "work") {
      secs     = timer.remaining;
      progress = timer.total ? 1 - timer.remaining / timer.total : 0;
      phase    = "Focus";
    } else {
      secs     = timer.remaining;
      progress = timer.total ? 1 - timer.remaining / timer.total : 0;
      phase    = timer.longBreak ? "Long break" : "Break";
    }

    sub = `Block ${timer.blockIndex + 1}/${s.blocks.length} · ${b.topic || "Untitled"}`;
    sessionEl.textContent = s.title;
  }

  timeEl.textContent = fmtTime(secs);
  timeEl.classList.toggle("over", over);
  phaseEl.textContent = phase;
  subEl.textContent   = sub;

  const p = Math.max(0, Math.min(1, progress));
  ringFg.style.strokeDashoffset = String(RING_C * (1 - p));
  ringFg.style.stroke =
    (s && !timer.finished && mode === "pomodoro" && timer.phase === "break")
      ? "var(--break)" : "var(--accent)";

  startBtn.disabled = !timer.sessionId;
  skipBtn.disabled  = !timer.sessionId || timer.finished;
  resetBtn.disabled = !timer.sessionId;
  const active = !!timer.sessionId && !timer.finished;
  const isWork = mode === "freeflow" || timer.phase === "work";
  plusBtn.disabled  = !active;
  minusBtn.disabled = !active || (mode === "freeflow"
      ? ((s && s.blocks[timer.blockIndex] ? s.blocks[timer.blockIndex].minutes : 1) <= 1)
      : timer.remaining <= 60);
  completeBtn.disabled = !active || !isWork;

  startBtn.textContent = timer.finished ? "Restart"
                       : timer.running  ? "Pause"
                       : (timer.sessionId ? "Resume" : "Start");

  [...modeSeg.children].forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));

  updateTitle(secs);
}

function updateTitle(secs) {
  const s = getSession(timer.sessionId);
  if (!s) { document.title = BASE_TITLE; return; }
  if (timer.finished) { document.title = `✓ Done · ${BASE_TITLE}`; return; }
  const prefix = timer.running ? "▶ " : "⏸ ";
  document.title = `${prefix}${fmtTime(secs)} · ${BASE_TITLE}`;
}

startBtn.addEventListener("click", () => {
  if (!timer.sessionId) return;
  if (timer.finished) { startSession(timer.sessionId); return; }
  timer.running  = !timer.running;
  timer.lastTick = Date.now();
  updateTimerUI();
  saveTimer();
});

function adjustTime(deltaMin) {
  if (!timer.sessionId || timer.finished) return;
  const s = getSession(timer.sessionId);
  if (!s) return;
  const b = s.blocks[timer.blockIndex];
  const d = deltaMin * 60;

  if (state.settings.mode === "freeflow") {
    // free flow counts up toward the block's target, so move the target
    if (!b) return;
    b.minutes = Math.max(1, b.minutes + deltaMin);
    timer.total = b.minutes * 60;
    timer.notified = timer.elapsed >= b.minutes * 60;
    save();
    renderSessions();
  } else {
    if (d < 0 && timer.remaining <= 60) return;
    timer.remaining = Math.max(1, timer.remaining + d);
    timer.total     = Math.max(timer.remaining, timer.total + d);
    if (timer.phase === "work" && b) {
      // keep the planned block length in step with this change
      b.minutes = Math.max(1, b.minutes + deltaMin);
      save();
      renderSessions();
    }
  }
  updateTimerUI();
  saveTimer();
}

plusBtn.addEventListener("click",  () => adjustTime(+1));
minusBtn.addEventListener("click", () => adjustTime(-1));

completeBtn.addEventListener("click", () => {
  if (!timer.sessionId || timer.finished) return;
  const s = getSession(timer.sessionId);
  if (!s) return;
  const isWork = state.settings.mode === "freeflow" || timer.phase === "work";
  if (!isWork) return;
  const name = (s.blocks[timer.blockIndex] || {}).topic || `Block ${timer.blockIndex + 1}`;
  endPhase();               // logs time studied so far, marks block done, moves on
  toast(`Completed "${name}"`);
});

resetBtn.addEventListener("click", resetPhase);
skipBtn.addEventListener("click", () => {
  if (!timer.sessionId || timer.finished) return;
  endPhase();
});

modeSeg.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (state.settings.mode === b.dataset.mode) return;
