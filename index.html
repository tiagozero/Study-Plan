/* ---------- CHECKLIST IMPORT / EXPORT (CSV + JSON) ---------- */
const CK_CSV_TEMPLATE =
`section,task,done,due
Exam prep,Read chapter 4,no,2026-11-10
Exam prep,Solve a past paper,no,
Admin,Book the exam slot,yes,
Admin,Print study notes,no,2026-11-05`;

const CK_JSON_TEMPLATE =
`{
  "sections": [
    {
      "name": "Exam prep",
      "tasks": [
        { "title": "Read chapter 4", "due": "2026-11-10" },
        { "title": "Solve a past paper", "done": false }
      ]
    },
    {
      "name": "Admin",
      "tasks": [ "Book the exam slot", "Print study notes" ]
    }
  ]
}`;

function ckParseDone(v) {
  if (typeof v === "boolean") return v;
  if (typeof v === "number") return v === 1;
  return /^(1|true|yes|y|x|done|sim|s|ok|✓|✔|completed?|conclu[ií]d[oa]|feit[oa])$/i.test(String(v == null ? "" : v).trim());
}
function ckParseDue(v) {
  const t = String(v == null ? "" : v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);       // day/month/year
  if (m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31)
    return `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
  return "";
}

/* RFC-4180-ish CSV parser: quotes, escaped quotes, newlines inside quotes */
function ckCsvRows(text, delim) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some(x => x.trim() !== "")) rows.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some(x => x.trim() !== "")) rows.push(row);
  return rows;
}

/* group flat {section, title, done, due} rows into sections, keeping order */
function ckGroup(items) {
  const out = [], idx = new Map();
  const sec = name => {
    const key = name.toLowerCase();
    if (!idx.has(key)) { idx.set(key, { name, tasks: [] }); out.push(idx.get(key)); }
    return idx.get(key);
  };
  items.forEach(it => {
    const s = sec(it.section || "Tasks");
    if (it.title) s.tasks.push({ title: it.title, done: !!it.done, due: it.due || "" });
  });
  return out;
}

function ckTaskFromJson(x) {
  if (typeof x === "string") return { section: "", title: x.trim(), done: false, due: "" };
  if (x && typeof x === "object") {
    return { title: String(x.title ?? x.task ?? x.name ?? x.text ?? "").trim(),
             done: ckParseDone(x.done ?? x.completed), due: ckParseDue(x.due ?? x.deadline ?? x.date ?? "") };
  }
  return null;
}
function ckSectionsFromJson(v) {
  const mapSec = o => {
    const name = String(o.name ?? o.title ?? o.section ?? o.group ?? "").trim() || "Tasks";
    const list = Array.isArray(o.tasks) ? o.tasks : (Array.isArray(o.items) ? o.items : []);
    return list.map(ckTaskFromJson).filter(Boolean).map(t => ({ ...t, section: name }))
      .concat(list.length ? [] : [{ section: name, title: "" }]);
  };
  if (Array.isArray(v)) {
    if (v.length && v.every(x => typeof x === "string")) return ckGroup(v.map(x => ({ section: "Tasks", title: x.trim() })));
    if (v.some(x => x && typeof x === "object" && (Array.isArray(x.tasks) || Array.isArray(x.items)))) {
      return ckGroup(v.filter(x => x && typeof x === "object").flatMap(mapSec));
    }
    return ckGroup(v.filter(x => x && typeof x === "object").map(r => ({   // flat rows
      section: String(r.section ?? r.group ?? r.category ?? "").trim(),
      title: String(r.title ?? r.task ?? r.name ?? "").trim(),
      done: ckParseDone(r.done ?? r.completed), due: ckParseDue(r.due ?? r.deadline ?? "") })));
  }
  if (v && typeof v === "object") {
    const arr = v.sections ?? v.checklist ?? v.groups;
    if (Array.isArray(arr)) return ckSectionsFromJson(arr);
    const keys = Object.keys(v).filter(k => Array.isArray(v[k]));
    if (keys.length) return ckGroup(keys.flatMap(k => mapSec({ name: k, tasks: v[k] })));
  }
  return [];
}

function ckSectionsFromCsv(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const delim = [";", "\t", ","].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = ckCsvRows(text, delim);
  if (!rows.length) return [];
  const ALIAS = {
    section: ["section", "sections", "group", "category", "seção", "secao", "categoria", "grupo"],
    title:   ["task", "tasks", "title", "name", "item", "tarefa", "tarefas", "titulo", "título"],
    done:    ["done", "completed", "complete", "status", "concluída", "concluida", "concluído", "concluido", "feito"],
    due:     ["due", "due date", "duedate", "deadline", "date", "prazo", "vencimento"]
  };
  const head = rows[0].map(c => c.trim().toLowerCase());
  const col = {};
  Object.entries(ALIAS).forEach(([k, names]) => { const i = head.findIndex(h => names.includes(h)); if (i >= 0) col[k] = i; });
  let body = rows;
  if (col.title !== undefined) body = rows.slice(1);
  else if (rows[0].length >= 2) { col.section = 0; col.title = 1; col.done = 2; col.due = 3; }
  else { col.title = 0; }
  const get = (r, k) => (col[k] !== undefined && r[col[k]] !== undefined) ? r[col[k]].trim() : "";
  let last = "";
  const items = body.map(r => {
    const sec = get(r, "section");
    if (sec) last = sec;
    return { section: sec || last, title: get(r, "title"), done: ckParseDone(get(r, "done")), due: ckParseDue(get(r, "due")) };
  });
  return ckGroup(items);
}

/* returns { sections, format, error } */
function parseChecklistText(raw) {
  const text = String(raw || "").replace(/^\uFEFF/, "").trim();
  if (!text) return { sections: [], format: "", error: "" };
  if (text[0] === "{" || text[0] === "[") {
    try { return { sections: ckSectionsFromJson(JSON.parse(text)), format: "JSON", error: "" }; }
    catch (e) { return { sections: [], format: "JSON", error: "That JSON isn't valid: " + e.message }; }
  }
  return { sections: ckSectionsFromCsv(text), format: "CSV", error: "" };
}

/* how many sections/tasks would be new vs already there */
function ckImportStats(sections, replace) {
  let newSec = 0, newTasks = 0, dupes = 0;
  sections.forEach(s => {
    const ex = replace ? null : state.checklist.find(g => g.name.trim().toLowerCase() === s.name.toLowerCase());
    if (!ex) newSec++;
    const have = new Set(ex ? ex.tasks.map(t => t.title.trim().toLowerCase()) : []);
    s.tasks.forEach(t => {
      const k = t.title.toLowerCase();
      if (have.has(k)) dupes++; else { have.add(k); newTasks++; }
    });
  });
  return { newSec, newTasks, dupes };
}

function applyChecklistImport(sections, replace) {
  if (replace) {
    unlinkTasks(state.checklist.flatMap(g => g.tasks.map(t => t.id)));
    state.checklist = [];
  }
  sections.forEach(s => {
    let g = state.checklist.find(x => x.name.trim().toLowerCase() === s.name.toLowerCase());
    if (!g) { g = { id: uid(), name: s.name, collapsed: false, tasks: [] }; state.checklist.push(g); }
    const have = new Set(g.tasks.map(t => t.title.trim().toLowerCase()));
    s.tasks.forEach(t => {
      const k = t.title.toLowerCase();
      if (have.has(k)) return;
      have.add(k);
      g.tasks.push({ id: uid(), title: t.title, done: !!t.done, due: t.due || "", created: Date.now(), ...(t.done ? { doneAt: Date.now() } : {}) });
    });
  });
}

function ckExportRows() {
  return state.checklist.flatMap(g => g.tasks.length
    ? g.tasks.map(t => ({ section: g.name, title: t.title, done: t.done, due: t.due || "" }))
    : [{ section: g.name, title: "", done: false, due: "" }]);
}
function ckExportCsv() {
  const q = v => /[",;\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  return "section,task,done,due\n" + ckExportRows().map(r => [q(r.section), q(r.title), r.done ? "yes" : "no", r.due].join(",")).join("\n");
}
function ckExportJson() {
  return JSON.stringify({ sections: state.checklist.map(g => ({ name: g.name,
    tasks: g.tasks.map(t => ({ title: t.title, done: t.done, ...(t.due ? { due: t.due } : {}) })) })) }, null, 2);
}

function downloadText(name, text, mime) {
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) { return false; }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}
/* read a file as text; tolerate Excel's Windows-1252 CSVs */
function readFileText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("read"));
    r.onload = () => {
      const buf = r.result;
      try { resolve(new TextDecoder("utf-8", { fatal: true }).decode(buf)); }
      catch (e) {
        try { resolve(new TextDecoder("windows-1252").decode(buf)); }
        catch (e2) { reject(e2); }
      }
    };
    r.readAsArrayBuffer(file);
  });
}

/* ----- template editor helpers: choice block (several tasks, pick one) ----- */
function bcInner(opts) {
  if (!opts || !opts.length) {
    return `<button class="btn sm" type="button" data-act="bc-make" title="Add several tasks to this block and choose which one to do when it starts">⇄ Choose between several tasks</button>`;
  }
  return `
    <div class="bc-head">Pick one of these when the block starts (${opts.length} so far — press Enter or paste a list, one per line, to add more):</div>
    ${opts.map(o => `
      <div class="bc-opt"${o.taskId ? ` data-task-id="${esc(o.taskId)}"` : ""}>
        <input class="bo-topic" value="${esc(o.topic || "")}" placeholder="Alternative" autocomplete="off">
        ${o.taskId ? `<span class="bc-link" title="Linked to a checklist task">☑</span>` : ""}
        <button class="icon-btn sm" type="button" data-act="bo-rm" title="Remove">✕</button>
      </div>`).join("")}
    <div class="bc-acts">
      <button class="btn primary sm" type="button" data-act="bo-add">＋ Add another choice</button>
      <button class="btn sm" type="button" data-act="bo-pick">☑ Several from checklist</button>
      <button class="bt-unlink" type="button" data-act="bc-off">Back to a single block</button>
    </div>
    <div class="bc-pick" hidden></div>`;
}
function bcReadRaw(row) {
  return [...row.querySelectorAll(".bc-opt")].map(el => ({
    topic: el.querySelector(".bo-topic").value.trim(),
    ...(el.dataset.taskId ? { taskId: el.dataset.taskId } : {})
  }));
}
function bcRead(row) { return bcReadRaw(row).filter(o => o.topic); }
function bcSyncLabel(row) {
  const t = row.querySelector(".be-topic");
  if (row.classList.contains("is-choice")) t.value = choiceLabel(bcRead(row));
}
function bcRender(row, opts, focusLast) {
  const on = !!(opts && opts.length);
  row.classList.toggle("is-choice", on);
  row.querySelector(".be-topic").readOnly = on;
  row.querySelector(".bc").innerHTML = bcInner(on ? opts : null);
  if (on) bcSyncLabel(row);
  if (on && focusLast) { const all = row.querySelectorAll(".bo-topic"); all[all.length - 1].focus(); }
}
/* returns true when the click belonged to the choice UI */
function bcHandleClick(e, $blocks) {
  const el = e.target.closest("[data-act]");
  if (!el) return false;
  const act = el.dataset.act, row = el.closest(".block-row");
  if (!row || !$blocks.contains(row)) return false;

  if (act === "bc-make") {
    const topic = row.querySelector(".be-topic").value.trim();
    const first = topic ? [{ topic, ...(row.dataset.taskId ? { taskId: row.dataset.taskId } : {}) }] : [{ topic: "" }];
    delete row.dataset.taskId; refreshRowLink(row);
    bcRender(row, [...first, { topic: "" }, ...(topic ? [{ topic: "" }] : [])], false);
    row.querySelectorAll(".bo-topic")[topic ? 1 : 0].focus();
    return true;
  }
  if (act === "bc-off") {
    const first = bcRead(row)[0];
    row.querySelector(".be-topic").value = first ? first.topic : "";
    if (first && first.taskId) row.dataset.taskId = first.taskId; else delete row.dataset.taskId;
    bcRender(row, null);
    refreshRowLink(row);
    return true;
  }
  if (act === "bo-add") { bcRender(row, [...bcReadRaw(row), { topic: "" }], true); return true; }
  if (act === "bo-rm") {
    const left = bcReadRaw(row); left.splice([...row.querySelectorAll(".bc-opt")].indexOf(el.closest(".bc-opt")), 1);
    bcRender(row, left.length ? left : [{ topic: "" }], false);
    return true;
  }
  if (act === "bo-pick") {
    const box = row.querySelector(".bc-pick");
    if (!box.hidden) { box.hidden = true; return true; }
    const have = new Set(bcReadRaw(row).map(o => o.taskId).filter(Boolean));
    const open = state.checklist.map(g => ({ g, tasks: g.tasks.filter(t => !t.done && !have.has(t.id)) })).filter(x => x.tasks.length);
    box.innerHTML = open.length
      ? open.map(({ g, tasks }) => `<div class="ck-sech">${esc(g.name)}</div>${tasks.map(t =>
          `<label class="ck-pk"><input type="checkbox" value="${esc(t.id)}"><span>${esc(t.title)}</span></label>`).join("")}`).join("")
        + `<button class="btn sm primary" type="button" data-act="bo-pick-go">Add selected</button>`
      : `<div class="pick-empty">No other open tasks. Add some in Plan → Checklist first.</div>`;
    box.hidden = false;
    return true;
  }
  if (act === "bo-pick-go") {
    const ids = [...row.querySelectorAll(".bc-pick input:checked")].map(i => i.value);
    if (!ids.length) { toast("Tick at least one task"); return true; }
    const keep = bcReadRaw(row).filter(o => o.topic);
    const added = ids.map(findTask).filter(Boolean).map(t => ({ topic: t.title, taskId: t.id }));
    bcRender(row, [...keep, ...added], false);
    return true;
  }
  return false;
}

/* ---------- HISTORY & ACTIVITY LOG ---------- */
const historyBody = $("#historyBody");
const histSeg     = $("#histSeg");
const histSearch  = $("#histSearch");
const histSource  = $("#histSource");
let histLimit = 100;

const fmtHM = ts => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function fmtDayHead(key) {
  const t = dayKey(Date.now()), y = dayKey(Date.now() - DAY);
  if (key === t) return "Today";
  if (key === y) return "Yesterday";
  const d = new Date(key + "T00:00:00");
  const opts = { weekday: "short", day: "numeric", month: "short" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}

function histMatch(h) {
  const q = histSearch.value.trim().toLowerCase();
  const src = histSource.value;
  if (src !== "all" && (src === "manual" ? !h.manual : !!h.manual)) return false;
  return !q || `${h.sessionTitle} ${h.topic} ${h.note}`.toLowerCase().includes(q);
}

function histRowHtml(h) {
  const sub = [h.topic, h.note].filter(Boolean).join(" · ");
  return `
    <div class="h-row" data-id="${esc(h.id)}">
      <div class="h-time">${fmtHM(h.ts)}</div>
      <div>
        <div class="h-title">${esc(h.sessionTitle || "Untitled")}${h.manual ? `<span class="rec-badge" title="Logged manually">Logged</span>` : ""}</div>
        ${sub ? `<div class="h-sub" title="${esc(sub)}">${esc(sub)}</div>` : ""}
      </div>
      <div class="h-min">${fmtDur(h.minutes)}</div>
      <button class="icon-btn sm" data-act="h-edit" title="Edit entry" aria-label="Edit entry">✎</button>
      <button class="icon-btn sm" data-act="h-del" title="Delete entry" aria-label="Delete entry">✕</button>
    </div>`;
}

const histViewSeg = $("#histViewSeg");
const historyCal  = $("#historyCal");
function applyHistView() {
  const v = state.ui.histView;
  [...histViewSeg.children].forEach(b => b.classList.toggle("on", b.dataset.hview === v));
  histSeg.hidden     = v !== "list";
  historyBody.hidden = v !== "list";
  historyCal.hidden  = v !== "calendar";
}
histViewSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-hview]");
  if (!b || state.ui.histView === b.dataset.hview) return;
  state.ui.histView = b.dataset.hview;
  save(); renderHistory();
});

function renderHistory() {
  applyHistView();
  if (state.ui.histView === "calendar") { renderHistoryCal(); return; }
  [...histSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === state.ui.histRange));

  if (!state.history.length) {
    historyBody.innerHTML = `<div class="empty">Nothing here yet.<br>Finish a focus block, or log an activity you did away from the timer.</div>`;
    return;
  }

  const [start, end] = rangeBounds(state.ui.histRange);
  const q = histSearch.value.trim().toLowerCase();
  const src = histSource.value;

  const list = state.history
    .filter(h => h.ts >= start && h.ts < end)
    .filter(histMatch)
    .sort((a, b) => b.ts - a.ts);

  if (!list.length) {
    historyBody.innerHTML = `<div class="empty">No entries match these filters.</div>`;
    return;
  }

  const total = list.reduce((a, h) => a + h.minutes, 0);
  const dayCount = new Set(list.map(h => dayKey(h.ts))).size;
  const shown = list.slice(0, histLimit);

  const groups = new Map();
  shown.forEach(h => {
    const k = dayKey(h.ts);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(h);
  });

  const daysHtml = [...groups.entries()].map(([k, items]) => {
    const sum = list.filter(h => dayKey(h.ts) === k).reduce((a, h) => a + h.minutes, 0);
    return `
      <div class="h-day">
        <div class="h-day-head"><span>${esc(fmtDayHead(k))}</span><b>${fmtDur(sum)}</b></div>
        ${items.map(histRowHtml).join("")}
      </div>`;
  }).join("");

  historyBody.innerHTML = `
    <div class="h-sum">
      <span><b>${fmtDur(total)}</b> total</span>
      <span><b>${list.length}</b> entr${list.length !== 1 ? "ies" : "y"}</span>
      <span><b>${dayCount}</b> day${dayCount !== 1 ? "s" : ""}</span>
    </div>
    ${daysHtml}
    ${list.length > shown.length ? `<button class="btn h-more" data-act="h-more">Show more (${list.length - shown.length} left)</button>` : ""}`;
}

function refreshHistoryViews() {
  renderHistory();
  if (state.ui.tab === "dashboard") renderDashboard();
}

function historyClick(e) {
  const btn = e.target.closest("[data-act]");

    state.history = state.history.filter(x => x.id !== h.id);
    save(); refreshHistoryViews();
    toast("Entry deleted");
  }
}

histSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");

/* ---------- GOALS & STREAK TARGETS ---------- */
function minutesByDay() {
  const m = new Map();
  state.history.forEach(h => { const k = dayKey(h.ts); m.set(k, (m.get(k) || 0) + h.minutes); });
  return m;
}
const streakThreshold = () => (state.goals.streakMode === "goal" && state.goals.daily > 0) ? state.goals.daily : 0.01;

function streakFrom(by, thr) {
  let n = 0;
  const cur = startOfDay(new Date());
  if ((by.get(dateKey(cur)) || 0) < thr) cur.setDate(cur.getDate() - 1);   // today may still be in progress
  while ((by.get(dateKey(cur)) || 0) >= thr) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}
function bestStreakFrom(by, thr) {
  const days = [...by.entries()].filter(([, m]) => m >= thr)
    .map(([k]) => { const [y, mo, d] = k.split("-").map(Number); return Date.UTC(y, mo - 1, d) / DAY; })
    .sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  days.forEach(d => { run = (prev !== null && d - prev === 1) ? run + 1 : 1; if (run > best) best = run; prev = d; });
  return best;
}
function goalSnapshot() {
  const by = minutesByDay();
  const wk = startOfWeek(new Date());
  let week = 0, weekDays = 0;
  for (let i = 0; i < 7; i++) { const m = by.get(dateKey(addDays(wk, i))) || 0; week += m; if (m > 0) weekDays++; }
  const thr = streakThreshold();
  return { day: by.get(dateKey(new Date())) || 0, week, weekDays,
           streak: streakFrom(by, thr), best: bestStreakFrom(by, thr) };
}
function milestoneMsg(a, b) {
  const g = state.goals;
  if (g.streak > 0 && a.streak < g.streak && b.streak >= g.streak) return `🔥 Streak target reached: ${g.streak} day${g.streak !== 1 ? "s" : ""}!`;
  if (g.weekly > 0 && a.week < g.weekly && b.week >= g.weekly) return "🎯 Weekly goal reached!";
  if (g.daily > 0 && a.day < g.daily && b.day >= g.daily) return "🎯 Daily goal reached!";
  return "";
}

/* ---------- HISTORY CALENDAR (month grid) ---------- */
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let calSel = dateKey(new Date());
const fmtCompact = m => { m = Math.round(m); if (m < 60) return m + "m"; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h${String(r).padStart(2, "0")}` : h + "h"; };

function renderHistoryCal() {
  const by = new Map();
  state.history.filter(histMatch).forEach(h => { const k = dayKey(h.ts); by.set(k, (by.get(k) || 0) + h.minutes); });

  const daily = state.goals.daily;
  const first = calMonth, last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const gridStart = startOfWeek(first), gridEnd = addDays(startOfWeek(last), 6);
  const days = [];
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) days.push(d);

  const inMonth = days.filter(d => d.getMonth() === first.getMonth());
  const vals = inMonth.map(d => by.get(dateKey(d)) || 0);
  const mTotal = vals.reduce((a, b) => a + b, 0);
  const mActive = vals.filter(v => v > 0).length;
  const mBest = Math.max(0, ...vals);
  const mGoal = daily ? vals.filter(v => v >= daily).length : 0;
  const maxV = Math.max(mBest, 1);

  const level = m => {
    if (m <= 0) return 0;
    if (daily) return m >= daily ? 4 : m >= daily * 0.5 ? 3 : m >= daily * 0.25 ? 2 : 1;
    const r = m / maxV; return r > 0.75 ? 4 : r > 0.5 ? 3 : r > 0.25 ? 2 : 1;
  };

  const todayK = dateKey(new Date());
  const cells = days.map(d => {
    const k = dateKey(d), m = by.get(k) || 0, other = d.getMonth() !== first.getMonth();
    const met = daily && m >= daily;
    const label = `${d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}: ${m > 0 ? fmtDur(m) : "no study"}${met ? " (goal reached)" : ""}`;
    return `<button type="button" class="cal-cell l${level(m)}${other ? " other" : ""}${k === todayK ? " today" : ""}${k === calSel ? " sel" : ""}${k > todayK ? " future" : ""}"
              data-day="${k}" title="${esc(label)}" aria-label="${esc(label)}" aria-pressed="${k === calSel}">
              <span class="cal-num">${d.getDate()}</span>
              ${m > 0 ? `<span class="cal-min">${fmtCompact(m)}</span>` : ""}
              ${met ? `<span class="cal-ok">✓</span>` : ""}
            </button>`;
  }).join("");

  const selEntries = state.history.filter(histMatch).filter(h => dayKey(h.ts) === calSel).sort((a, b) => b.ts - a.ts);
  const selTotal = selEntries.reduce((a, h) => a + h.minutes, 0);
  const selDate = new Date(calSel + "T00:00:00");
  const selFuture = calSel > todayK;

  historyCal.innerHTML = `
    <div class="cal-head">
      <button class="icon-btn sm" data-act="cal-prev" title="Previous month" aria-label="Previous month">‹</button>
      <span class="lbl">${esc(first.toLocaleDateString(undefined, { month: "long", year: "numeric" }))}</span>
      <button class="icon-btn sm" data-act="cal-next" title="Next month" aria-label="Next month">›</button>
      <button class="btn sm" data-act="cal-today">Today</button>
    </div>
    <div class="h-sum">
      <span><b>${fmtDur(mTotal)}</b> this month</span>
      <span><b>${mActive}</b> active day${mActive !== 1 ? "s" : ""}</span>
      ${daily ? `<span><b>${mGoal}</b> goal day${mGoal !== 1 ? "s" : ""}</span>` : ""}
      ${mBest > 0 ? `<span>best day <b>${fmtDur(mBest)}</b></span>` : ""}
    </div>
    <div class="cal-grid">
      ${DOW_ORDER.map(d => `<div class="cal-dow">${DOW_NAMES[d]}</div>`).join("")}
      ${cells}
    </div>
    <div class="cal-legend">
      Less <span class="cal-sw l0"></span><span class="cal-sw l1"></span><span class="cal-sw l2"></span><span class="cal-sw l3"></span><span class="cal-sw l4"></span> More
      ${daily ? `<span>· ✓ = daily goal (${fmtDur(daily)}) reached</span>` : `<button class="btn sm" data-act="goals-edit" style="margin-left:auto">Set a daily goal</button>`}
    </div>
    <div class="cal-day">
      <div class="cal-day-head">
        <div><b>${esc(selDate.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }))}</b>
          <span class="h-sub" style="display:inline;margin-left:6px">${selTotal > 0 ? fmtDur(selTotal) : ""}</span></div>
        <button class="btn sm" data-act="cal-log" ${selFuture ? "disabled" : ""}>+ Log activity</button>
      </div>
      ${selEntries.length ? selEntries.map(histRowHtml).join("")
        : `<div class="empty" style="padding:16px">${selFuture ? "This day hasn't happened yet." : "Nothing logged on this day."}</div>`}
    </div>`;
}

historyCal.addEventListener("click", e => {
  const cell = e.target.closest("[data-day]");
  if (cell) {
    calSel = cell.dataset.day;
    const d = new Date(calSel + "T00:00:00");
    if (d.getMonth() !== calMonth.getMonth() || d.getFullYear() !== calMonth.getFullYear())
      calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    renderHistoryCal(); return;
  }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "cal-prev")  { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderHistoryCal(); return; }
  if (a === "cal-next")  { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderHistoryCal(); return; }
  if (a === "cal-today") { const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); calSel = dateKey(n); renderHistoryCal(); return; }
  if (a === "cal-log")   { openLogModal(null, calSel); return; }
  if (a === "goals-edit") { openGoalsModal(); return; }
  historyClick(e);
});

/* ---------- IMPORT PARSER ---------- */
function parseSessions(text) {
  const out = [];

  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    let title = "", spec = line;

    const m = line.match(/^(.*)\s*[-–—]\s*(.+)$/);
    if (m && /\d/.test(m[2])) {
      title = m[1].trim();
      spec  = m[2].trim();
    }

    const blocks = [];
    spec.split(/[,;]/).map(p => p.trim()).filter(Boolean).forEach(part => {
      const pair = part.match(/(\d+)\s*(?:x|\*|×|X)\s*(\d+)/);
      if (pair) {
        let a = +pair[1], b = +pair[2], count, minutes;
        if (a <= 12 && b > 12) { count = a; minutes = b; }
        else                   { minutes = a; count = b; }
        count   = Math.max(1, Math.min(50, count));
        minutes = Math.max(1, Math.min(300, minutes));
        for (let i = 0; i < count; i++) blocks.push({ topic: "", minutes, done: false });
      } else {
        const single = part.match(/(\d+)/);
        if (single) blocks.push({ topic: "", minutes: Math.min(300, +single[1]), done: false });
      }
    });

    if (!blocks.length) return;

    const topics = title ? title.split(",").map(t => t.trim()).filter(Boolean) : [];
    if (topics.length === blocks.length && topics.length > 1) {
      blocks.forEach((b, i) => (b.topic = topics[i]));
    } else {
      blocks.forEach((b, i) => (b.topic = "Topic " + (i + 1)));
    }

    out.push({ title: title || "Session", blocks });
  });

  return out;
}

  const prev = document.getElementById("impPreview");

  let previewTimer = null;

  const doRefresh = () => {
    const list = parseSessions(ta.value);
    if (!list.length) {
      prev.innerHTML = `<div class="prev-empty">Nothing to import yet</div>`;
      return;
    }
    const shown = list.slice(0, 30);
    let html = shown.map(s => {
      const mins = s.blocks.reduce((a, b) => a + b.minutes, 0);
      return `<div class="prev-item">
                <b>${esc(s.title)}</b>
                <span>${s.blocks.length} block${s.blocks.length !== 1 ? "s" : ""} · ${mins} min</span>
              </div>`;
    }).join("");
    if (list.length > shown.length) {
      html += `<div class="prev-more">… and ${list.length - shown.length} more</div>`;
    }
    prev.innerHTML = html;
  };

  ta.addEventListener("input", () => {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(doRefresh, 90);
  });
  doRefresh();
  ta.focus();

  document.getElementById("impGo").addEventListener("click", () => {
    const list = parseSessions(ta.value);
    if (!list.length) return;

    if (isTpl) {
      const gid = document.getElementById("impGroup").value;
      const group = state.templateGroups.find(g => g.id === gid) || state.templateGroups[0];
      list.forEach(s => {
        group.templates.push({
          id: uid(),
          title: s.title,
          blocks: s.blocks.map(b => cpBlock(b)),
          resources: [],
          created: Date.now()
        });
      });
    } else {
      list.forEach(s => {
        state.sessions.push({
          id: uid(), title: s.title, blocks: s.blocks, resources: [], created: Date.now()
        });
      });
    }

    save();
    closeModal();
    if (isTpl) renderTemplates(); else renderSessions();
    toast(`Imported ${list.length} ${isTpl ? "template" : "session"}${list.length !== 1 ? "s" : ""}`);
  });
}

$("#importBtn").addEventListener("click", () => openImportModal("session"));
$("#importTplBtn").addEventListener("click", () => openImportModal("template"));

/* ---------- SETTINGS ---------- */
function bindSetting(id, key, min, max) {
  const el = $(id);
  el.value = state.settings[key];
  el.addEventListener("change", () => {
    let v = +el.value || min;
    v = Math.max(min, Math.min(max, v));
    el.value = v;
    state.settings[key] = v;
    save();
    if (!timer.running && !timer.finished && !timer.sessionId) updateTimerUI();
    renderSessions();
  });
}

/* ---------- RESOURCES PANEL ---------- */
const resList = $("#resList");
const resForm = $("#resForm");

function renderResources() {
  if (!state.resources.length) {
    resList.innerHTML = `<div class="empty">No resources yet.${
      state.ui.hideResForm ? "" : "<br>Add links, books, PDFs above."
    }</div>`;
    return;
  }
  resList.innerHTML = state.resources.map(r => {
    const url = safeUrl(r.url);
    const name = url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`
      : esc(r.name);
    return `
      <div class="res" data-id="${r.id}">
        <div class="res-name">${name}</div>
        ${url ? `<span style="font-size:11px;color:var(--muted)">link</span>` : ""}
        <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
      </div>`;
  }).join("");
}

resForm.addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#resName").value.trim();
  if (!name) return;
  state.resources.push({ id: uid(), name, url: $("#resUrl").value.trim() });
  save(); renderResources();
  resForm.reset();
  $("#resName").focus();
});

resList.addEventListener("click", e => {
  const btn = e.target.closest("[data-act='del']");
  if (!btn) return;
  const row = e.target.closest(".res");
  const rid = row.dataset.id;

  state.resources = state.resources.filter(r => r.id !== rid);
  state.sessions.forEach(s => {
    if (Array.isArray(s.resources)) s.resources = s.resources.filter(x => x !== rid);
  });
  state.templateGroups.forEach(g => {
    g.templates.forEach(t => {
      if (Array.isArray(t.resources)) t.resources = t.resources.filter(x => x !== rid);
    });
  });

  save();
  renderResources();
  renderSessions();
  renderTemplates();
});

/* ---------- BOOT ---------- */
load();
restoreTimer();

bindSetting("#setFocus", "focus", 1, 180);
bindSetting("#setShort", "short", 1, 60);
bindSetting("#setLong",  "long",  1, 60);
bindSetting("#setEvery", "longEvery", 2, 12);

setTab(state.ui.tab);
applyResFormToggle();

renderSessions();
renderResources();
renderTemplates();
renderDashboard();
renderPlan();
renderHistory();
updateTimerUI();
updateBackupNudge();

})();
</script>
</body>
</html>
