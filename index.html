<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Plan</title>
<style>
  :root{
    --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f0f0f2;
    --text:#18181b; --muted:#71717a; --border:#e6e6e9;
    --accent:#5b5bd6; --accent-soft:rgba(91,91,214,.12); --on-accent:#fff;
    --break:#0f9d76;
    --seg-track:#efeff1; --seg-active:#ffffff;
  }
  [data-theme="dark"]{
    --bg:#0a0a0c; --surface:#131316; --surface-2:#1b1b1f;
    --text:#f2f2f4; --muted:#8c8c96; --border:#26262c;
    --accent:#8b87ff; --accent-soft:rgba(139,135,255,.16); --on-accent:#0a0a0c;
    --break:#3ddc9a;
    --seg-track:#1b1b1f; --seg-active:#2c2c34;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    transition:background .2s ease,color .2s ease;
  }
  button{font:inherit}
  a{color:var(--accent)}

  .app{max-width:1020px;margin:0 auto;padding:26px 20px 60px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .brand span{color:var(--accent)}
  .top-actions{display:flex;gap:6px}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--muted)}
  .icon-btn.sm{width:28px;height:28px;border-radius:8px;font-size:12px;background:transparent;border-color:transparent;color:var(--muted)}
  .icon-btn.sm:hover{background:var(--surface-2);color:var(--text)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
  @media(max-width:860px){ .layout{grid-template-columns:1fr} }

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:18px;margin-bottom:18px;
  }
  .col-left .card{position:sticky;top:22px}
  @media(max-width:860px){ .col-left .card{position:static} }

  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .sec-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .sec-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);
    border-radius:13px;padding:4px;margin-bottom:18px;
  }
  .tabs button{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:500;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--surface-2);color:var(--text)}
  @media(max-width:620px){ .tabs button{font-size:11.5px;padding:8px 3px} }
  .tab-panel[hidden]{display:none}

  /* ---------- toggle switch ---------- */
  .switch{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;border:0;padding:2px;cursor:pointer;
    font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);
  }
  .switch:hover{color:var(--text)}
  .switch .track{
    position:relative;width:32px;height:18px;flex-shrink:0;
    border-radius:99px;background:var(--surface-2);
    border:1px solid var(--border);transition:.18s;
  }
  .switch .track::after{
    content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:var(--muted);transition:.18s;
  }
  .switch.on .track{background:var(--accent-soft);border-color:var(--accent)}
  .switch.on .track::after{transform:translateX(14px);background:var(--accent)}

  /* ---------- buttons ---------- */
  .btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.wide{width:100%;margin-top:4px;padding:10px}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--border)}

  /* ---------- timer ---------- */
  .timer-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .pill{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);
    padding:4px 9px;border-radius:99px;
  }
  .timer-session{
    font-size:12.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;
  }

  .ring-wrap{position:relative;width:196px;margin:10px auto 0}
  .ring{display:block;width:196px;height:196px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bg{stroke:var(--surface-2)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s linear,stroke .3s ease}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;pointer-events:none;
  }
  .time{
    font-size:38px;font-weight:300;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .time.over{color:var(--break)}
  .sub{font-size:12px;color:var(--muted);max-width:150px;text-align:center;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .controls{display:flex;gap:8px;margin-top:18px}
  .controls .btn{flex:1;text-align:center;padding:9px 8px}

  .seg{display:flex;background:var(--seg-track);border-radius:11px;padding:3px;gap:3px;margin-top:14px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:7px 6px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--seg-active);color:var(--text);font-weight:500}
  .seg.sm{margin-top:0;flex:0 0 auto}
  .seg.sm button{padding:6px 11px;font-size:12.5px;flex:0 0 auto}

  /* ---------- settings ---------- */
  details.settings{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  details.settings summary{
    cursor:pointer;font-size:12px;color:var(--muted);list-style:none;
    user-select:none;display:flex;align-items:center;gap:6px;
  }
  details.settings summary::-webkit-details-marker{display:none}
  details.settings summary::before{content:"›";transition:.2s;display:inline-block}
  details.settings[open] summary::before{transform:rotate(90deg)}
  details.settings .inner{padding-top:12px}

  /* ---------- form fields ---------- */
  .fld{display:block;margin-bottom:12px;font-size:12px;font-weight:500;color:var(--muted)}
  .fld .opt{font-weight:400;opacity:.7}
  input,textarea,select{
    display:block;width:100%;margin-top:5px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;
    font-weight:400;outline:none;transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;font-family:inherit}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* ---------- sessions / templates ---------- */
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}
  .session{
    border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px;
    transition:.18s;
  }
  .session.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .session-title{font-weight:550;font-size:14.5px;letter-spacing:-.01em}
  .session-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .session-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .session-actions .btn{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .bar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:11px 0 9px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .blocks{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    font-size:11.5px;padding:3px 9px;border-radius:99px;
    background:var(--surface-2);color:var(--muted);
    cursor:pointer;user-select:none;transition:.15s;border:1px solid transparent;
  }
  .chip:hover{border-color:var(--border)}
  .chip.done{background:var(--accent-soft);color:var(--accent)}
  .chip.static{cursor:default}
  .chip.static:hover{border-color:transparent}
  .chip.link{text-decoration:none;color:var(--accent);background:var(--accent-soft);cursor:pointer}
  .chip.link:hover{border-color:var(--accent)}

  .res-mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}

  /* ---------- resources panel ---------- */
  .res-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:14px}
  .res-form input{margin-top:0}
  @media(max-width:560px){ .res-form{grid-template-columns:1fr} }
  .res{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:7px;
  }
  .res-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-name a{text-decoration:none}
  .res-name a:hover{text-decoration:underline}

  /* ---------- resource picker ---------- */
  .pick-list{max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:11px;padding:6px;overscroll-behavior:contain}
  .pick{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;
    /* PERF: skip rendering offscreen rows */
    content-visibility: auto;
    contain-intrinsic-size: auto 34px;
  }
  .pick:hover{background:var(--surface-2)}
  .pick input[type=checkbox]{
    display:block;width:15px;height:15px;margin:0;padding:0;flex:0 0 auto;
    accent-color:var(--accent);border-radius:4px;
  }
  .pick-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-url{font-size:11px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:16px}

  /* ---------- dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}
  @media(max-width:560px){ .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
  .stat-v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat-l{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

  .dash-block{margin-bottom:20px}
  .dash-block:last-child{margin-bottom:0}
  .dash-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .dash-head h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .dash-head span{font-size:12px;color:var(--muted)}

  .chart{display:flex;gap:3px;align-items:stretch}
  .bar-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
  .bar-track{height:118px;background:var(--surface-2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
  .bar-fill{width:100%;background:var(--accent);border-radius:5px;transition:height .3s ease}
  .bar-lbl{font-size:9.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden}

  .brk-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .brk-row:last-child{border-bottom:0;padding-bottom:0}
  .brk-name{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brk-val{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .brk-bar{grid-column:1/-1;height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .brk-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

  /* ---------- plan ---------- */
  .plan-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .plan-nav .lbl{flex:1;font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plan-day{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .plan-day:last-child{border-bottom:0}
  .plan-day-head{width:96px;flex-shrink:0;font-size:12px;color:var(--muted)}
  .plan-day-head b{display:block;font-size:14px;color:var(--text);font-weight:600;letter-spacing:-.01em}
  .plan-day.today .plan-day-head b{color:var(--accent)}
  .plan-day-list{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .plan-item{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;font-size:13px;transition:.15s;
    content-visibility: auto;
    contain-intrinsic-size: auto 42px;
  }
  .plan-item:hover{border-color:var(--muted)}
  .plan-item.done{opacity:.55}
  .plan-item.done .plan-title{text-decoration:line-through}
  .plan-item input[type=checkbox]{
    width:15px;height:15px;margin:0;padding:0;flex:0 0 auto;
    display:inline-block;accent-color:var(--accent);border-radius:4px;
  }
  .plan-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .plan-meta{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .plan-empty{font-size:12.5px;color:var(--muted);padding:12px;text-align:center;border:1px dashed var(--border);border-radius:10px}
  .plan-add{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);border-radius:10px;padding:7px;text-align:center;cursor:pointer;background:transparent;width:100%;transition:.15s}
  .plan-add:hover{color:var(--text);border-color:var(--muted)}
  @media(max-width:640px){ .plan-day{flex-direction:column;gap:6px} .plan-day-head{width:auto;display:flex;gap:8px;align-items:baseline} .plan-day-head b{display:inline} }

  .plan-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .plan-cal .cal-h{font-size:10.5px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
  .cal-cell{min-height:78px;border:1px solid var(--border);border-radius:9px;padding:5px 6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.15s}
  .cal-cell:hover{border-color:var(--muted)}
  .cal-cell.out{opacity:.4}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .cal-num{font-size:11.5px;color:var(--muted);font-weight:500}
  .cal-cell.today .cal-num{color:var(--accent)}
  .cal-item{font-size:10.5px;padding:2px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-item.done{opacity:.5;text-decoration:line-through}
  @media(max-width:560px){ .cal-cell{min-height:58px;padding:4px} .cal-item{display:none} }

  /* ---------- template groups ---------- */
  .tpl-group{margin-bottom:22px}
  .tpl-group:last-child{margin-bottom:0}
  .tpl-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .tpl-group-head h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tpl-group-head h3 span{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
  .tpl-group-head .actions{display:flex;gap:6px}
  .tpl-empty{font-size:12.5px;color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--border);border-radius:10px}

  /* ---------- backup modal ---------- */
  .backup-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  @media(max-width:480px){ .backup-stat-grid{grid-template-columns:repeat(2,1fr)} }
  .backup-stat{background:var(--surface-2);border-radius:10px;padding:9px 11px;text-align:center}
  .backup-stat b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .backup-stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .backup-row{display:flex;gap:8px;margin-bottom:12px}
  .backup-row .btn{flex:1;padding:11px}
  .backup-meta{font-size:11.5px;color:var(--muted);line-height:1.55;margin:0}
  .backup-warn{
    display:flex;gap:9px;align-items:flex-start;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;margin-top:12px;
    font-size:12px;color:var(--muted);line-height:1.5;
  }
  .backup-warn svg{flex-shrink:0;margin-top:1px;color:var(--accent)}

  /* ---------- modal ---------- */
  /* PERF: no backdrop-filter, no overlay animation, containment added */
  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(0,0,0,.55);
    contain: strict;
  }
  .overlay[hidden]{display:none}
  .modal{
    width:100%;max-width:470px;max-height:86vh;overflow:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
    contain: content;
    overscroll-behavior: contain;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .modal-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--text);
  }
  .preview{margin:12px 0;max-height:160px;overflow:auto;overscroll-behavior:contain}
  .prev-item{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface-2);margin-bottom:5px;
    content-visibility: auto;
    contain-intrinsic-size: auto 34px;
  }
  .prev-item span{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .prev-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:10px}
  .prev-more{font-size:11.5px;color:var(--muted);text-align:center;padding:8px}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:var(--bg);
    padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;
    opacity:0;pointer-events:none;transition:.22s ease;z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    contain: layout paint;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">study<span>plan</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="backupBtn" title="Backup & restore" aria-label="Backup & restore">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <div class="layout">
    <!-- ============ TIMER ============ -->
    <aside class="col-left">
      <div class="card">
        <div class="timer-top">
          <span class="pill" id="phaseEl">Focus</span>
          <span class="timer-session" id="sessionEl">No session</span>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200">
            <circle class="bg" cx="100" cy="100" r="92"></circle>
            <circle class="fg" id="ringFg" cx="100" cy="100" r="92"
                    stroke-dasharray="578.05" stroke-dashoffset="578.05"></circle>
          </svg>
          <div class="ring-center">
            <div class="time" id="timeEl">25:00</div>
            <div class="sub" id="subEl">Pick a session</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn primary" id="startBtn" disabled>Start</button>
          <button class="btn" id="resetBtn">Reset</button>
          <button class="btn" id="skipBtn">Skip</button>
        </div>

        <div class="seg" id="modeSeg">
          <button data-mode="pomodoro">Pomodoro</button>
          <button data-mode="freeflow">Free flow</button>
        </div>

        <details class="settings">
          <summary>Timer settings</summary>
          <div class="inner">
            <div class="two">
              <label class="fld">Focus (min)<input id="setFocus" type="number" min="1" max="180"></label>
              <label class="fld">Short break<input id="setShort" type="number" min="1" max="60"></label>
            </div>
            <div class="two">
              <label class="fld">Long break<input id="setLong" type="number" min="1" max="60"></label>
              <label class="fld">Long every<input id="setEvery" type="number" min="2" max="12"></label>
            </div>
          </div>
        </details>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="col-right">

      <div class="tabs" id="tabBar" role="tablist">
        <button data-tab="sessions"  role="tab" class="on">Sessions</button>
        <button data-tab="plan"      role="tab">Plan</button>
        <button data-tab="dashboard" role="tab">Dashboard</button>
        <button data-tab="resources" role="tab">Resources</button>
        <button data-tab="templates" role="tab">Templates</button>
      </div>

      <!-- ---- Sessions panel ---- -->
      <section class="card tab-panel" data-panel="sessions" role="tabpanel">
        <div class="sec-head">
          <h2>Sessions</h2>
          <div class="sec-actions">
            <button class="btn" id="importBtn">Import</button>
            <button class="btn primary" id="addBtn">+ New</button>
          </div>
        </div>
        <div id="sessionList"></div>
      </section>

      <!-- ---- Plan panel ---- -->
      <section class="card tab-panel" data-panel="plan" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Plan</h2>
          <div class="seg sm" id="planSeg">
            <button data-range="day">Day</button>
            <button data-range="week" class="on">Week</button>
            <button data-range="month">Month</button>
          </div>
        </div>
        <div class="plan-nav">
          <button class="icon-btn sm" id="planPrev" title="Previous">‹</button>
          <span class="lbl" id="planLabel"></span>
          <button class="icon-btn sm" id="planNext" title="Next">›</button>
          <button class="btn sm" id="planToday">Today</button>
        </div>
        <div id="planBody"></div>
      </section>

      <!-- ---- Dashboard panel ---- -->
      <section class="card tab-panel" data-panel="dashboard" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Dashboard</h2>
          <div class="seg sm" id="dashSeg">
            <button data-range="day">Day</button>
            <button data-range="week" class="on">Week</button>
            <button data-range="month">Month</button>
            <button data-range="all">All</button>
          </div>
        </div>
        <div id="dashBody"></div>
      </section>

      <!-- ---- Resources panel ---- -->
      <section class="card tab-panel" data-panel="resources" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Resources</h2>
          <button class="switch on" id="formToggle" role="switch" aria-checked="true"
                  title="Show or hide the add-resource form">
            <span class="track"></span>
            <span class="lbl">Add form</span>
          </button>
        </div>

        <div id="resFormWrap">
          <form class="res-form" id="resForm">
            <input id="resName" placeholder="Resource name" autocomplete="off" required>
            <input id="resUrl" placeholder="https:// (optional)" autocomplete="off">
            <button class="btn primary" type="submit">Add</button>
          </form>
        </div>

        <div id="resList"></div>
      </section>

      <!-- ---- Templates panel ---- -->
      <section class="card tab-panel" data-panel="templates" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Templates</h2>
          <div class="sec-actions">
            <button class="btn" id="importTplBtn">Import</button>
            <button class="btn" id="addGroupBtn">+ Section</button>
            <button class="btn primary" id="addTplBtn">+ Template</button>
          </div>
        </div>
        <p class="hint" style="margin-top:-4px">
          Group reusable layouts into sections. Each template can be used to
          <b>create a session</b>, <b>schedule</b> a plan, or attach resources.
        </p>
        <div id="templateList"></div>
      </section>

    </main>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn sm" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* =====================================================
   STATE
   ===================================================== */
const KEY = "studyplan.v1";
const BASE_TITLE = "Study Plan";
const TABS = ["sessions", "plan", "dashboard", "resources", "templates"];
const DAY = 86400000;
const BACKUP_VERSION = 1;
const $ = (s, r = document) => r.querySelector(s);

let state = {
  theme: null,
  lastBackup: null,
  ui: {
    tab: "sessions",
    hideResForm: false,
    dashRange: "week",
    planRange: "week",
    planAnchor: null
  },
  settings: { mode: "pomodoro", focus: 25, short: 5, long: 15, longEvery: 4 },
  sessions: [],
  resources: [],
  templates: [],
  templateGroups: [],
  plans: [],
  history: []
};

let timer = {
  sessionId: null, blockIndex: 0, phase: "work",
  running: false, remaining: 0, elapsed: 0, total: 0,
  lastTick: 0, longBreak: false, notified: false, finished: false
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const RING_C = 2 * Math.PI * 92;

const ICON_LINK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;

/* ---- date helpers ---- */
function dateKey(d) {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function startOfWeek(d) {
  const x = startOfDay(d);
  const dow = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - dow);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

/* =====================================================
   PERSISTENCE
   ===================================================== */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = {
        ...state, ...d,
        ui:        { ...state.ui, ...(d.ui || {}) },
        settings:  { ...state.settings, ...(d.settings || {}) },
        sessions:  Array.isArray(d.sessions)  ? d.sessions  : [],
        resources: Array.isArray(d.resources) ? d.resources : [],
        plans:     Array.isArray(d.plans)     ? d.plans     : [],
        history:   Array.isArray(d.history)   ? d.history   : []
      };

      if (Array.isArray(d.templateGroups)) {
        state.templateGroups = d.templateGroups;
      } else if (Array.isArray(d.templates) && d.templates.length) {
        state.templateGroups = [{ id: uid(), name: "General", templates: d.templates }];
      } else {
        state.templateGroups = [];
      }
      state.templates = [];
    }
  } catch (e) { /* ignore corrupt storage */ }

  if (!state.theme) {
    state.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  if (!TABS.includes(state.ui.tab)) state.ui.tab = "sessions";
  if (!["day", "week", "month", "all"].includes(state.ui.dashRange)) state.ui.dashRange = "week";
  if (!["day", "week", "month"].includes(state.ui.planRange)) state.ui.planRange = "week";
  if (!state.ui.planAnchor) state.ui.planAnchor = dateKey(new Date());
  if (typeof state.lastBackup !== "number") state.lastBackup = null;

  normalise();
  applyTheme();
}

function normalise() {
  state.sessions.forEach(s => {
    if (!Array.isArray(s.blocks)) s.blocks = [];
    if (!Array.isArray(s.resources)) s.resources = [];
    s.blocks.forEach(b => { if (typeof b.done !== "boolean") b.done = false; });
  });
  state.templateGroups.forEach(g => {
    if (!Array.isArray(g.templates)) g.templates = [];
    g.templates.forEach(t => {
      if (!Array.isArray(t.blocks)) t.blocks = [];
      if (!Array.isArray(t.resources)) t.resources = [];
    });
  });
  state.plans.forEach(p => {
    if (!Array.isArray(p.blocks)) p.blocks = [];
    if (!Array.isArray(p.resources)) p.resources = [];
    if (typeof p.done !== "boolean") p.done = false;
  });
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* =====================================================
   TOAST
   ===================================================== */
const toastEl = $("#toast");
let toastTimer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* =====================================================
   THEME
   ===================================================== */
const themeBtn = $("#themeBtn");

function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  themeBtn.innerHTML = state.theme === "dark"
    ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`
    : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
}

themeBtn.addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme();
  save();
});

/* =====================================================
   TABS
   ===================================================== */
const tabBar = $("#tabBar");

function setTab(tab) {
  if (!TABS.includes(tab)) tab = "sessions";
  state.ui.tab = tab;
  save();

  [...tabBar.children].forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", String(on));
  });

  document.querySelectorAll(".tab-panel").forEach(p => {
    p.hidden = p.dataset.panel !== tab;
  });

  if (tab === "dashboard") renderDashboard();
  if (tab === "plan") renderPlan();
}

tabBar.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});

/* =====================================================
   RESOURCE FORM TOGGLE
   ===================================================== */
const formToggle  = $("#formToggle");
const resFormWrap = $("#resFormWrap");

function applyResFormToggle() {
  const visible = !state.ui.hideResForm;
  resFormWrap.hidden = !visible;
  formToggle.classList.toggle("on", visible);
  formToggle.setAttribute("aria-checked", String(visible));
}

formToggle.addEventListener("click", () => {
  state.ui.hideResForm = !state.ui.hideResForm;
  save();
  applyResFormToggle();
});

/* =====================================================
   AUDIO CUE
   ===================================================== */
let actx = null;
function beep(freq = 660, dur = 0.45) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = "sine"; o.frequency.value = freq;
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

/* =====================================================
   HISTORY
   ===================================================== */
function logStudy(minutes, session, block) {
  if (!minutes || minutes < 0.05) return;
  state.history.push({
    ts: Date.now(),
    minutes: Math.round(minutes * 100) / 100,
    sessionId: session.id,
    sessionTitle: session.title,
    topic: (block && block.topic) || ""
  });
  if (state.history.length > 8000) state.history = state.history.slice(-8000);
  save();
  if (state.ui.tab === "dashboard") renderDashboard();
}

/* =====================================================
   TIMER CORE
   ===================================================== */
const ringFg   = $("#ringFg");
const timeEl   = $("#timeEl");
const subEl    = $("#subEl");
const phaseEl  = $("#phaseEl");
const sessionEl= $("#sessionEl");
const startBtn = $("#startBtn");
const resetBtn = $("#resetBtn");
const skipBtn  = $("#skipBtn");
const modeSeg  = $("#modeSeg");

const getSession = id => state.sessions.find(s => s.id === id);

function findTemplate(id) {
  for (const g of state.templateGroups) {
    const t = g.templates.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}

function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}

function loadPhase() {
  const s = getSession(timer.sessionId);
  if (!s) return;
  const b = s.blocks[timer.blockIndex];
  if (!b) return;

  timer.notified = false;
  timer.elapsed = 0;

  if (state.settings.mode === "freeflow") {
    timer.total = b.minutes * 60;
    timer.remaining = 0;
  } else {
    if (timer.phase === "work") {
      timer.total = b.minutes * 60;
    } else {
      timer.total = (timer.longBreak ? state.settings.long : state.settings.short) * 60;
    }
    timer.remaining = timer.total;
  }
}

function startSession(id) {
  const s = getSession(id);
  if (!s || !s.blocks.length) return;

  let idx = s.blocks.findIndex(b => !b.done);
  if (idx === -1) {
    s.blocks.forEach(b => (b.done = false));
    idx = 0;
    save();
  }

  timer.sessionId  = id;
  timer.blockIndex = idx;
  timer.phase      = "work";
  timer.longBreak  = false;
  timer.finished   = false;
  timer.notified   = false;

  loadPhase();
  timer.running  = true;
  timer.lastTick = Date.now();

  renderSessions();
  updateTimerUI();
}

function resetPhase() {
  if (!timer.sessionId) return;
  timer.finished = false;
  timer.running  = false;
  loadPhase();
  updateTimerUI();
}

function finishSession(s) {
  timer.running  = false;
  timer.finished = true;
  beep(880, 0.35);
  setTimeout(() => beep(1046, 0.5), 170);
  renderSessions();
}

function endPhase() {
  const s = getSession(timer.sessionId);
  if (!s) return;

  const wasRunning = timer.running;
  const mode = state.settings.mode;

  if (mode === "freeflow") {
    logStudy(timer.elapsed / 60, s, s.blocks[timer.blockIndex]);
    s.blocks[timer.blockIndex].done = true;
    if (timer.blockIndex < s.blocks.length - 1) {
      timer.blockIndex++;
      loadPhase();
      timer.running  = wasRunning;
      timer.lastTick = Date.now();
    } else {
      finishSession(s);
    }
  } else if (timer.phase === "work") {
    logStudy((timer.total - timer.remaining) / 60, s, s.blocks[timer.blockIndex]);
    s.blocks[timer.blockIndex].done = true;
    if (timer.blockIndex >= s.blocks.length - 1) {
      finishSession(s);
    } else {
      timer.longBreak = ((timer.blockIndex + 1) % state.settings.longEvery === 0);
      timer.phase = "break";
      loadPhase();
      timer.running  = wasRunning;
      timer.lastTick = Date.now();
      beep(520, 0.4);
    }
  } else {
    timer.blockIndex++;
    timer.phase = "work";
    loadPhase();
    timer.running  = wasRunning;
    timer.lastTick = Date.now();
    beep(760, 0.35);
  }

  save();
  renderSessions();
  updateTimerUI();
}

setInterval(() => {
  if (!timer.running || !timer.sessionId) return;

  const now = Date.now();
  const dt  = (now - timer.lastTick) / 1000;
  timer.lastTick = now;

  const s = getSession(timer.sessionId);
  if (!s) { timer.running = false; return; }

  if (state.settings.mode === "freeflow") {
    timer.elapsed += dt;
    const b = s.blocks[timer.blockIndex];
    if (b && !timer.notified && timer.elapsed >= b.minutes * 60) {
      timer.notified = true;
      beep(700, 0.4);
    }
  } else {
    timer.remaining -= dt;
    if (timer.remaining <= 0) {
      timer.remaining = 0;
      updateTimerUI();
      endPhase();
      return;
    }
  }
  updateTimerUI();
}, 250);

/* =====================================================
   TIMER UI
   ===================================================== */
function updateTimerUI() {
  const s    = getSession(timer.sessionId);
  const mode = state.settings.mode;

  let secs, progress, phase, sub, over = false;

  if (!s) {
    secs     = mode === "pomodoro" ? state.settings.focus * 60 : 0;
    progress = 0;
    phase    = mode === "pomodoro" ? "Focus" : "Free flow";
    sub      = "Pick a session";
    sessionEl.textContent = "No session";
  } else if (timer.finished) {
    secs     = 0;
    progress = 1;
    phase    = "Complete";
    sub      = "All blocks done";
    sessionEl.textContent = s.title;
  } else {
    const b = s.blocks[timer.blockIndex] || { minutes: 25, topic: "" };

    if (mode === "freeflow") {
      secs     = timer.elapsed;
      progress = Math.min(timer.elapsed / (b.minutes * 60), 1);
      over     = timer.elapsed >= b.minutes * 60;
      phase    = "Free flow";
    } else if (timer.phase === "work") {
      secs     = timer.remaining;
      progress = timer.total ? 1 - timer.remaining / timer.total : 0;
      phase    = "Focus";
    } else {
      secs     = timer.remaining;
      progress = timer.total ? 1 - timer.remaining / timer.total : 0;
      phase    = timer.longBreak ? "Long break" : "Break";
    }

    sub = `Block ${timer.blockIndex + 1}/${s.blocks.length} · ${b.topic || "Untitled"}`;
    sessionEl.textContent = s.title;
  }

  timeEl.textContent = fmtTime(secs);
  timeEl.classList.toggle("over", over);
  phaseEl.textContent = phase;
  subEl.textContent   = sub;

  const p = Math.max(0, Math.min(1, progress));
  ringFg.style.strokeDashoffset = String(RING_C * (1 - p));
  ringFg.style.stroke =
    (s && !timer.finished && mode === "pomodoro" && timer.phase === "break")
      ? "var(--break)" : "var(--accent)";

  startBtn.disabled = !timer.sessionId;
  skipBtn.disabled  = !timer.sessionId || timer.finished;
  resetBtn.disabled = !timer.sessionId;

  startBtn.textContent = timer.finished ? "Restart"
                       : timer.running  ? "Pause"
                       : (timer.sessionId ? "Resume" : "Start");

  [...modeSeg.children].forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));

  updateTitle(secs);
}

function updateTitle(secs) {
  const s = getSession(timer.sessionId);
  if (!s) { document.title = BASE_TITLE; return; }
  if (timer.finished) { document.title = `✓ Done · ${BASE_TITLE}`; return; }
  const prefix = timer.running ? "▶ " : "⏸ ";
  document.title = `${prefix}${fmtTime(secs)} · ${BASE_TITLE}`;
}

startBtn.addEventListener("click", () => {
  if (!timer.sessionId) return;
  if (timer.finished) { startSession(timer.sessionId); return; }
  timer.running  = !timer.running;
  timer.lastTick = Date.now();
  updateTimerUI();
});

resetBtn.addEventListener("click", resetPhase);
skipBtn.addEventListener("click", () => {
  if (!timer.sessionId || timer.finished) return;
  endPhase();
});

modeSeg.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (state.settings.mode === b.dataset.mode) return;
  state.settings.mode = b.dataset.mode;
  save();
  if (timer.sessionId && !timer.finished) {
    timer.running = false;
    timer.phase = "work";
    loadPhase();
  }
  renderSessions();
  updateTimerUI();
});

/* =====================================================
   RESOURCES — shared helpers
   ===================================================== */
function safeUrl(u) {
  if (!u) return "";
  try {
    const url = new URL(u.trim());
    return (url.protocol === "http:" || url.protocol === "https:") ? url.href : "";
  } catch (e) { return ""; }
}

const getResource = id => state.resources.find(r => r.id === id);

function resChipsMarkup(ids) {
  const items = (ids || []).map(getResource).filter(Boolean);
  if (!items.length) return "";
  return `<div class="res-mini">${items.map(r => {
    const url = safeUrl(r.url);
    return url
      ? `<a class="chip link" href="${esc(url)}" target="_blank" rel="noopener noreferrer"
            title="${esc(r.url)}">${esc(r.name)}</a>`
      : `<span class="chip static" title="No link">${esc(r.name)}</span>`;
  }).join("")}</div>`;
}

/* ---- Picker (used inside modals) ---- */
let pickerEl = null;

function pickItemsMarkup(selected) {
  if (!state.resources.length)
    return `<div class="pick-empty">No resources yet — add one below.</div>`;
  return state.resources.map(r => `
    <label class="pick">
      <input type="checkbox" value="${r.id}" ${selected.includes(r.id) ? "checked" : ""}>
      <span class="pick-name">${esc(r.name)}</span>
      ${r.url ? `<span class="pick-url">${esc(r.url)}</span>` : ""}
    </label>`).join("");
}

function pickerMarkup(selected) {
  return `
    <div class="pick-list" id="pickWrap">${pickItemsMarkup(selected)}</div>
    <div class="res-form" style="margin-bottom:10px">
      <input id="pickName" placeholder="New resource" autocomplete="off">
      <input id="pickUrl" placeholder="https:// (optional)" autocomplete="off">
      <button class="btn" type="button" id="pickAdd">Add</button>
    </div>`;
}

function getPicked() {
  if (!pickerEl) return [];
  return [...pickerEl.querySelectorAll("input[type=checkbox]")]
    .filter(i => i.checked).map(i => i.value);
}

/* PERF: append only the new row instead of re-rendering the whole picker */
function appendPickItem(r, checked) {
  if (!pickerEl) return;
  const empty = pickerEl.querySelector(".pick-empty");
  if (empty) empty.remove();

  const label = document.createElement("label");
  label.className = "pick";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.value = r.id;
  cb.checked = !!checked;
  label.appendChild(cb);

  const name = document.createElement("span");
  name.className = "pick-name";
  name.textContent = r.name;
  label.appendChild(name);

  if (r.url) {
    const url = document.createElement("span");
    url.className = "pick-url";
    url.textContent = r.url;
    label.appendChild(url);
  }

  pickerEl.appendChild(label);
}

function initPicker() {
  pickerEl = document.getElementById("pickWrap");
  const addBtn = document.getElementById("pickAdd");
  if (!addBtn) return;

  addBtn.addEventListener("click", () => {
    const nameEl = document.getElementById("pickName");
    const urlEl  = document.getElementById("pickUrl");
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }

    const r = { id: uid(), name, url: urlEl.value.trim() };
    state.resources.push(r);
    save();

    appendPickItem(r, true);

    nameEl.value = "";
    urlEl.value = "";
    nameEl.focus();

    renderResources();
  });
}

function openAttachModal(kind, id) {
  let item, title;
  if (kind === "template") {
    item = findTemplate(id);
    title = "Template resources";
  } else if (kind === "plan") {
    item = state.plans.find(x => x.id === id);
    title = "Plan item resources";
  } else {
    item = getSession(id);
    title = "Session resources";
  }
  if (!item) return;
  if (!Array.isArray(item.resources)) item.resources = [];

  openModal(title, `
    <p class="hint">Pick the resources attached to <b>${esc(item.title)}</b>.</p>
    ${pickerMarkup(item.resources)}
    <button class="btn primary wide" id="pickSave">Save</button>
  `);

  initPicker();

  document.getElementById("pickSave").addEventListener("click", () => {
    item.resources = getPicked();
    save();
    closeModal();
    if (kind === "template") renderTemplates();
    else if (kind === "plan") renderPlan();
    else renderSessions();
    toast("Resources updated");
  });
}

/* =====================================================
   BACKUP (Export / Import)
   ===================================================== */
function backupCounts() {
  return {
    sessions: state.sessions.length,
    templates: state.templateGroups.reduce((a, g) => a + g.templates.length, 0),
    sections: state.templateGroups.length,
    plans: state.plans.length,
    resources: state.resources.length,
    history: state.history.length
  };
}

function exportBackup() {
  const payload = {
    app: "studyplan",
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    data: {
      theme: state.theme,
      ui: state.ui,
      settings: state.settings,
      sessions: state.sessions,
      resources: state.resources,
      templateGroups: state.templateGroups,
      plans: state.plans,
      history: state.history
    }
  };

  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const a = document.createElement("a");
    a.href = url;
    a.download = `studyplan-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    state.lastBackup = Date.now();
    save();
    closeModal();
    toast("Backup exported");
  } catch (e) {
    alert("Could not export backup: " + e.message);
  }
}

function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(reader.result);
    } catch (e) {
      alert("That file is not valid JSON.");
      return;
    }

    const data = (parsed && typeof parsed === "object" && parsed.data && typeof parsed.data === "object")
      ? parsed.data
      : parsed;

    if (!data || typeof data !== "object") {
      alert("Unrecognised backup format.");
      return;
    }

    const hasAny =
      Array.isArray(data.sessions) ||
      Array.isArray(data.plans) ||
      Array.isArray(data.templateGroups) ||
      Array.isArray(data.templates) ||
      Array.isArray(data.resources);
    if (!hasAny) {
      alert("This file doesn't look like a Study Plan backup.");
      return;
    }

    let groups = [];
    if (Array.isArray(data.templateGroups)) {
      groups = data.templateGroups;
    } else if (Array.isArray(data.templates) && data.templates.length) {
      groups = [{ id: uid(), name: "Imported", templates: data.templates }];
    }

    const counts = {
      sessions: (data.sessions || []).length,
      sections: groups.length,
      templates: groups.reduce((a, g) => a + ((g && g.templates) || []).length, 0),
      plans: (data.plans || []).length,
      resources: (data.resources || []).length,
      history: (data.history || []).length
    };

    const ok = confirm(
      "Import this backup?\n\n" +
      `Sessions:  ${counts.sessions}\n` +
      `Sections:  ${counts.sections}\n` +
      `Templates: ${counts.templates}\n` +
      `Plans:     ${counts.plans}\n` +
      `Resources: ${counts.resources}\n` +
      `History:   ${counts.history}\n\n` +
      "This will REPLACE all current data. Continue?"
    );
    if (!ok) return;

    state.sessions       = Array.isArray(data.sessions) ? data.sessions : [];
    state.resources      = Array.isArray(data.resources) ? data.resources : [];
    state.templateGroups = groups;
    state.plans          = Array.isArray(data.plans) ? data.plans : [];
    state.history        = Array.isArray(data.history) ? data.history : [];
    if (data.settings && typeof data.settings === "object") {
      state.settings = { ...state.settings, ...data.settings };
    }
    if (data.ui && typeof data.ui === "object") {
      const { tab, hideResForm, dashRange, planRange } = data.ui;
      if (TABS.includes(tab)) state.ui.tab = tab;
      if (typeof hideResForm === "boolean") state.ui.hideResForm = hideResForm;
      if (["day", "week", "month", "all"].includes(dashRange)) state.ui.dashRange = dashRange;
      if (["day", "week", "month"].includes(planRange)) state.ui.planRange = planRange;
    }

    normalise();

    timer.sessionId = null;
    timer.running = false;
    timer.finished = false;

    save();

    $("#setFocus").value = state.settings.focus;
    $("#setShort").value = state.settings.short;
    $("#setLong").value  = state.settings.long;
    $("#setEvery").value = state.settings.longEvery;

    setTab(state.ui.tab);
    applyResFormToggle();
    renderSessions();
    renderResources();
    renderTemplates();
    renderDashboard();
    renderPlan();
    updateTimerUI();

    closeModal();
    toast("Backup imported");
  };
  reader.onerror = () => alert("Could not read that file.");
  reader.readAsText(file);
}

function openBackupModal() {
  const c = backupCounts();
  const lastBackup = state.lastBackup
    ? new Date(state.lastBackup).toLocaleString()
    : "Never";

  openModal("Backup & Restore", `
    <p class="hint">Save all your data as a JSON file, or restore from a previous backup.</p>

    <div class="backup-stat-grid">
      <div class="backup-stat"><b>${c.sessions}</b><span>Sessions</span></div>
      <div class="backup-stat"><b>${c.templates}</b><span>Templates</span></div>
      <div class="backup-stat"><b>${c.plans}</b><span>Plans</span></div>
      <div class="backup-stat"><b>${c.resources}</b><span>Resources</span></div>
    </div>

    <div class="backup-row">
      <button class="btn primary" id="exportBtn" ${c.sessions + c.templates + c.plans + c.resources === 0 ? "disabled" : ""}>
        Export backup
      </button>
      <button class="btn" id="importBtn">Import backup</button>
    </div>

    <input type="file" id="importFile" accept=".json,application/json" hidden>

    <p class="backup-meta">
      Last export: <b>${esc(lastBackup)}</b><br>
      File includes sessions, plans, templates, resources, history, and settings.
    </p>

    <div class="backup-warn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>Importing <b>replaces</b> everything currently stored. Export a fresh backup first if you want a safety net.</span>
    </div>
  `);

  const exportBtn = document.getElementById("exportBtn");
  const importBtn = document.getElementById("importBtn");
  const fileInput = document.getElementById("importFile");

  if (exportBtn) exportBtn.addEventListener("click", exportBackup);
  importBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (f) importBackupFile(f);
    e.target.value = "";
  });
}

$("#backupBtn").addEventListener("click", openBackupModal);

/* =====================================================
   SESSIONS
   ===================================================== */
const sessionList = $("#sessionList");

function renderSessions() {
  if (!state.sessions.length) {
    sessionList.innerHTML =
      `<div class="empty">No sessions yet.<br>Create one, import one, or start from a <b>template</b>.</div>`;
    return;
  }

  sessionList.innerHTML = state.sessions.map(s => {
    const total = s.blocks.length;
    const done  = s.blocks.filter(b => b.done).length;
    const mins  = s.blocks.reduce((a, b) => a + b.minutes, 0);
    const pct   = total ? (done / total) * 100 : 0;
    const active = timer.sessionId === s.id;

    return `
      <div class="session${active ? " active" : ""}" data-id="${s.id}">
        <div class="session-head">
          <div>
            <div class="session-title">${esc(s.title)}</div>
            <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min · ${done}/${total} done</div>
          </div>
          <div class="session-actions">
            <button class="btn" data-act="start">${active ? "Restart" : "Start"}</button>
            <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
            <button class="icon-btn sm" data-act="tmpl" title="Save as template">★</button>
            <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
          </div>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="blocks">
          ${s.blocks.map((b, i) => `
            <span class="chip${b.done ? " done" : ""}" data-act="toggle" data-i="${i}"
                  title="Toggle done">${esc(b.topic || "Block " + (i + 1))} · ${b.minutes}m</span>
          `).join("")}
        </div>
        ${resChipsMarkup(s.resources)}
      </div>`;
  }).join("");
}

sessionList.addEventListener("click", e => {
  const card = e.target.closest(".session");
  if (!card) return;
  const id  = card.dataset.id;
  const s   = getSession(id);
  if (!s) return;

  const el  = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "start") {
    startSession(id);
  } else if (act === "res") {
    openAttachModal("session", id);
  } else if (act === "del") {
    if (!confirm(`Delete "${s.title}"?`)) return;
    state.sessions = state.sessions.filter(x => x.id !== id);
    if (timer.sessionId === id) {
      timer.sessionId = null;
      timer.running = false;
      timer.finished = false;
    }
    save(); renderSessions(); updateTimerUI();
  } else if (act === "tmpl") {
    if (!state.templateGroups.length) {
      state.templateGroups.push({ id: uid(), name: "General", templates: [] });
    }
    const targetGroup = state.templateGroups[0];
    targetGroup.templates.push({
      id: uid(),
      title: s.title,
      blocks: s.blocks.map(b => ({ topic: b.topic, minutes: b.minutes })),
      resources: [...(s.resources || [])],
      created: Date.now()
    });
    save();
    renderTemplates();
    const prev = el.textContent;
    el.textContent = "✓";
    setTimeout(() => { el.textContent = prev; }, 900);
    toast(`Saved to "${targetGroup.name}"`);
  } else if (act === "toggle") {
    const i = +el.dataset.i;
    s.blocks[i].done = !s.blocks[i].done;
    save(); renderSessions();
  }
});

/* =====================================================
   PLAN
   ===================================================== */
const planSeg   = $("#planSeg");
const planLabel = $("#planLabel");
const planBody  = $("#planBody");
const planPrev  = $("#planPrev");
const planNext  = $("#planNext");
const planToday = $("#planToday");

function planAnchorDate() {
  const d = state.ui.planAnchor
    ? new Date(state.ui.planAnchor + "T00:00:00")
    : new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function shiftPlan(dir) {
  const d = planAnchorDate();
  if (state.ui.planRange === "day")        d.setDate(d.getDate() + dir);
  else if (state.ui.planRange === "week")  d.setDate(d.getDate() + 7 * dir);
  else                                     d.setMonth(d.getMonth() + dir);
  state.ui.planAnchor = dateKey(d);
  save();
  renderPlan();
}

function planTotal(blocks) {
  return (blocks || []).reduce((a, b) => a + b.minutes, 0);
}

function renderPlanItem(p) {
  const total = planTotal(p.blocks);
  return `
    <div class="plan-item ${p.done ? "done" : ""}" data-plan="${p.id}">
      <input type="checkbox" data-act="toggle" ${p.done ? "checked" : ""}>
      <span class="plan-title">${esc(p.title)}</span>
      <span class="plan-meta">${p.blocks.length}b · ${total}m</span>
      <button class="btn sm" data-act="start">Start</button>
      <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
      <button class="icon-btn sm" data-act="del" title="Remove">✕</button>
    </div>`;
}

function renderPlanDay(d) {
  const key = dateKey(d);
  const todayKey = dateKey(new Date());
  const items = state.plans
    .filter(p => p.date === key)
    .sort((a, b) => a.created - b.created);

  return `
    <div class="plan-day ${key === todayKey ? "today" : ""}">
      <div class="plan-day-head">
        <b>${d.toLocaleDateString(undefined, { weekday: "long" })}</b>
        <span>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
      </div>
      <div class="plan-day-list">
        ${items.length ? items.map(renderPlanItem).join("") : `<div class="plan-empty">Nothing planned</div>`}
        <button class="plan-add" data-add="${key}">+ Add to ${d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" })}</button>
      </div>
    </div>`;
}

function renderMonthGrid(anchor) {
  const year = anchor.getFullYear();
  const month = anchor.getMonth();
  const first = new Date(year, month, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) {
    cells.push({ d: new Date(year, month - 1, prevMonthDays - i), out: true });
  }
  for (let i = 1; i <= daysInMonth; i++) {
    cells.push({ d: new Date(year, month, i), out: false });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].d;
    cells.push({ d: addDays(last, 1), out: true });
  }

  const todayKey = dateKey(new Date());

  return `
    <div class="plan-cal">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="cal-h">${d}</div>`).join("")}
      ${cells.map(c => {
        const key = dateKey(c.d);
        const items = state.plans.filter(p => p.date === key);
        return `<div class="cal-cell ${c.out ? "out" : ""} ${key === todayKey ? "today" : ""}" data-day="${key}">
          <div class="cal-num">${c.d.getDate()}</div>
          ${items.slice(0, 3).map(p => `<div class="cal-item ${p.done ? "done" : ""}">${esc(p.title)}</div>`).join("")}
          ${items.length > 3 ? `<div style="font-size:10px;color:var(--muted)">+${items.length - 3} more</div>` : ""}
        </div>`;
      }).join("")}
    </div>`;
}

function renderPlan() {
  const range = state.ui.planRange;
  [...planSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));

  const anchor = planAnchorDate();
  let label = "";

  if (range === "day") {
    label = anchor.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
  } else if (range === "week") {
    const start = startOfWeek(anchor);
    const end = addDays(start, 6);
    label = `${start.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${end.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
  } else {
    label = anchor.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  planLabel.textContent = label;

  let html = "";
  if (range === "day") {
    html = renderPlanDay(anchor);
  } else if (range === "week") {
    const start = startOfWeek(anchor);
    for (let i = 0; i < 7; i++) html += renderPlanDay(addDays(start, i));
  } else {
    html = renderMonthGrid(anchor);
  }

  planBody.innerHTML = html;
}

planSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");
  if (!b) return;
  state.ui.planRange = b.dataset.range;
  save();
  renderPlan();
});

planPrev.addEventListener("click", () => shiftPlan(-1));
planNext.addEventListener("click", () => shiftPlan(1));
planToday.addEventListener("click", () => {
  state.ui.planAnchor = dateKey(new Date());
  save();
  renderPlan();
});

planBody.addEventListener("click", e => {
  const addBtn = e.target.closest("[data-add]");
  if (addBtn) { openPlanAddModal(addBtn.dataset.add); return; }

  const cell = e.target.closest("[data-day]");
  if (cell && !e.target.closest("[data-plan]")) {
    state.ui.planAnchor = cell.dataset.day;
    state.ui.planRange = "day";
    save();
    renderPlan();
    return;
  }

  const itemEl = e.target.closest("[data-plan]");
  if (!itemEl) return;
  const pid = itemEl.dataset.plan;
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const action = act.dataset.act;

  if (action === "toggle") {
    const p = state.plans.find(x => x.id === pid);
    if (p) { p.done = !p.done; save(); renderPlan(); }
  } else if (action === "del") {
    state.plans = state.plans.filter(x => x.id !== pid);
    save(); renderPlan();
  } else if (action === "start") {
    startPlanItem(pid);
  } else if (action === "res") {
    openAttachModal("plan", pid);
  }
});

function startPlanItem(planId) {
  const p = state.plans.find(x => x.id === planId);
  if (!p) return;

  let s = p.sessionId ? getSession(p.sessionId) : null;
  if (!s) {
    s = {
      id: uid(),
      title: p.title,
      blocks: p.blocks.map(b => ({ topic: b.topic, minutes: b.minutes, done: false })),
      resources: [...(p.resources || [])],
      created: Date.now()
    };
    state.sessions.push(s);
    p.sessionId = s.id;
    save();
    renderSessions();
  }

  startSession(s.id);
  setTab("sessions");
}

/* PERF: single delegated click handler, capped preview, no per-item listeners */
function openPlanAddModal(dateStr) {
  const sessions = state.sessions;
  const allTemplates = state.templateGroups.flatMap(g =>
    g.templates.map(t => ({ t, groupName: g.name }))
  );

  const nothing = !sessions.length && !allTemplates.length;

  openModal("Add to plan", `
    <label class="fld">Date
      <input id="plDate" type="date" value="${esc(dateStr)}">
    </label>
    <div class="fld" style="margin-bottom:6px">Pick a session or template</div>
    <div class="pick-list" style="max-height:300px" id="planPickWrap">
      ${nothing ? `<div class="pick-empty">Nothing to add. Create a session or template first.</div>` : ""}
      ${sessions.map(s => `
        <div class="pick" data-pick="session" data-id="${s.id}">
          <span class="pick-name">${esc(s.title)}</span>
          <span class="pick-url">${s.blocks.length}b · ${planTotal(s.blocks)}m</span>
        </div>`).join("")}
      ${allTemplates.map(({ t, groupName }) => `
        <div class="pick" data-pick="template" data-id="${t.id}">
          <span class="pick-name">${esc(t.title)}
            <span style="color:var(--muted);font-size:11px">· ${esc(groupName)}</span>
          </span>
          <span class="pick-url">${t.blocks.length}b · ${planTotal(t.blocks)}m</span>
        </div>`).join("")}
    </div>
  `, e => {
    const el = e.target.closest("[data-pick]");
    if (!el) return;
    const date = (document.getElementById("plDate") || {}).value || dateStr;
    addPlanFromSource(el.dataset.pick, el.dataset.id, date);
    closeModal();
    renderPlan();
    toast("Added to plan");
  });
}

function addPlanFromSource(kind, id, dateStr) {
  let title, blocks, resources;
  if (kind === "session") {
    const s = getSession(id); if (!s) return;
    title = s.title;
    blocks = s.blocks.map(b => ({ topic: b.topic, minutes: b.minutes }));
    resources = [...(s.resources || [])];
  } else {
    const t = findTemplate(id); if (!t) return;
    title = t.title;
    blocks = t.blocks.map(b => ({ topic: b.topic, minutes: b.minutes }));
    resources = [...(t.resources || [])];
  }

  state.plans.push({
    id: uid(),
    date: dateStr,
    title,
    blocks: blocks.map(b => ({ ...b, done: false })),
    resources,
    done: false,
    created: Date.now()
  });
  save();
}

/* =====================================================
   TEMPLATES
   ===================================================== */
const templateList = $("#templateList");

function renderTemplateCard(t, groupId) {
  const total = t.blocks.length;
  const mins  = planTotal(t.blocks);

  return `
    <div class="session" data-tpl="${t.id}" data-group="${groupId}">
      <div class="session-head">
        <div>
          <div class="session-title">${esc(t.title)}</div>
          <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min total</div>

  if (!groupEl) return;
  const groupId = groupEl.dataset.group;
  const group = state.templateGroups.find(x => x.id === groupId);
  if (!group) return;

  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  const act = actEl.dataset.act;

  if (act === "add-tpl") {
    openCreateModal("template", groupId);
    return;
  }
  if (act === "rename-group") {
    const name = prompt("Section name:", group.name);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    group.name = trimmed;
    save();
    renderTemplates();
    return;
  }
  if (act === "del-group") {
    if (!confirm(`Delete section "${group.name}" and all its templates?`)) return;
    state.templateGroups = state.templateGroups.filter(x => x.id !== groupId);
    save();
    renderTemplates();
    return;
  }

  const tplEl = e.target.closest("[data-tpl]");
  if (!tplEl) return;
  const tplId = tplEl.dataset.tpl;
  const t = findTemplate(tplId);
  if (!t) return;

  if (act === "use") {
    const session = {
      id: uid(),
      title: t.title,
      blocks: t.blocks.map(b => ({ topic: b.topic, minutes: b.minutes, done: false })),
      resources: [...(t.resources || [])],
      created: Date.now()
    };
    state.sessions.push(session);
    save();
    renderSessions();
    setTab("sessions");
    toast(`Session "${session.title}" created`);

    openPlanAddModal(dateKey(new Date()));
  } else if (act === "res") {
    openAttachModal("template", tplId);
  } else if (act === "del") {
    if (!confirm(`Delete template "${t.title}"?`)) return;
    group.templates = group.templates.filter(x => x.id !== tplId);
    save();

  }

/* =====================================================
   DASHBOARD
   ===================================================== */
const dashBody = $("#dashBody");
const dashSeg  = $("#dashSeg");

function startOfToday() {
  const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
}
function dayKey(t) {
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtDur(mins) {
  const m = Math.round(mins);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function rangeBounds(range) {
  const t0 = startOfToday();
  if (range === "day")   return [t0, t0 + DAY];
  if (range === "week")  return [t0 - 6 * DAY, t0 + DAY];
  if (range === "month") return [t0 - 29 * DAY, t0 + DAY];
  return [0, Infinity];
}

function buildBuckets(range) {
  const t0 = startOfToday();
  const out = [];

  if (range === "day") {
    for (let h = 0; h < 24; h++) {
      const s = t0 + h * 3600000;
      out.push({
        start: s, end: s + 3600000,
        label: h % 3 === 0 ? String(h).padStart(2, "0") : "",
        tip: `${String(h).padStart(2, "0")}:00`
      });
    }
  } else if (range === "week") {
    for (let i = 6; i >= 0; i--) {
      const s = t0 - i * DAY, d = new Date(s);
      out.push({
        start: s, end: s + DAY,
        label: d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2),
        tip: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
    }
  } else if (range === "month") {
    for (let i = 29; i >= 0; i--) {
      const s = t0 - i * DAY, d = new Date(s);
      out.push({
        start: s, end: s + DAY,
        label: (i % 5 === 0 || i === 0) ? String(d.getDate()) : "",
        tip: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
    }
  } else {
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const s = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const e = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      out.push({
        start: s.getTime(), end: e.getTime(),
        label: s.toLocaleDateString(undefined, { month: "short" }),
        tip: s.toLocaleDateString(undefined, { month: "long", year: "numeric" })
      });
    }
  }
  return out;
}

function computeStreak() {
  const keys = new Set(state.history.map(h => dayKey(h.ts)));
  let streak = 0;
  const cur = new Date(); cur.setHours(0, 0, 0, 0);
  if (!keys.has(dayKey(cur.getTime()))) cur.setDate(cur.getDate() - 1);
  while (keys.has(dayKey(cur.getTime()))) { streak++; cur.setDate(cur.getDate() - 1); }
  return streak;
}

function renderDashboard() {
  const range = state.ui.dashRange;
  [...dashSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));

  if (!state.history.length) {
    dashBody.innerHTML =
      `<div class="empty">No study data yet.<br>Finish a focus block and your stats will appear here.</div>`;
    return;
  }

  const [start, end] = rangeBounds(range);
  const entries = state.history.filter(h => h.ts >= start && h.ts < end);

  const total    = entries.reduce((a, h) => a + h.minutes, 0);
  const blocks   = entries.length;
  const sessions = new Set(entries.map(h => h.sessionId)).size;
  const days     = new Set(entries.map(h => dayKey(h.ts))).size;

  const spanDays = range === "day"   ? 1
                 : range === "week"  ? 7
                 : range === "month" ? 30
                 : Math.max(1, Math.ceil((Date.now() - (state.history[0] ? state.history[0].ts : Date.now())) / DAY));
  const avg = total / spanDays;

  const streak = computeStreak();

  const buckets = buildBuckets(range);
  const values  = buckets.map(b =>
    entries.filter(h => h.ts >= b.start && h.ts < b.end)
           .reduce((a, h) => a + h.minutes, 0));
  const maxV    = Math.max(...values, 1);
  const bestIdx = values.indexOf(Math.max(...values));

  const byS = new Map();
  entries.forEach(h => {
    const k = h.sessionTitle || "Untitled";
    const o = byS.get(k) || { minutes: 0, count: 0 };
    o.minutes += h.minutes; o.count++;
    byS.set(k, o);
  });
  const bySList = [...byS.entries()].sort((a, b) => b[1].minutes - a[1].minutes).slice(0, 8);
  const maxS = bySList.length ? bySList[0][1].minutes : 1;

  const byT = new Map();
  entries.forEach(h => {
    const k = (h.topic || "").trim();
    if (!k) return;
    byT.set(k, (byT.get(k) || 0) + h.minutes);
  });
  const byTList = [...byT.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxT = byTList.length ? byTList[0][1] : 1;

  dashBody.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="stat-v">${total > 0 ? fmtDur(total) : "0m"}</div><div class="stat-l">Focus time</div></div>
      <div class="stat"><div class="stat-v">${blocks}</div><div class="stat-l">Blocks</div></div>
      <div class="stat"><div class="stat-v">${sessions}</div><div class="stat-l">Sessions</div></div>
      <div class="stat"><div class="stat-v">${days}</div><div class="stat-l">Active days</div></div>
      <div class="stat"><div class="stat-v">${avg >= 1 ? fmtDur(avg) : "0m"}</div><div class="stat-l">Avg / day</div></div>
      <div class="stat"><div class="stat-v">${streak}d</div><div class="stat-l">Streak</div></div>
    </div>

    <div class="dash-block">
      <div class="dash-head">
        <h3>Activity</h3>
        <span>${total > 0
          ? `Best ${esc(buckets[bestIdx].tip)} · ${fmtDur(values[bestIdx])}`
          : "No activity in this range"}</span>
      </div>
      <div class="chart">
        ${buckets.map((b, i) => {
          const v = values[i];
          const h = v > 0 ? Math.max(3, (v / maxV) * 100) : 0;
          return `<div class="bar-col" title="${esc(b.tip)} · ${fmtDur(v)}">
                    <div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div>
                    <div class="bar-lbl">${esc(b.label)}</div>
                  </div>`;
        }).join("")}
      </div>
    </div>

    <div class="dash-block">
      <div class="dash-head">
        <h3>By session</h3>
        <span>${sessions} session${sessions !== 1 ? "s" : ""}</span>
      </div>
      ${bySList.length ? bySList.map(([name, o]) => `
        <div class="brk-row">
          <div class="brk-name">${esc(name)}</div>
          <div class="brk-val">${fmtDur(o.minutes)} · ${o.count} block${o.count !== 1 ? "s" : ""}</div>
          <div class="brk-bar"><i style="width:${(o.minutes / maxS) * 100}%"></i></div>
        </div>`).join("")
        : `<div class="empty" style="padding:14px">No sessions in this range.</div>`}
    </div>

    ${byTList.length ? `
    <div class="dash-block">
      <div class="dash-head"><h3>By topic</h3><span>top ${byTList.length}</span></div>
      ${byTList.map(([name, m]) => `
        <div class="brk-row">
          <div class="brk-name">${esc(name)}</div>
          <div class="brk-val">${fmtDur(m)}</div>
          <div class="brk-bar"><i style="width:${(m / maxT) * 100}%"></i></div>
        </div>`).join("")}
    </div>` : ""}
  `;
}

dashSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");
  if (!b) return;
  if (state.ui.dashRange === b.dataset.range) return;
  state.ui.dashRange = b.dataset.range;

/* =====================================================
   IMPORT PARSER
   ===================================================== */
function parseSessions(text) {
  const out = [];

  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    let title = "", spec = line;

    const m = line.match(/^(.*)\s*[-–—]\s*(.+)$/);
    if (m && /\d/.test(m[2])) {
      title = m[1].trim();
      spec  = m[2].trim();
    }

    const blocks = [];
    spec.split(/[,;]/).map(p => p.trim()).filter(Boolean).forEach(part => {
      const pair = part.match(/(\d+)\s*(?:x|\*|×|X)\s*(\d+)/);
      if (pair) {
        let a = +pair[1], b = +pair[2], count, minutes;
        if (a <= 12 && b > 12) { count = a; minutes = b; }
        else                   { minutes = a; count = b; }
        count   = Math.max(1, Math.min(50, count));
        minutes = Math.max(1, Math.min(300, minutes));
        for (let i = 0; i < count; i++) blocks.push({ topic: "", minutes, done: false });
      } else {
        const single = part.match(/(\d+)/);
        if (single) blocks.push({ topic: "", minutes: Math.min(300, +single[1]), done: false });
      }
    });

    if (!blocks.length) return;

    const topics = title ? title.split(",").map(t => t.trim()).filter(Boolean) : [];
    if (topics.length === blocks.length && topics.length > 1) {
      blocks.forEach((b, i) => (b.topic = topics[i]));
    } else {
      blocks.forEach((b, i) => (b.topic = "Topic " + (i + 1)));
    }

    out.push({ title: title || "Session", blocks });
  });

  return out;
}

/* =====================================================
   MODAL
   ===================================================== */
const overlay    = $("#overlay");
const modalTitle = $("#modalTitle");
const modalBody  = $("#modalBody");

/* PERF: single reusable click handler, swapped per modal */
let modalClickHandler = null;

function openModal(title, html, onClick) {
  // detach any previous handler
  if (modalClickHandler) {
    modalBody.removeEventListener("click", modalClickHandler);
    modalClickHandler = null;
  }
  modalTitle.textContent = title;
  modalBody.innerHTML = html;
  overlay.hidden = false;
  if (typeof onClick === "function") {
    modalClickHandler = onClick;
    modalBody.addEventListener("click", modalClickHandler);
  }
}

function closeModal() {
  if (modalClickHandler) {
    modalBody.removeEventListener("click", modalClickHandler);
    modalClickHandler = null;
  }
  overlay.hidden = true;
  modalBody.innerHTML = "";
  pickerEl = null;
}

$("#modalClose").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !overlay.hidden) closeModal();
});

function openCreateModal(kind, groupId) {
  const isTpl = kind === "template";

  if (isTpl && !state.templateGroups.length) {
