/* ---------- TIME WINDOW OVERVIEW ---------- */
const OTHER = "__other";
const ovOpen = new Set();   // template groups whose blocks are expanded

const fmtClock = ms => {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};
const ovColor = i => `hsl(${(i * 57 + 255) % 360} 62% 58%)`;

/* Blocks grouped by the template they came from, in study order */
function blockGroups(s) {
  const map = new Map();
  s.blocks.forEach(b => {
    const key = b.tpl || OTHER;
    if (!map.has(key)) map.set(key, { key, blocks: [] });
    map.get(key).blocks.push(b);
  });
  return [...map.values()].map(g => {
    const live = g.key !== OTHER ? findTemplate(g.key) : null;
    g.title = g.key === OTHER ? "Other blocks"
            : (live ? live.title : (g.blocks[0].tplTitle || "Template"));
    return g;
  });
}

/* Clock times for every block, following the planned breaks */
function buildSchedule(s) {
  const wb = windowBounds(s.window);
  if (!wb) return null;
  const pomodoro = state.settings.mode === "pomodoro";
  const every = state.settings.longEvery;
  const n = s.blocks.length;
  let t = wb[0];
  const items = s.blocks.map((b, i) => {
    const start = t, end = t + b.minutes * 60000;
    t = end;
    let brk = 0;
    if (pomodoro && i < n - 1) {
      brk = getBreakMins(s, (i + 1) % every === 0) * 60000;
      t += brk;
    }
    return { b, i, start, end, brk };
  });
  return {
    startMs: wb[0],
    endMs: wb[1],
    items,
    finish: items.length ? items[items.length - 1].end : wb[0]
  };
}

function applyBlockOrder(s, groups, flashKey) {
  const current = timer.sessionId === s.id ? s.blocks[timer.blockIndex] : null;
  s.blocks = groups.flatMap(g => g.blocks);
  s.window.templateIds = groups.map(g => g.key).filter(k => k !== OTHER);
  if (current) {
    const ni = s.blocks.indexOf(current);
    if (ni >= 0) timer.blockIndex = ni;
  }
  save();
  renderSessions();
  updateTimerUI();
  openWindowOverview(s.id, flashKey);
}

function moveGroup(s, key, dir) {
  const groups = blockGroups(s);
  const i = groups.findIndex(g => g.key === key);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= groups.length) return;
  [groups[i], groups[j]] = [groups[j], groups[i]];
  applyBlockOrder(s, groups, key);
}

function moveBlock(s, key, bi, dir) {
  const groups = blockGroups(s);
  const g = groups.find(x => x.key === key);
  if (!g) return;
  const j = bi + dir;
  if (j < 0 || j >= g.blocks.length) return;
  [g.blocks[bi], g.blocks[j]] = [g.blocks[j], g.blocks[bi]];
  applyBlockOrder(s, groups, key);
}

function defaultOverviewId() {
  const wins = state.sessions.filter(x => x.window && windowBounds(x.window));
  if (!wins.length) return null;
  const now = Date.now();
  const startOf = x => windowBounds(x.window)[0];
  const endOf   = x => windowBounds(x.window)[1];
  const live = wins.find(x => now >= startOf(x) && now < endOf(x));
  if (live) return live.id;
  const next = wins.filter(x => startOf(x) > now).sort((a, b) => startOf(a) - startOf(b))[0];
  if (next) return next.id;
  return wins.sort((a, b) => startOf(b) - startOf(a))[0].id;
}

function openWindowOverview(id, flashKey) {
  const wins = state.sessions
    .filter(x => x.window && windowBounds(x.window))
    .sort((a, b) => windowBounds(a.window)[0] - windowBounds(b.window)[0]);
  if (!wins.length) { toast("Create a time window first"); return; }

  const s = wins.find(x => x.id === id) || getSession(defaultOverviewId());
  if (!s) return;

  const sched  = buildSchedule(s);
  const groups = blockGroups(s);
  const itemOf = new Map(sched.items.map(it => [it.b, it]));
  const winMin = (sched.endMs - sched.startMs) / 60000;
  const workMin = s.blocks.reduce((a, b) => a + b.minutes, 0);
  const breakMin = sched.items.reduce((a, it) => a + it.brk, 0) / 60000;
  const spare = (sched.endMs - sched.finish) / 60000;

  let cls, status;
  if (!s.blocks.length)  { cls = "";      status = "No blocks in this window"; }
  else if (spare < 0)    { cls = "over";  status = `Doesn't fit — over by ${fmtDur(-spare)}`; }
  else if (spare < 30)   { cls = "tight"; status = `Tight — only ${fmtDur(spare)} of spare time`; }
  else                   { cls = "ok";    status = `Fits with ${fmtDur(spare)} spare`; }

  /* timeline */
  const spanMs = Math.max(sched.endMs - sched.startMs, sched.finish - sched.startMs, 1);
  const pct = ms => (ms / spanMs) * 100;
  const colorOf = new Map(groups.map((g, i) => [g.key, ovColor(i)]));
  const now = Date.now();

  const segs = sched.items.map(it => {
    const key = it.b.tpl || OTHER;
    const late = it.end > sched.endMs ? " late" : "";
    const g = groups.find(x => x.key === key);
    const tip = `${g.title} · ${it.b.topic || "Block"} · ${fmtClock(it.start)}–${fmtClock(it.end)}`;
    return `<i class="ov-seg${late}" style="flex:0 0 ${pct(it.end - it.start)}%;background-color:${colorOf.get(key)}" title="${esc(tip)}"></i>`
         + (it.brk ? `<i class="ov-seg brk" style="flex:0 0 ${pct(it.brk)}%" title="Break · ${fmtDur(it.brk / 60000)}"></i>` : "");
  }).join("");

  const endLine = spanMs > sched.endMs - sched.startMs
    ? `<span class="ov-endline" style="left:${pct(sched.endMs - sched.startMs)}%" title="Window ends ${fmtClock(sched.endMs)}"></span>` : "";
  const nowLine = (now >= sched.startMs && now <= sched.startMs + spanMs)
    ? `<span class="ov-now" style="left:${pct(now - sched.startMs)}%" title="Now"></span>` : "";

  /* study order rows */
  const rows = groups.map((g, gi) => {
    const its   = g.blocks.map(b => itemOf.get(b));
    const gS    = its[0].start;
    const gE    = its[its.length - 1].end;
    const work  = g.blocks.reduce((a, b) => a + b.minutes, 0);
    const done  = g.blocks.filter(b => b.done).length;
    const over  = gS >= sched.endMs ? "Outside the window"
                : gE > sched.endMs  ? `Runs ${fmtDur((gE - sched.endMs) / 60000)} over` : "";
    const open  = ovOpen.has(g.key);
    const lastBrk = its[its.length - 1].brk;

    const blockRows = its.map((it, bi) => `
      <div class="ov-blk${it.b.done ? " done" : ""}" data-bi="${bi}">
        <span class="t">${fmtClock(it.start)}–${fmtClock(it.end)}</span>
        <span class="n">${esc(it.b.topic || "Block")}</span>
        <span class="m">${it.b.minutes}m</span>
        <button class="icon-btn sm" data-act="ov-b-up" title="Move block earlier" aria-label="Move block earlier" ${bi === 0 ? "disabled" : ""}>▲</button>
        <button class="icon-btn sm" data-act="ov-b-down" title="Move block later" aria-label="Move block later" ${bi === its.length - 1 ? "disabled" : ""}>▼</button>
      </div>
      ${it.brk && bi < its.length - 1 ? `<div class="ov-brk">${fmtClock(it.end)} · ${fmtDur(it.brk / 60000)} break</div>` : ""}
    `).join("");

    return `
      <div class="ov-group${open ? " open" : ""}${g.key === flashKey ? " flash" : ""}" data-key="${esc(g.key)}">
        <div class="ov-row">
          <span class="ov-dot" style="background:${colorOf.get(g.key)}"></span>
          <div class="ov-info">
            <div class="ov-name">${gi + 1}. ${esc(g.title)}</div>
            <div class="ov-sub${over ? " late" : ""}">${fmtClock(gS)} – ${fmtClock(gE)} · ${fmtDur(work)} · ${done}/${g.blocks.length} done${over ? ` · ${over}` : ""}</div>
          </div>
          <div class="ov-move">
            <button class="icon-btn sm" data-act="ov-g-up" title="Study earlier" aria-label="Study earlier" ${gi === 0 ? "disabled" : ""}>▲</button>
            <button class="icon-btn sm" data-act="ov-g-down" title="Study later" aria-label="Study later" ${gi === groups.length - 1 ? "disabled" : ""}>▼</button>
            <button class="icon-btn sm" data-act="ov-toggle" title="Show blocks" aria-label="Show blocks" aria-expanded="${open}"><span class="ov-chev">›</span></button>
          </div>
        </div>
        ${open ? `<div class="ov-blocks">${blockRows}${lastBrk && gi < groups.length - 1 ? `<div class="ov-brk">${fmtClock(its[its.length - 1].end)} · ${fmtDur(lastBrk / 60000)} break</div>` : ""}</div>` : ""}
      </div>`;
  }).join("");

  const dateLabel = new Date(`${s.window.date}T00:00:00`)
    .toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

  const topHtml = wins.length > 1
    ? `<select id="ovSel" aria-label="Choose time window">${wins.map(w => {
        const d = new Date(`${w.window.date}T00:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric" });
        return `<option value="${w.id}" ${w.id === s.id ? "selected" : ""}>${esc(w.title)} · ${d} ${esc(w.window.start)}–${esc(windowEndLabel(w.window))}</option>`;
      }).join("")}</select>`
    : `<div class="ov-title">${esc(s.title)}</div>`;

  const modalEl = overlay.querySelector(".modal");
  const keepScroll = !overlay.hidden && modalEl.classList.contains("wide") ? modalEl.scrollTop : 0;

  openModal("Time window overview", `
    <div class="ov-top">
      ${topHtml}
      <div class="ov-when">${esc(dateLabel)} · ${esc(s.window.start)} – ${esc(windowEndLabel(s.window))}${s.window.pausedMs > 0 ? ` (${esc(windowDelayTag(s.window))})` : ""}</div>
    </div>

    <div class="ov-tl" role="img" aria-label="Timeline of the window">${segs}${endLine}${nowLine}</div>
    <div class="ov-axis"><span>${fmtClock(sched.startMs)}</span><span>${fmtClock(sched.startMs + spanMs)}</span></div>

    <div class="window-preview ${cls}">
      <div class="wp-row"><span>Window</span><b>${fmtDur(winMin)}</b></div>
      <div class="wp-row"><span>Work</span><b>${workMin ? fmtDur(workMin) : "—"}</b></div>
      ${breakMin > 0 ? `<div class="wp-row"><span>Breaks${s.window.breakMinutes ? ` (${s.window.breakMinutes}m each)` : ""}</span><b>+${fmtDur(breakMin)}</b></div>` : ""}
      <div class="wp-row"><span>Planned finish</span><b>${s.blocks.length ? fmtClock(sched.finish) : "—"}</b></div>
      <div class="wp-row wp-status ${cls}">${esc(status)}</div>
    </div>

    <div class="ov-head">
      <h3>Study order</h3>
      <span>${groups.length} template${groups.length !== 1 ? "s" : ""} · ▲▼ to move</span>
    </div>
    ${rows || `<div class="tpl-empty">Nothing in this window yet.</div>`}

    <div class="backup-row" style="margin:14px 0 0">
      <button class="btn" data-act="ov-edit">Edit window</button>
      <button class="btn primary" data-act="ov-close">Done</button>
    </div>
  `, e => {
    const btn = e.target.closest("[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    const grp = btn.closest("[data-key]");
    const key = grp ? grp.dataset.key : null;

    if (act === "ov-g-up")        moveGroup(s, key, -1);
    else if (act === "ov-g-down") moveGroup(s, key, 1);
    else if (act === "ov-b-up")   moveBlock(s, key, +btn.closest("[data-bi]").dataset.bi, -1);
    else if (act === "ov-b-down") moveBlock(s, key, +btn.closest("[data-bi]").dataset.bi, 1);
    else if (act === "ov-toggle") {
      if (ovOpen.has(key)) ovOpen.delete(key); else ovOpen.add(key);
      openWindowOverview(s.id);
    }
    else if (act === "ov-edit")   openWindowModal(s.id);
    else if (act === "ov-close")  closeModal();
  });

  modalEl.classList.add("wide");
  modalEl.scrollTop = keepScroll;

  const sel = document.getElementById("ovSel");
  if (sel) sel.addEventListener("change", () => openWindowOverview(sel.value));
}

overviewBtn.addEventListener("click", () => openWindowOverview(defaultOverviewId()));

/* ---------- OVERVIEW & STUDY ORDER for plan items and templates ---------- */
/* kind: "template" | "plan"; for templates opened from the Plan, date is the plan day;
   backGroupId: template section to return to when closed */
function openItemOverview(kind, id, date, backGroupId) {
  const src = kind === "template" ? findTemplate(id) : state.plans.find(x => x.id === id);
  if (!src) { toast("Item not found"); return; }

  const isRec = kind === "template" && !!date;
  /* a dated template shows only the blocks that run on that weekday; vis keeps the real index for reordering */
  const vis = (src.blocks || []).map((b, oi) => ({ b, oi }))
    .filter(x => !isRec || blockOnDay(x.b, dowOfKey(date)));
  const blocks = vis.map(x => x.b);
  const total = blocks.reduce((a, b) => a + b.minutes, 0);
  const win = src.window || null;
  const winDate = kind === "plan" ? src.date : (date || dateKey(new Date()));
  const back = () => { if (backGroupId) openSectionModal(backGroupId); else closeModal(); };

  /* with a time window we reuse the window scheduler (clock times + breaks) */
  const sched = win ? buildSchedule({ blocks, window: { date: winDate, ...win } }) : null;
  const itemOf = sched ? new Map(sched.items.map(it => [it.b, it])) : null;

  let t = 0;
  const rows = blocks.map((b, i) => {
    const r = { b, i, from: t, to: t + b.minutes };
    t += b.minutes;
    return r;
  });
  const fmtOff = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
  const span = r => {
    if (!sched) return `${fmtOff(r.from)} – ${fmtOff(r.to)}`;
    const it = itemOf.get(r.b);
    return `${fmtClock(it.start)} – ${fmtClock(it.end)}`;
  };

  let segs, axis, statusHtml = "";
  if (sched) {
    const spanMs = Math.max(sched.endMs - sched.startMs, sched.finish - sched.startMs, 1);
    const pct = ms => (ms / spanMs) * 100;
    segs = sched.items.map(it => {
      const late = it.end > sched.endMs ? " late" : "";
      const tip = `${it.b.topic || "Block"} · ${fmtClock(it.start)}–${fmtClock(it.end)}`;
      return `<i class="ov-seg${late}" style="flex:0 0 ${pct(it.end - it.start)}%;background-color:${ovColor(it.i)}" title="${esc(tip)}"></i>`
           + (it.brk ? `<i class="ov-seg brk" style="flex:0 0 ${pct(it.brk)}%" title="Break · ${fmtDur(it.brk / 60000)}"></i>` : "");
    }).join("");
    const endLine = spanMs > sched.endMs - sched.startMs
      ? `<span class="ov-endline" style="left:${pct(sched.endMs - sched.startMs)}%" title="Window ends ${fmtClock(sched.endMs)}"></span>` : "";
    segs += endLine;
    axis = `<span>${fmtClock(sched.startMs)}</span><span>${fmtClock(sched.startMs + spanMs)}</span>`;

    const winMin = (sched.endMs - sched.startMs) / 60000;
    const breakMin = sched.items.reduce((a, it) => a + it.brk, 0) / 60000;
    const spare = (sched.endMs - sched.finish) / 60000;
    let cls, status;
    if (!blocks.length)  { cls = "";      status = "No blocks"; }
    else if (spare < 0)  { cls = "over";  status = `Doesn't fit — over by ${fmtDur(-spare)}`; }
    else if (spare < 30) { cls = "tight"; status = `Tight — only ${fmtDur(spare)} of spare time`; }
    else                 { cls = "ok";    status = `Fits with ${fmtDur(spare)} spare`; }
    statusHtml = `
      <div class="window-preview ${cls}">
        <div class="wp-row"><span>Window</span><b>${fmtDur(winMin)}</b></div>
        <div class="wp-row"><span>Work</span><b>${total ? fmtDur(total) : "—"}</b></div>
        ${breakMin > 0 ? `<div class="wp-row"><span>Breaks</span><b>+${fmtDur(breakMin)}</b></div>` : ""}
        <div class="wp-row"><span>Planned finish</span><b>${blocks.length ? fmtClock(sched.finish) : "—"}</b></div>
        <div class="wp-row wp-status ${cls}">${esc(status)}</div>
      </div>`;
  } else {
    segs = rows.map(r =>
      `<i class="ov-seg" style="flex:0 0 ${total ? (r.b.minutes / total) * 100 : 0}%;background-color:${ovColor(r.i)}"
          title="${esc((r.b.topic || "Block") + " · " + r.b.minutes + "m")}"></i>`).join("");
    axis = `<span>0:00</span><span>${fmtOff(total)}</span>`;
    statusHtml = `
      <div class="window-preview ${blocks.length ? "ok" : ""}">
        <div class="wp-row"><span>Blocks</span><b>${blocks.length}</b></div>
        <div class="wp-row"><span>Total study time</span><b>${total ? fmtDur(total) : "—"}</b></div>
      </div>`;
  }

  const list = rows.map(r => {
    const it = itemOf && itemOf.get(r.b);
    const late = sched && it.end > sched.endMs;
    return `
    <div class="ov-group" data-bi="${r.i}">
      <div class="ov-row">
        <span class="ov-dot" style="background:${ovColor(r.i)}"></span>
        <div class="ov-info">
          <div class="ov-name">${r.i + 1}. ${esc(r.b.topic || "Block")}${kind === "template" && !isRec ? blockChipDays(r.b) : ""}</div>
          <div class="ov-sub${late ? " late" : ""}">${span(r)} · ${r.b.minutes}m${late ? " · past the window" : ""}${it && it.brk && r.i < rows.length - 1 ? ` · then ${fmtDur(it.brk / 60000)} break` : ""}</div>
        </div>
        <div class="ov-move">
          <button class="icon-btn sm" data-act="ovi-up" title="Study earlier" aria-label="Study earlier" ${r.i === 0 ? "disabled" : ""}>▲</button>
          <button class="icon-btn sm" data-act="ovi-down" title="Study later" aria-label="Study later" ${r.i === rows.length - 1 ? "disabled" : ""}>▼</button>
        </div>
      </div>
    </div>`;
  }).join("");

  const sub = kind === "template"
    ? (isRec ? `Repeats ${esc(daysLabel(src.days))} · ${esc(date)}` : (src.days && src.days.length ? `Repeats ${esc(daysLabel(src.days))}` : "Template"))
    : `Planned for ${esc(src.date)}`;
  const winLabel = win ? ` · 🕒 ${esc(win.start)} – ${esc(win.end)}` : "";

  openModal("Overview & study order", `
    <div class="ov-top">
      <div class="ov-title">${esc(src.title)}</div>
      <div class="ov-when">${sub}${winLabel}</div>
    </div>

    <div class="ov-tl" role="img" aria-label="Timeline of the blocks">${segs}</div>
    <div class="ov-axis">${axis}</div>

    ${statusHtml}

    <div class="ov-head">
      <h3>Study order</h3>
      <span>${blocks.length} block${blocks.length !== 1 ? "s" : ""} · ▲▼ to move</span>
    </div>
    ${list || `<div class="tpl-empty">No blocks yet.</div>`}
    ${isRec ? `<p class="hint" style="margin-top:10px">This is a repeating template, so reordering changes every day it repeats.</p>` : ""}

    <div class="backup-row" style="margin:14px 0 0">
      ${kind === "template" ? `<button class="btn" data-act="ovi-edit">${win ? "Edit window" : "Add time window"}</button>` : ""}
      <button class="btn primary" data-act="ovi-close">Done</button>
    </div>
  `, e => {
    const btn = e.target.closest("[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    if (act === "ovi-close") { back(); return; }
    if (act === "ovi-edit") {
      let gid = backGroupId;
      if (!gid) { const g = state.templateGroups.find(g => g.templates.some(x => x.id === id)); gid = g && g.id; }
      if (gid) openEditTemplateModal(id, gid);
      return;
    }
    const row = btn.closest("[data-bi]");
    if (!row) return;
    const i = +row.dataset.bi;
    const j = act === "ovi-up" ? i - 1 : act === "ovi-down" ? i + 1 : -1;
    if (j < 0 || j >= vis.length) return;
    const a = vis[i].oi, c = vis[j].oi;
    [src.blocks[a], src.blocks[c]] = [src.blocks[c], src.blocks[a]];
    save();
    renderTemplates();
    renderPlan();
    openItemOverview(kind, id, date, backGroupId);
    const g = overlay.querySelector(`[data-bi="${j}"]`);
    if (g) g.classList.add("flash");
  });

  const modalEl = overlay.querySelector(".modal");
  if (modalEl) modalEl.classList.add("wide");
}

/* ---------- PLAN ---------- */
const planSeg   = $("#planSeg");
const planLabel = $("#planLabel");
const planBody  = $("#planBody");
const planCal   = $("#planCal");
const planViewSeg = $("#planViewSeg");
const ckBody    = $("#planChecklist");
const planPrev  = $("#planPrev");
const planNext  = $("#planNext");
const planToday = $("#planToday");

function planAnchorDate() {
  const d = state.ui.planAnchor
    ? new Date(state.ui.planAnchor + "T00:00:00")
    : new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function shiftPlan(dir) {
  const d = planAnchorDate();
  if (state.ui.planRange === "day")        d.setDate(d.getDate() + dir);
  else if (state.ui.planRange === "week")  d.setDate(d.getDate() + 7 * dir);
  else                                     d.setMonth(d.getMonth() + dir);
  state.ui.planAnchor = dateKey(d);
  save();
  renderPlan();
}

/* ----- template time window (time-of-day frame, repeats with the template) ----- */
const copyWindow = w => w ? { start: w.start, end: w.end, breakMinutes: w.breakMinutes || null } : null;

function tplWindowMarkup(w) {
  const on = !!w;
  return `
    <div class="fld" style="margin:0 0 6px">Time window <span class="opt">— optional, fit this template into a time frame</span></div>
    <label class="tw-on"><input type="checkbox" id="twOn" ${on ? "checked" : ""}> Use a time window</label>
    <div id="twFields" ${on ? "" : "hidden"}>
      <div class="two">
        <label class="fld">Start <input id="twStart" type="time" value="${esc(w ? w.start : "07:00")}"></label>
        <label class="fld">End <input id="twEnd" type="time" value="${esc(w ? w.end : "10:00")}"></label>
      </div>
      <label class="fld">Break between blocks (min) <span class="opt">— empty = global setting</span>
        <input id="twBreak" type="number" min="1" max="60" placeholder="Auto" value="${w && w.breakMinutes ? w.breakMinutes : ""}">
      </label>
      <div class="window-preview" id="twPreview"></div>
    </div>`;
}

/* blocksFn returns the template's current blocks (the editor may have unsaved edits) */
function initTplWindow(blocksFn) {
  const on = document.getElementById("twOn");
  if (!on) return;
  const box = document.getElementById("twFields");
  const prev = document.getElementById("twPreview");
  const upd = () => {
    box.hidden = !on.checked;
    if (!on.checked) return;
    const w = readTplWindow();
    const blocks = blocksFn();
    if (!w) { prev.className = "window-preview"; prev.innerHTML = `<div class="wp-row wp-status">Set a start and end time</div>`; return; }
    const sched = buildSchedule({ blocks, window: { date: dateKey(new Date()), ...w } });
    if (!sched) return;
    const winMin = (sched.endMs - sched.startMs) / 60000;
    const spare = (sched.endMs - sched.finish) / 60000;
    let cls, status;
    if (!blocks.length)  { cls = "";      status = "No blocks"; }
    else if (spare < 0)  { cls = "over";  status = `Doesn't fit — over by ${fmtDur(-spare)}`; }
    else if (spare < 30) { cls = "tight"; status = `Tight — only ${fmtDur(spare)} of spare time`; }
    else                 { cls = "ok";    status = `Fits with ${fmtDur(spare)} spare`; }
    prev.className = "window-preview " + cls;
    prev.innerHTML = `
      <div class="wp-row"><span>Window</span><b>${fmtDur(winMin)}</b></div>
      <div class="wp-row"><span>Planned finish</span><b>${blocks.length ? fmtClock(sched.finish) : "—"}</b></div>
      <div class="wp-row wp-status ${cls}">${esc(status)}</div>`;
  };
  ["twOn", "twStart", "twEnd", "twBreak"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("input", upd); el.addEventListener("change", upd);
  });
  const rows = document.getElementById("eBlocks") || document.querySelector(".block-editor");
  const form = document.querySelector(".form-grid");
  if (form) form.addEventListener("input", upd);
  if (form) form.addEventListener("click", () => setTimeout(upd, 0));
  upd();
}

function readTplWindow() {
  const on = document.getElementById("twOn");
  if (!on || !on.checked) return null;
  const start = document.getElementById("twStart").value;
  const end   = document.getElementById("twEnd").value;
  if (!start || !end) return null;
  const b = Math.round(+document.getElementById("twBreak").value);
  return { start, end, breakMinutes: b > 0 ? Math.min(60, b) : null };
}

function planTotal(blocks) {
  return (blocks || []).reduce((a, b) => a + b.minutes, 0);
}

/* ----- recurring days ----- */
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];            // Monday first
const DOW_NAMES = { 0: "Sun", 1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri", 6: "Sat" };

function daysLabel(days) {
  const set = new Set(days || []);
  if (set.size === 7) return "Every day";
  if (set.size === 5 && [1, 2, 3, 4, 5].every(d => set.has(d))) return "Weekdays";
  if (set.size === 2 && set.has(6) && set.has(0)) return "Weekends";
  return DOW_ORDER.filter(d => set.has(d)).map(d => DOW_NAMES[d]).join(" · ");
}

/* ----- per-block days: empty = the block runs on every day the template runs ----- */
function blockOnDay(b, dow) { return !b.days || !b.days.length || b.days.includes(dow); }
function blocksForDay(blocks, dow) { return (blocks || []).filter(b => blockOnDay(b, dow)); }
function dowOfKey(key) { return new Date(key + "T00:00:00").getDay(); }
function cleanDays(days) {
  return Array.isArray(days) ? [...new Set(days.map(Number).filter(n => n >= 0 && n <= 6))] : [];
}
function blockDaysMarkup(days) {
  const set = new Set(days || []);
  return `
    <div class="bd">
      <span class="bd-lbl">Days:</span>
      ${DOW_ORDER.map(d => `<label><input class="be-day" type="checkbox" value="${d}" ${set.has(d) ? "checked" : ""}><span class="bd-d">${DOW_NAMES[d]}</span></label>`).join("")}
      <button class="bd-clear" type="button" data-act="bd-clear" title="Run on every day">All days</button>
    </div>`;
}
function readBlockDays(row) {
  return [...row.querySelectorAll(".be-day:checked")].map(i => +i.value);
}
function blockChipDays(b) {
  return (b.days && b.days.length ? `<span class="chip-days">${esc(daysLabel(b.days))}</span>` : "")
       + (b.taskId ? `<span class="chip-days" title="Linked to a checklist task">☑</span>` : "")
       + (isChoice(b) ? `<span class="chip-days" title="Pick one of ${b.options.length} when it starts">⇄ pick 1 of ${b.options.length}</span>` : "");
}

function dayPickerMarkup(days) {
  const set = new Set(days || []);
  return `
    <div class="dp" id="dayPicker">
      ${DOW_ORDER.map(d => `
        <label><input type="checkbox" value="${d}" ${set.has(d) ? "checked" : ""}><span>${DOW_NAMES[d]}</span></label>
      `).join("")}
    </div>
    <div class="dp-presets" id="dayPresets">
      <button class="btn sm" type="button" data-preset="weekdays">Weekdays</button>
      <button class="btn sm" type="button" data-preset="weekends">Weekends</button>
      <button class="btn sm" type="button" data-preset="all">Every day</button>
      <button class="btn sm" type="button" data-preset="none">Clear</button>
    </div>`;
}

function initDayPicker() {
  const presets = document.getElementById("dayPresets");
  const picker  = document.getElementById("dayPicker");
  if (!presets || !picker) return;
  const sets = { weekdays: [1, 2, 3, 4, 5], weekends: [6, 0], all: [0, 1, 2, 3, 4, 5, 6], none: [] };
  presets.addEventListener("click", e => {
    const b = e.target.closest("[data-preset]");
    if (!b) return;
    const on = new Set(sets[b.dataset.preset] || []);
    picker.querySelectorAll("input").forEach(i => { i.checked = on.has(+i.value); });
  });
}

function readDays() {
  const picker = document.getElementById("dayPicker");
  if (!picker) return [];
  return [...picker.querySelectorAll("input:checked")].map(i => +i.value);
}

const recKey = (tplId, date) => `${tplId}|${date}`;

function isRecurringOn(t, key, dow) {
  return Array.isArray(t.days) && t.days.includes(dow) && (!t.daysSince || key >= t.daysSince);
}

/* Everything planned for a day: weekly template occurrences + one-off plan items */
function planItemsFor(d, includeSkipped) {
  const key = dateKey(d), dow = d.getDay();
  const out = [];

  state.templateGroups.forEach(g => g.templates.forEach(t => {
    if (!isRecurringOn(t, key, dow)) return;
    const log = state.recurLog[recKey(t.id, key)] || {};
    if (log.skipped && !includeSkipped) return;
    const dayBlocks = blocksForDay(t.blocks, dow);
    if (t.blocks.length && !dayBlocks.length) return;   // no block runs on this weekday
    out.push({
      kind: "rec", id: t.id, date: key, title: t.title, blocks: dayBlocks,
      resources: t.resources || [], done: !!log.done, skipped: !!log.skipped,
      sessionId: log.sessionId || null, window: t.window || null, tplId: t.id
    });
  }));

  state.plans
    .filter(p => p.date === key)
    .sort((a, b) => a.created - b.created)
    .forEach(p => out.push({
      kind: "plan", id: p.id, date: key, title: p.title, blocks: p.blocks,
      resources: p.resources || [], done: !!p.done, skipped: false,
      sessionId: p.sessionId || null, window: p.window || null, tplId: p.tplId || null
    }));

  return out;
}

function renderPlanItem(it) {
  const sess  = it.sessionId ? getSession(it.sessionId) : null;
  const total = planTotal(it.blocks);
  const doneB = sess ? sess.blocks.filter(b => b.done).length : 0;
  const pct   = sess && sess.blocks.length ? Math.round(doneB / sess.blocks.length * 100) : 0;

  return `
    <div class="plan-card ${it.done ? "done" : ""} ${it.kind === "rec" ? "rec" : ""}"
         data-kind="${it.kind}" data-id="${it.id}" data-date="${it.date}">
      <div class="plan-item">
        <input type="checkbox" data-act="toggle" ${it.done ? "checked" : ""}>
        <span class="plan-title">${it.kind === "rec" ? `<span class="rec-mark" title="Repeats weekly">↻</span>` : ""}${esc(it.title)}</span>
        <span class="plan-meta">${it.window ? `<span class="tw-badge" title="Time window">🕒 ${esc(it.window.start)}–${esc(it.window.end)}</span> ` : ""}${it.blocks.length}b · ${total}m</span>
        <button class="btn sm" data-act="start">Start</button>
        <button class="icon-btn sm" data-act="overview" title="Overview &amp; study order">${ICON_TIMELINE}</button>
        <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
        <button class="icon-btn sm" data-act="del" title="${it.kind === "rec" ? "Skip this day" : "Remove"}">✕</button>
      </div>
      <div class="plan-blocks">
        ${it.blocks.map((b, i) => `
          <span class="chip static ${sess && sess.blocks[i] && sess.blocks[i].done ? "done" : ""}">${esc(b.topic || "Block")} · ${b.minutes}m</span>
        `).join("")}
      </div>
      ${sess && pct > 0 ? `<div class="plan-prog" title="${doneB}/${sess.blocks.length} blocks done"><i style="width:${pct}%"></i></div>` : ""}
    </div>`;
}

function renderPlanDay(d) {
  const key = dateKey(d);
  const todayKey = dateKey(new Date());
  const all = planItemsFor(d, true);
  const items = all.filter(i => !i.skipped);
  const skipped = all.filter(i => i.skipped);
  const mins = items.reduce((a, i) => a + planTotal(i.blocks), 0);
  const doneN = items.filter(i => i.done).length;

  return `
    <div class="plan-day ${key === todayKey ? "today" : ""}">
      <div class="plan-day-head">
        <b>${d.toLocaleDateString(undefined, { weekday: "long" })}</b>
        <span>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
        ${items.length ? `<span class="plan-day-sum">${doneN}/${items.length} done · ${fmtDur(mins)}</span>` : ""}
      </div>
      <div class="plan-day-list">
        ${items.length ? items.map(renderPlanItem).join("") : `<div class="plan-empty">Nothing planned</div>`}
        ${skipped.map(i => `
          <div class="plan-skipped">↻ ${esc(i.title)} skipped
            <button data-restore="${i.id}" data-date="${key}">Restore</button>
          </div>`).join("")}
        <button class="plan-add" data-add="${key}">+ Add to ${d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" })}</button>
      </div>
    </div>`;
}

function renderWeekStrip(anchor, range) {
  const start = startOfWeek(anchor);
  const todayKey = dateKey(new Date());
  const selKey = dateKey(anchor);
  return `<div class="week-strip">${
    Array.from({ length: 7 }, (_, i) => {
      const d = addDays(start, i), key = dateKey(d);
      const items = planItemsFor(d);
      const mins = items.reduce((a, it) => a + planTotal(it.blocks), 0);
      const doneN = items.filter(it => it.done).length;
      return `
        <button class="ws-day ${key === todayKey ? "today" : ""} ${range === "day" && key === selKey ? "sel" : ""}" data-strip="${key}">
          <span class="ws-dow">${d.toLocaleDateString(undefined, { weekday: "short" })}</span>
          <span class="ws-num">${d.getDate()}</span>
          <span class="ws-meta">${items.length ? `${doneN}/${items.length} · ${fmtDur(mins)}` : "—"}</span>
        </button>`;
    }).join("")
  }</div>`;
}

function renderMonthGrid(anchor) {
  const year = anchor.getFullYear();
  const month = anchor.getMonth();
  const first = new Date(year, month, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) {
    cells.push({ d: new Date(year, month - 1, prevMonthDays - i), out: true });
  }
  for (let i = 1; i <= daysInMonth; i++) {
    cells.push({ d: new Date(year, month, i), out: false });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].d;
    cells.push({ d: addDays(last, 1), out: true });
  }

  const todayKey = dateKey(new Date());

  return `
    <div class="plan-cal">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="cal-h">${d}</div>`).join("")}
      ${cells.map(c => {
        const key = dateKey(c.d);
        const items = planItemsFor(c.d);
        return `<div class="cal-cell ${c.out ? "out" : ""} ${key === todayKey ? "today" : ""}" data-day="${key}">
          <div class="cal-num">${c.d.getDate()}</div>
          ${items.slice(0, 3).map(p => `<div class="cal-item ${p.kind === "rec" ? "rec" : ""} ${p.done ? "done" : ""}">${esc(p.title)}</div>`).join("")}
          ${items.length > 3 ? `<div style="font-size:10px;color:var(--muted)">+${items.length - 3} more</div>` : ""}
        </div>`;
      }).join("")}
    </div>`;
}

function applyPlanView() {
  const v = state.ui.planView;
  [...planViewSeg.children].forEach(b => b.classList.toggle("on", b.dataset.view === v));
  const open = state.checklist.reduce((a, g) => a + g.tasks.filter(t => !t.done).length, 0);
  planViewSeg.querySelector('[data-view="checklist"]').textContent = open ? `Checklist · ${open}` : "Checklist";
  planCal.hidden = v !== "calendar";
  ckBody.hidden  = v !== "checklist";
  planSeg.hidden = v !== "calendar";
}

planViewSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b || state.ui.planView === b.dataset.view) return;
  state.ui.planView = b.dataset.view;
  save(); renderPlan();
});

function renderPlan() {
  applyPlanView();
  if (state.ui.planView === "checklist") { renderChecklist(); return; }
  const range = state.ui.planRange;
  [...planSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));

  const anchor = planAnchorDate();
  let label = "";

  if (range === "day") {
    label = anchor.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
  } else if (range === "week") {
    const start = startOfWeek(anchor);
    const end = addDays(start, 6);
    label = `${start.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${end.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
  } else {
    label = anchor.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  planLabel.textContent = label;

  let html = "";
  if (range === "day") {
    html = renderWeekStrip(anchor, "day") + renderPlanDay(anchor);
  } else if (range === "week") {
    const start = startOfWeek(anchor);
    html = renderWeekStrip(anchor, "week");
    for (let i = 0; i < 7; i++) html += renderPlanDay(addDays(start, i));
  } else {
    html = renderMonthGrid(anchor);
  }

  planBody.innerHTML = html;
}

planSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");
  if (!b) return;
  state.ui.planRange = b.dataset.range;
  save();
  renderPlan();
});

planPrev.addEventListener("click", () => shiftPlan(-1));
planNext.addEventListener("click", () => shiftPlan(1));
planToday.addEventListener("click", () => {
  state.ui.planAnchor = dateKey(new Date());
  save();
  renderPlan();
});

function recEntry(tplId, date) {
  const k = recKey(tplId, date);
  if (!state.recurLog[k]) state.recurLog[k] = {};
  return state.recurLog[k];
}

planBody.addEventListener("click", e => {
  const addBtn = e.target.closest("[data-add]");
  if (addBtn) { openPlanAddModal(addBtn.dataset.add); return; }

  const strip = e.target.closest("[data-strip]");
  if (strip) {
    state.ui.planAnchor = strip.dataset.strip;
    state.ui.planRange = "day";
    save();
    renderPlan();
    return;
  }

  const restore = e.target.closest("[data-restore]");
  if (restore) {
    const ent = recEntry(restore.dataset.restore, restore.dataset.date);
    delete ent.skipped;
    save(); renderPlan();
    return;
  }

  const cell = e.target.closest("[data-day]");
  if (cell) {
    state.ui.planAnchor = cell.dataset.day;
    state.ui.planRange = "day";
    save();
    renderPlan();
    return;
  }

  const card = e.target.closest(".plan-card");
  if (!card) return;
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const { kind, id, date } = card.dataset;
  const action = act.dataset.act;

  if (action === "toggle") {
    if (kind === "rec") {
      const ent = recEntry(id, date);
      ent.done = !ent.done;
    } else {
      const p = state.plans.find(x => x.id === id);
      if (p) p.done = !p.done;
    }
    save(); renderPlan();
  } else if (action === "del") {
    if (kind === "rec") {
      recEntry(id, date).skipped = true;
      toast("Skipped for this day. Change repeat days in the template.");
    } else {
      state.plans = state.plans.filter(x => x.id !== id);
    }
    save(); renderPlan();
  } else if (action === "start") {
    if (kind === "rec") startRecItem(id, date);
    else startPlanItem(id);
  } else if (action === "res") {
    openAttachModal(kind === "rec" ? "template" : "plan", id);
  } else if (action === "overview") {
    openItemOverview(kind === "rec" ? "template" : "plan", id, date);
  }
});

function startRecItem(tplId, date) {
  const t = findTemplate(tplId);
  if (!t) return;
  const ent = recEntry(tplId, date);

  let s = ent.sessionId ? getSession(ent.sessionId) : null;
  if (!s) {
    s = {
      id: uid(),
      title: t.title,
      blocks: blocksForDay(t.blocks, dowOfKey(date)).map(b => ({ ...cpBlock(b), done: false,
        ...(t.window ? { tpl: t.id, tplTitle: t.title } : {}) })),
      resources: [...(t.resources || [])],
      created: Date.now()
    };
    if (t.window) s.window = { date, start: t.window.start, end: t.window.end,
                               templateIds: [t.id], breakMinutes: t.window.breakMinutes || null };
    state.sessions.push(s);
    ent.sessionId = s.id;
    save();
    renderSessions();
  }

  startSession(s.id);
  setTab("sessions");
}

function startPlanItem(planId) {
  const p = state.plans.find(x => x.id === planId);
  if (!p) return;

  let s = p.sessionId ? getSession(p.sessionId) : null;
  if (!s) {
    s = {
      id: uid(),
      title: p.title,
      blocks: p.blocks.map(b => ({ ...cpBlock(b), done: false,
        ...(p.window ? { tpl: p.tplId || p.id, tplTitle: p.title } : {}) })),
      resources: [...(p.resources || [])],
      created: Date.now()
    };
    if (p.window) s.window = { date: p.date, start: p.window.start, end: p.window.end,
                               templateIds: p.tplId && findTemplate(p.tplId) ? [p.tplId] : [],
                               breakMinutes: p.window.breakMinutes || null };
    state.sessions.push(s);
    p.sessionId = s.id;
    save();
    renderSessions();
  }

  startSession(s.id);
  setTab("sessions");
}

function openPlanAddModal(dateStr) {
  const sessions = state.sessions;
  const allTemplates = state.templateGroups.flatMap(g =>
    g.templates.map(t => ({ t, groupName: g.name }))
  );

  const nothing = !sessions.length && !allTemplates.length;

  openModal("Add to plan", `
    <label class="fld">Date
      <input id="plDate" type="date" value="${esc(dateStr)}">
    </label>
    <div class="fld" style="margin-bottom:6px">Pick a session or template</div>
    <div class="pick-list" style="max-height:300px" id="planPickWrap">
      ${nothing ? `<div class="pick-empty">Nothing to add. Create a session or template first.</div>` : ""}
      ${sessions.map(s => `
        <div class="pick" data-pick="session" data-id="${s.id}">
          <span class="pick-name">${esc(s.title)}</span>
          <span class="pick-url">${s.blocks.length}b · ${planTotal(s.blocks)}m</span>
        </div>`).join("")}
      ${allTemplates.map(({ t, groupName }) => `
        <div class="pick" data-pick="template" data-id="${t.id}">
          <span class="pick-name">${esc(t.title)}
            <span style="color:var(--muted);font-size:11px">· ${esc(groupName)}</span>
          </span>
          <span class="pick-url">${t.blocks.length}b · ${planTotal(t.blocks)}m</span>
        </div>`).join("")}
    </div>
  `, e => {
    const el = e.target.closest("[data-pick]");
    if (!el) return;
    const date = (document.getElementById("plDate") || {}).value || dateStr;
    addPlanFromSource(el.dataset.pick, el.dataset.id, date);
    closeModal();
    renderPlan();
    toast("Added to plan");
  });
}

function addPlanFromSource(kind, id, dateStr) {
  let title, blocks, resources, win = null, tplId = null;
  if (kind === "session") {
    const s = getSession(id); if (!s) return;
    title = s.title;
    blocks = s.blocks.map(b => cpBlock(b));
    resources = [...(s.resources || [])];
  } else {
    const t = findTemplate(id); if (!t) return;
    title = t.title;
    const dayBlocks = blocksForDay(t.blocks, dowOfKey(dateStr));
    blocks = (dayBlocks.length ? dayBlocks : t.blocks).map(b => cpBlock(b));
    resources = [...(t.resources || [])];
    win = copyWindow(t.window);
    tplId = t.id;
  }

  state.plans.push({
    id: uid(),
    date: dateStr,
    title,
    blocks: blocks.map(b => ({ ...b, done: false })),
    resources,
    window: win,
    tplId,
    done: false,
    created: Date.now()
  });
  save();
}

/* ---------- TEMPLATES ---------- */
const templateList = $("#templateList");

function sectionStats(g) {
  const tpls = g.templates || [];
  return {
    count:  tpls.length,
    blocks: tpls.reduce((a, t) => a + (t.blocks ? t.blocks.length : 0), 0),
    mins:   tpls.reduce((a, t) => a + planTotal(t.blocks), 0)
  };
}

function renderTemplateCard(t, groupId) {
  const total = t.blocks.length;
  const mins  = planTotal(t.blocks);
  const MAX   = 8;
  const shown = t.blocks.slice(0, MAX);
  const extra = total - shown.length;

  return `
    <div class="session tpl-card" data-tpl="${t.id}" data-group="${groupId}">
      <div>
        <div class="session-title">${esc(t.title)}</div>
        <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min total${(t.days && t.days.length) ? `<span class="rec-badge" title="Repeats weekly">↻ ${esc(daysLabel(t.days))}</span>` : ""}${t.window ? `<span class="rec-badge tw-badge" title="Time window">🕒 ${esc(t.window.start)}–${esc(t.window.end)}</span>` : ""}</div>
      </div>
      <div class="blocks" style="margin-top:11px">
        ${shown.map(b => `
          <span class="chip static">${esc(b.topic || "Block")} · ${b.minutes}m${blockChipDays(b)}</span>
        `).join("")}
        ${extra > 0 ? `<span class="chip static more" title="${esc(t.blocks.slice(MAX).map(b => (b.topic || "Block") + " · " + b.minutes + "m" + (b.days && b.days.length ? " (" + daysLabel(b.days) + ")" : "")).join(", "))}">+${extra} more</span>` : ""}
      </div>
      ${resChipsMarkup(t.resources)}
      <div class="session-actions">
        <button class="btn primary" data-act="use">Create session</button>
        <button class="btn" data-act="schedule" title="Add this template to your plan on a chosen date">Add to plan</button>
        <button class="icon-btn sm" data-act="overview" title="Overview &amp; study order">${ICON_TIMELINE}</button>
        <button class="icon-btn sm" data-act="edit" title="Edit template">✎</button>
        <button class="icon-btn sm" data-act="res" title="Resources">${ICON_LINK}</button>
        <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
      </div>
    </div>`;
}

function renderTemplates() {
  if (!state.templateGroups.length) {
    templateList.innerHTML =
      `<div class="empty">No sections yet.<br>Create a <b>section</b> to organise your templates.</div>`;
    return;
  }

  templateList.innerHTML = `<div class="section-grid">${
    state.templateGroups.map(g => {
      const st = sectionStats(g);

      return `
      <div class="section-card" data-group="${g.id}">
        <div class="section-card-top">
          <span class="section-icon">${ICON_SECTION}</span>
          <span class="section-card-actions">
            <button class="icon-btn sm" data-act="rename-group" title="Rename section">✎</button>
            <button class="icon-btn sm" data-act="del-group" title="Delete section">✕</button>
          </span>
        </div>
        <div class="section-info">
          <div class="section-name">${esc(g.name)}</div>
          <div class="section-meta">${st.count} template${st.count !== 1 ? "s" : ""} · ${st.blocks} block${st.blocks !== 1 ? "s" : ""} · ${st.mins} min</div>
        </div>
        <div class="section-card-foot">
          <button class="btn sm" data-act="add-tpl">+ Template</button>
          <button class="btn sm primary" data-act="open">Open</button>
        </div>
      </div>`;
    }).join("")
  }</div>`;
}

function openSectionModal(groupId) {
  const group = state.templateGroups.find(g => g.id === groupId);
  if (!group) return;

  const st = sectionStats(group);
  const list = group.templates.length
    ? group.templates.map(t => renderTemplateCard(t, group.id)).join("")
    : `<div class="tpl-empty">No templates in this section yet.</div>`;

  openModal(group.name, `
    <div class="tpl-toolbar">
      <p class="hint">
        ${st.count} template${st.count !== 1 ? "s" : ""} ·
        ${st.blocks} block${st.blocks !== 1 ? "s" : ""} ·
        ${fmtDur(st.mins)} total
      </p>
      <button class="btn primary sm" data-act="add-tpl">+ New template</button>
    </div>
    <div id="sectionTplList" class="tpl-grid">${list}</div>
  `, e => {
    const actEl = e.target.closest("[data-act]");
    if (!actEl) return;
    const act = actEl.dataset.act;

    if (act === "add-tpl") { openCreateModal("template", groupId); return; }

    const tplEl = e.target.closest("[data-tpl]");
    if (!tplEl) return;
    const tplId = tplEl.dataset.tpl;
    const tpl   = findTemplate(tplId);
    if (!tpl) return;

    if (act === "use") {
      const session = {
        id: uid(),
        title: tpl.title,
        blocks: tpl.blocks.map(b => ({ ...cpBlock(b), done: false })),
        resources: [...(tpl.resources || [])],
        created: Date.now()
      };
      state.sessions.push(session);
      save();
      renderSessions();
      closeModal();
      setTab("sessions");
      toast(`Session "${session.title}" created`);
    } else if (act === "schedule") {
      openScheduleModal(tplId);
    } else if (act === "overview") {
      openItemOverview("template", tplId, null, group.id);
    } else if (act === "edit") {
      openEditTemplateModal(tplId, group.id);
    } else if (act === "res") {
      openAttachModal("template", tplId);
    } else if (act === "del") {
      if (!confirm(`Delete template "${tpl.title}"?`)) return;
      group.templates = group.templates.filter(x => x.id !== tplId);
      save();
      renderTemplates();
      openSectionModal(groupId);
      toast("Template deleted");
    }
  });

  const mEl = overlay.querySelector(".modal");
  if (mEl) mEl.classList.add("xwide");

  openSectionId = groupId;
}

function openScheduleModal(tplId) {
  const tpl = findTemplate(tplId);
  if (!tpl) return;

  const total = tpl.blocks.reduce((a, b) => a + b.minutes, 0);
  const hasBlockDays = tpl.blocks.some(b => b.days && b.days.length);

  openModal("Add template to plan", `
    <p class="hint">
      Add <b>${esc(tpl.title)}</b> to your plan. It will show up as a
      scheduled item you can start with one click.
    </p>
    <div class="window-preview" style="margin-top:0">
      <div class="wp-row"><span>Blocks</span><b>${tpl.blocks.length}</b></div>
      <div class="wp-row"><span>Total time</span><b>${fmtDur(total)}</b></div>
    </div>
    <label class="fld">Date
      <input id="schedDate" type="date" value="${dateKey(new Date())}">
    </label>
    ${hasBlockDays ? `<p class="hint">Some blocks only run on certain days — only the blocks for the chosen weekday are added.</p>` : ""}
    <button class="btn primary wide" id="schedGo">Add to plan</button>
  `);

  document.getElementById("schedGo").addEventListener("click", () => {
    const date = document.getElementById("schedDate").value || dateKey(new Date());
    const dayBlocks = blocksForDay(tpl.blocks, dowOfKey(date));
    if (!dayBlocks.length) { toast("No blocks in this template run on that weekday"); return; }

    state.plans.push({
      id: uid(),
      date,
      title: tpl.title,
      blocks: dayBlocks.map(b => ({ ...cpBlock(b), done: false })),
      resources: [...(tpl.resources || [])],
      window: copyWindow(tpl.window),
      tplId: tpl.id,
      done: false,
      created: Date.now()
    });
    save();
    closeModal();
    setTab("plan");
    toast(`Scheduled for ${date}`);
  });
}

      <button class="btn primary wide" id="eSave">Save changes</button>

  initDayPicker();
  initTplWindow(() => [...document.querySelectorAll("#eBlocks .block-row")].map(r => ({
    topic: r.querySelector(".be-topic").value.trim(),

  })));

  const $blocks = document.getElementById("eBlocks");

  const addBlockRow = () => {
    const row = document.createElement("div");
    row.className = "block-row";
    row.innerHTML = `
      <input class="be-topic" placeholder="Topic" autocomplete="off">
      <input class="be-mins" type="number" min="1" max="300" value="${state.settings.focus}">
      <button class="icon-btn sm" type="button" data-act="rm-block" title="Remove">✕</button>
      ${blockDaysMarkup([])}
      <div class="b-actions">
        ${blockLinkMarkup(null)}
        <div class="bc">${bcInner(null)}</div>
      </div>`;
    $blocks.appendChild(row);
    $blocks.scrollTop = $blocks.scrollHeight;
    row.querySelector(".be-topic").focus();
  };

  $blocks.addEventListener("keydown", e => {
    const inp = e.target.closest && e.target.closest(".bo-topic");
    if (!inp || e.key !== "Enter") return;
    e.preventDefault();
    const row = inp.closest(".block-row"), all = [...row.querySelectorAll(".bo-topic")], k = all.indexOf(inp);
    if (k < all.length - 1) all[k + 1].focus();
    else if (inp.value.trim()) bcRender(row, [...bcReadRaw(row), { topic: "" }], true);
  });
  $blocks.addEventListener("paste", e => {
    const inp = e.target.closest && e.target.closest(".bo-topic");
    if (!inp) return;
    const lines = ((e.clipboardData || window.clipboardData).getData("text") || "")
      .split(/\r?\n/).map(x => x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, "").trim()).filter(Boolean);
    if (lines.length < 2) return;
    e.preventDefault();
    const row = inp.closest(".block-row"), raw = bcReadRaw(row), k = [...row.querySelectorAll(".bo-topic")].indexOf(inp);
    raw.splice(k, 1, ...lines.map(t => ({ topic: t })));
    bcRender(row, raw, false);
  });

  $blocks.addEventListener("input", e => {
    const inp = e.target.closest(".bo-topic");
    if (!inp) return;
    const o = inp.closest(".bc-opt");
    if (o.dataset.taskId) { delete o.dataset.taskId; const l = o.querySelector(".bc-link"); if (l) l.remove(); }
    bcSyncLabel(inp.closest(".block-row"));
  });

  $blocks.addEventListener("click", e => {
    if (bcHandleClick(e, $blocks)) return;
    const pick = e.target.closest("[data-act='bt-pick']");
    if (pick) { toggleTaskPicker(pick.closest(".block-row")); return; }
    const item = e.target.closest("[data-act='bt-item']");
    if (item) {
      const row = item.closest(".block-row"), t = findTask(item.dataset.task);
      if (t) { row.querySelector(".be-topic").value = t.title; row.dataset.taskId = t.id; refreshRowLink(row); }
      row.querySelector(".bt-list").hidden = true;
      return;
    }
    const unl = e.target.closest("[data-act='bt-unlink']");
    if (unl) { const row = unl.closest(".block-row"); delete row.dataset.taskId; refreshRowLink(row); return; }
    const clr = e.target.closest("[data-act='bd-clear']");
    if (clr) { clr.closest(".block-row").querySelectorAll(".be-day").forEach(i => { i.checked = false; }); return; }
    const rm = e.target.closest("[data-act='rm-block']");
    if (!rm) return;
    if ($blocks.querySelectorAll(".block-row").length <= 1) {
      toast("Keep at least one block");
      return;
    }
    rm.closest(".block-row").remove();
  });

  document.getElementById("eAddBlock").addEventListener("click", addBlockRow);

  document.getElementById("eSave").addEventListener("click", () => {
    const title  = $title.value.trim() || "Untitled template";
    const newGid = document.getElementById("eGroup").value;
    const resources = getPicked();

    const blocks = [...$blocks.querySelectorAll(".block-row")].map(r => {
      const minutes = Math.max(1, Math.min(300, +r.querySelector(".be-mins").value || 25));
      const days = readBlockDays(r);
      const opts = r.classList.contains("is-choice") ? bcRead(r) : [];
      if (opts.length > 1) return { topic: choiceLabel(opts), minutes, days, options: opts };
      if (opts.length === 1) return { topic: opts[0].topic, minutes, days, ...(opts[0].taskId ? { taskId: opts[0].taskId } : {}) };
      return {
        topic: r.classList.contains("is-choice") ? "" : r.querySelector(".be-topic").value.trim(),
        minutes, days,
        ...(r.dataset.taskId && !r.classList.contains("is-choice") ? { taskId: r.dataset.taskId } : {})
      };
    });

    if (!blocks.length) { toast("Add at least one block"); return; }

    tpl.title     = title;
    tpl.blocks    = blocks;
    tpl.resources = resources;
    tpl.window    = readTplWindow();

    const newDays = readDays();
    const oldKey = [...(tpl.days || [])].sort().join(",");
    if (newDays.slice().sort().join(",") !== oldKey) {
      tpl.days = newDays;
      tpl.daysSince = newDays.length ? dateKey(new Date()) : "";
    }

    if (newGid !== groupId) {
      const from = state.templateGroups.find(g => g.id === groupId);
      const to   = state.templateGroups.find(g => g.id === newGid);
      if (from && to) {
        from.templates = from.templates.filter(x => x.id !== tplId);
        to.templates.push(tpl);
      }
    }

    save();
    closeModal();
    renderTemplates();
    renderPlan();
    openSectionModal(newGid);
    toast("Template updated");
  });
}

/* ---------- DASHBOARD ---------- */
const dashBody = $("#dashBody");
const dashSeg  = $("#dashSeg");

function startOfToday() {
  const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
}
function dayKey(t) {
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtDur(mins) {
  const m = Math.round(mins);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}

function rangeBounds(range) {
  const t0 = startOfToday();
  if (range === "day")   return [t0, t0 + DAY];
  if (range === "week")  return [t0 - 6 * DAY, t0 + DAY];
  if (range === "month") return [t0 - 29 * DAY, t0 + DAY];
  return [0, Infinity];
}

function buildBuckets(range) {
  const t0 = startOfToday();
  const out = [];

  if (range === "day") {
    for (let h = 0; h < 24; h++) {
      const s = t0 + h * 3600000;
      out.push({
        start: s, end: s + 3600000,
        label: h % 3 === 0 ? String(h).padStart(2, "0") : "",
        tip: `${String(h).padStart(2, "0")}:00`
      });
    }
  } else if (range === "week") {
    for (let i = 6; i >= 0; i--) {
      const s = t0 - i * DAY, d = new Date(s);
      out.push({
        start: s, end: s + DAY,
        label: d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2),
        tip: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
    }
  } else if (range === "month") {
    for (let i = 29; i >= 0; i--) {
      const s = t0 - i * DAY, d = new Date(s);
      out.push({
        start: s, end: s + DAY,
        label: (i % 5 === 0 || i === 0) ? String(d.getDate()) : "",
        tip: d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
    }
  } else {
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const s = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const e = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
      out.push({
        start: s.getTime(), end: e.getTime(),
        label: s.toLocaleDateString(undefined, { month: "short" }),
        tip: s.toLocaleDateString(undefined, { month: "long", year: "numeric" })
      });
    }
  }
  return out;
}

function computeStreak() {
  const keys = new Set(state.history.map(h => dayKey(h.ts)));
  let streak = 0;
  const cur = new Date(); cur.setHours(0, 0, 0, 0);
  if (!keys.has(dayKey(cur.getTime()))) cur.setDate(cur.getDate() - 1);
  while (keys.has(dayKey(cur.getTime()))) { streak++; cur.setDate(cur.getDate() - 1); }
  return streak;
}

function renderDashboard() {
  const range = state.ui.dashRange;
  [...dashSeg.children].forEach(b => b.classList.toggle("on", b.dataset.range === range));

  if (!state.history.length) {
    dashBody.innerHTML = goalsCardHtml() +
      `<div class="empty">No study data yet.<br>Finish a focus block or log an activity and your stats will appear here.</div>`;
    return;
  }

  const [start, end] = rangeBounds(range);
  const entries = state.history.filter(h => h.ts >= start && h.ts < end);

  const total    = entries.reduce((a, h) => a + h.minutes, 0);
  const blocks   = entries.length;
  const sessions = new Set(entries.map(h => h.sessionId)).size;
  const days     = new Set(entries.map(h => dayKey(h.ts))).size;

  const spanDays = range === "day"   ? 1
                 : range === "week"  ? 7
                 : range === "month" ? 30
                 : Math.max(1, Math.ceil((Date.now() - (state.history[0] ? state.history[0].ts : Date.now())) / DAY));
  const avg = total / spanDays;

  const streak = computeStreak();

  const buckets = buildBuckets(range);
  const values  = buckets.map(b =>
    entries.filter(h => h.ts >= b.start && h.ts < b.end)
           .reduce((a, h) => a + h.minutes, 0));
  const maxV    = Math.max(...values, 1);
  const bestIdx = values.indexOf(Math.max(...values));

  const byS = new Map();
  entries.forEach(h => {
    const k = h.sessionTitle || "Untitled";
    const o = byS.get(k) || { minutes: 0, count: 0 };
    o.minutes += h.minutes; o.count++;
    byS.set(k, o);
  });
  const bySList = [...byS.entries()].sort((a, b) => b[1].minutes - a[1].minutes).slice(0, 8);
  const maxS = bySList.length ? bySList[0][1].minutes : 1;

  const byT = new Map();
  entries.forEach(h => {
    const k = (h.topic || "").trim();
    if (!k) return;
    byT.set(k, (byT.get(k) || 0) + h.minutes);
  });
  const byTList = [...byT.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxT = byTList.length ? byTList[0][1] : 1;

  dashBody.innerHTML = `
    ${goalsCardHtml()}
    <div class="stat-grid">
      <div class="stat"><div class="stat-v">${total > 0 ? fmtDur(total) : "0m"}</div><div class="stat-l">Focus time</div></div>
      <div class="stat"><div class="stat-v">${blocks}</div><div class="stat-l">Blocks</div></div>
      <div class="stat"><div class="stat-v">${sessions}</div><div class="stat-l">Sessions</div></div>
      <div class="stat"><div class="stat-v">${days}</div><div class="stat-l">Active days</div></div>
      <div class="stat"><div class="stat-v">${avg >= 1 ? fmtDur(avg) : "0m"}</div><div class="stat-l">Avg / day</div></div>
      <div class="stat"><div class="stat-v">${streak}d</div><div class="stat-l">Streak</div></div>
    </div>

    <div class="dash-block">
      <div class="dash-head">
        <h3>Activity</h3>
        <span>${total > 0
          ? `Best ${esc(buckets[bestIdx].tip)} · ${fmtDur(values[bestIdx])}`
          : "No activity in this range"}</span>
      </div>
      <div class="chart">
        ${buckets.map((b, i) => {
          const v = values[i];
          const h = v > 0 ? Math.max(3, (v / maxV) * 100) : 0;
          return `<div class="bar-col" title="${esc(b.tip)} · ${fmtDur(v)}">
                    <div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div>
                    <div class="bar-lbl">${esc(b.label)}</div>
                  </div>`;
        }).join("")}
      </div>
    </div>

    <div class="dash-block">
      <div class="dash-head">
        <h3>By session</h3>
        <span>${sessions} session${sessions !== 1 ? "s" : ""}</span>
      </div>
      ${bySList.length ? bySList.map(([name, o]) => `
        <div class="brk-row">
          <div class="brk-name">${esc(name)}</div>
          <div class="brk-val">${fmtDur(o.minutes)} · ${o.count} block${o.count !== 1 ? "s" : ""}</div>
          <div class="brk-bar"><i style="width:${(o.minutes / maxS) * 100}%"></i></div>
        </div>`).join("")
        : `<div class="empty" style="padding:14px">No sessions in this range.</div>`}
    </div>

    ${byTList.length ? `
    <div class="dash-block">
      <div class="dash-head"><h3>By topic</h3><span>top ${byTList.length}</span></div>
      ${byTList.map(([name, m]) => `
        <div class="brk-row">
          <div class="brk-name">${esc(name)}</div>
          <div class="brk-val">${fmtDur(m)}</div>
          <div class="brk-bar"><i style="width:${(m / maxT) * 100}%"></i></div>
        </div>`).join("")}
    </div>` : ""}
  `;
}

dashSeg.addEventListener("click", e => {
  const b = e.target.closest("button[data-range]");
  if (!b) return;
  if (state.ui.dashRange === b.dataset.range) return;
  state.ui.dashRange = b.dataset.range;
  save();
  renderDashboard();
});

/* ---------- PLAN CHECKLIST ---------- */
/* sections -> tasks. A task can become a template block (topic) and is checked off
   automatically when that block is finished in a session. */
/* A copy always starts "undecided": a choice block keeps its alternatives but not the pick. */
const cpBlock = b => isChoice(b)
  ? { topic: choiceLabel(b.options), minutes: b.minutes, options: b.options.map(o => ({ ...o })) }
  : { topic: b.topic, minutes: b.minutes, ...(b.taskId ? { taskId: b.taskId } : {}) };

/* ---------- CHOICE BLOCKS ----------
   A block with options[] (2+) is a "pick one" slot: several tasks are added at once and
   you choose which one to do when the block comes up. Choosing sets topic/taskId, so
   history and checklist auto-complete work exactly like a normal block. */
function cleanOptions(o) {
  if (!Array.isArray(o)) return [];
  return o.filter(x => x && typeof x.topic === "string" && x.topic.trim())
          .map(x => ({ topic: x.topic.trim(), ...(x.taskId ? { taskId: String(x.taskId) } : {}) }));
}
function normBlockOptions(b) {
  if (!b || typeof b !== "object") return;
  const o = cleanOptions(b.options);
  if (o.length > 1) { b.options = o; b.chosen = !!b.chosen; }
  else { delete b.options; delete b.chosen; }
}
function isChoice(b) { return !!b && Array.isArray(b.options) && b.options.length > 1; }
function needsChoice(b) { return isChoice(b) && !b.chosen; }
function choiceLabel(opts) {
  const t = (opts || []).map(o => o.topic).filter(Boolean);
  return t.length ? "Choose: " + t.join(" / ") : "Choose…";
}
function sameOptions(a, b) {
  return Array.isArray(a) && Array.isArray(b) && a.length === b.length &&
         a.every((o, i) => o.topic === b[i].topic);
}
function applyChoice(b, o) {
  b.topic = o.topic;
  if (o.taskId) b.taskId = o.taskId; else delete b.taskId;
  b.chosen = true;
}
function openChoiceModal(sid, i, fromTimer) {
  const s = getSession(sid), b = s && s.blocks[i];
  if (!isChoice(b)) return;
  openModal("Choose what to study", `
    <p class="hint">Block ${i + 1} · ${b.minutes} min — pick one.${fromTimer ? " The timer is paused until you choose." : ""}</p>
    <div class="choice-list">
      ${b.options.map((o, k) => `
        <button class="choice-opt${b.chosen && b.topic === o.topic ? " on" : ""}" type="button" data-k="${k}">
          <span>${esc(o.topic)}</span>${o.taskId ? "<em>☑ checklist task</em>" : ""}
        </button>`).join("")}
    </div>
    <div class="choice-foot">
      <button class="btn sm" type="button" data-rand="1">🎲 Surprise me</button>
      ${b.chosen && !b.done ? `<button class="btn sm" type="button" data-reset="1">Undo my choice</button>` : ""}
    </div>`, e => {
    const pickBtn = e.target.closest("[data-k]");
    const rand = e.target.closest("[data-rand]");
    const reset = e.target.closest("[data-reset]");
    let opt = null;
    if (pickBtn) opt = b.options[+pickBtn.dataset.k];
    else if (rand) opt = b.options[Math.floor(Math.random() * b.options.length)];
    else if (reset) {
      b.chosen = false; b.topic = choiceLabel(b.options); delete b.taskId;
      save(); closeModal(); renderSessions(); updateTimerUI(); return;
    }
    if (!opt) return;
    applyChoice(b, opt);
    save(); closeModal(); renderSessions();
    if (fromTimer && timer.sessionId === sid && timer.blockIndex === i) {
      timer.running = true; timer.lastTick = Date.now(); saveTimer();
    }
    updateTimerUI();
    toast(`Doing: ${opt.topic}`);
  });
}
/* Pauses the timer and asks, when the block that is about to run is still undecided */
function promptChoiceIfNeeded() {
  const s = getSession(timer.sessionId);
  if (!s || timer.finished || timer.phase !== "work") return false;
  const b = s.blocks[timer.blockIndex];
  if (!needsChoice(b)) return false;
  timer.running = false;
  saveTimer(); updateTimerUI();
  openChoiceModal(s.id, timer.blockIndex, true);
  return true;
}

function findTask(id) {
  for (const g of state.checklist) {
    const t = g.tasks.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}
function taskSection(id) { return state.checklist.find(g => g.tasks.some(t => t.id === id)) || null; }

function completeTaskFromBlock(b) {
  if (!b || !b.taskId) return;
  const t = findTask(b.taskId);
  if (!t || t.done) return;
  t.done = true; t.doneAt = Date.now();
  save();
  toast(`Task checked off: ${t.title}`);
  if (state.ui.tab === "plan") renderPlan();
}

function unlinkTasks(ids) {
  const set = new Set(ids);
  state.templateGroups.forEach(g => g.templates.forEach(t => t.blocks.forEach(b => {
    if (b.taskId && set.has(b.taskId)) delete b.taskId;
    if (isChoice(b)) b.options.forEach(o => { if (o.taskId && set.has(o.taskId)) delete o.taskId; });
  })));
}

/* taskId -> titles of templates that use it */
function templateLinks() {
  const m = new Map();
  state.templateGroups.forEach(g => g.templates.forEach(t => t.blocks.forEach(b => {
    [b.taskId, ...(isChoice(b) ? b.options.map(o => o.taskId) : [])].filter(Boolean).forEach(id => {
      const arr = m.get(id) || [];
      if (!arr.includes(t.title)) arr.push(t.title);
      m.set(id, arr);
    });
  })));
  return m;
}

function renderChecklist() {
  const all = state.checklist.flatMap(g => g.tasks);
  const done = all.filter(t => t.done).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  const hide = state.ui.ckHideDone;
  const links = templateLinks();
  const todayK = dateKey(new Date());

  const top = `
    <div class="ck-top">
      <div class="ck-prog">${all.length ? `<b>${done}</b> of <b>${all.length}</b> done · ${pct}%` : "No tasks yet"}
        <div class="ck-bar"><i style="width:${pct}%"></i></div></div>
      <button class="btn sm" data-act="ck-hide">${hide ? "Show completed" : "Hide completed"}</button>
      <button class="btn sm" data-act="ck-io">Import / Export</button>
      <button class="btn primary sm" data-act="ck-newsec">+ Section</button>
    </div>`;

  if (!state.checklist.length) {
    ckBody.innerHTML = top + `<div class="empty">No checklist yet.<br>Create a <b>section</b> (e.g. “Exam prep”, “Admin”) and add the tasks you need to complete,<br>or use <b>Import / Export</b> to load a CSV or JSON file.</div>`;
    return;
  }

  const secs = state.checklist.map(g => {
    const d = g.tasks.filter(t => t.done).length;
    const rows = g.tasks.filter(t => !(hide && t.done)).map(t => {
      const tl = links.get(t.id);
      const dueChip = t.due
        ? `<span class="ck-chip ${!t.done && t.due < todayK ? "over" : (!t.done && t.due === todayK ? "today" : "")}">${!t.done && t.due < todayK ? "Overdue · " : ""}${esc(new Date(t.due + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" }))}</span>` : "";
      const tplChip = tl ? `<span class="ck-chip tpl" title="Topic in: ${esc(tl.join(", "))}">▦ ${esc(tl[0])}${tl.length > 1 ? ` +${tl.length - 1}` : ""}</span>` : "";
      return `
        <div class="ck-row ${t.done ? "done" : ""}" data-t="${esc(t.id)}">
          <input type="checkbox" data-act="ck-toggle" ${t.done ? "checked" : ""} aria-label="Done">
          <div><div class="ck-title">${esc(t.title)}</div><div class="ck-meta">${dueChip}${tplChip}</div></div>
          <button class="icon-btn sm" data-act="ck-tpl" title="Add to a template as a topic" aria-label="Add to a template">▦</button>
          <button class="icon-btn sm" data-act="ck-edit" title="Edit task" aria-label="Edit task">✎</button>
          <button class="icon-btn sm" data-act="ck-del" title="Delete task" aria-label="Delete task">✕</button>
        </div>`;
    }).join("");
    const body = g.collapsed ? "" : `
      <div class="ck-body">
        ${rows || `<div class="empty" style="padding:12px">${g.tasks.length ? "All tasks completed 🎉" : "No tasks in this section yet."}</div>`}
        <div class="ck-addrow">
          <input class="ck-add" data-g="${esc(g.id)}" placeholder="Add a task and press Enter" autocomplete="off">
          <button class="btn sm" data-act="ck-add" data-g="${esc(g.id)}">Add</button>
        </div>
      </div>`;
    return `
      <div class="ck-sec" data-g="${esc(g.id)}">
        <div class="ck-head">
          <button class="ck-fold" data-act="ck-fold" aria-label="Collapse or expand">${g.collapsed ? "▸" : "▾"}</button>
          <span class="ck-name" data-act="ck-fold">${esc(g.name)}</span>
          <span class="ck-count">${d}/${g.tasks.length}</span>
          <button class="icon-btn sm" data-act="ck-sectpl" title="Add this section's open tasks to a template" aria-label="Add open tasks to a template">▦</button>
          <button class="icon-btn sm" data-act="ck-rename" title="Rename section" aria-label="Rename section">✎</button>
          <button class="icon-btn sm" data-act="ck-delsec" title="Delete section" aria-label="Delete section">✕</button>
        </div>
        ${body}
      </div>`;
  }).join("");

  ckBody.innerHTML = top + secs;
}

function ckRefresh(focusGroup) {
  save();
  renderPlan();
  if (state.ui.tab === "templates") renderTemplates();
  if (focusGroup) {
    const i = ckBody.querySelector(`.ck-add[data-g="${focusGroup}"]`);

}

function addTaskTo(gid) {
  const input = ckBody.querySelector(`.ck-add[data-g="${gid}"]`);

  if (!input || !g) return;

    <label class="fld">Task

/* Turn tasks into topics (blocks) of a template */
function openTaskToTemplateModal(preIds) {
  const open = state.checklist.map(g => ({ g, tasks: g.tasks.filter(t => !t.done) })).filter(x => x.tasks.length);
  if (!open.length) { toast("No open tasks to add"); return; }
  const pre = new Set(preIds || []);
  const hasTpl = state.templateGroups.some(g => g.templates.length);
  const targets = state.templateGroups.filter(g => g.templates.length).map(g =>
    `<optgroup label="${esc(g.name)}">${g.templates.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join("")}</optgroup>`).join("");

  openModal("Add tasks to a template", `
    <p class="hint">Each task becomes a topic (block) in the template. When you finish that block in a session, the task is checked off.</p>
    <div class="ck-pick" id="ttList">
      ${open.map(({ g, tasks }) => `<div class="ck-sech">${esc(g.name)}</div>${tasks.map(t => `
        <label class="ck-pk"><input type="checkbox" value="${esc(t.id)}" ${pre.has(t.id) ? "checked" : ""}><span>${esc(t.title)}</span></label>`).join("")}`).join("")}
    </div>
    <label class="fld">Template
      <select id="ttTarget">${targets}<option value="__new">＋ New template…</option></select>
    </label>
    <label class="fld" id="ttNewWrap" ${hasTpl ? "hidden" : ""}>New template name
      <input id="ttNew" placeholder="e.g. Exam prep block" autocomplete="off">
    </label>
    <label class="fld">Add them as
      <select id="ttMode">
        <option value="separate">Separate blocks — do them all</option>
        <option value="choice">One choice block — pick one when it starts</option>
      </select>
    </label>
    <label class="fld">Minutes per block
      <input id="ttMins" type="number" min="1" max="300" value="${state.settings.focus}">
    </label>
    <button class="btn primary wide" id="ttGo">Add to template</button>`);

  const $t = document.getElementById("ttTarget"), $w = document.getElementById("ttNewWrap");
  if (!hasTpl) $t.value = "__new";
  $t.addEventListener("change", () => { $w.hidden = $t.value !== "__new"; if (!$w.hidden) document.getElementById("ttNew").focus(); });

  document.getElementById("ttGo").addEventListener("click", () => {
    const ids = [...document.querySelectorAll("#ttList input:checked")].map(i => i.value);
    if (!ids.length) { toast("Pick at least one task"); return; }
    const mins = Math.max(1, Math.min(300, Math.round(+document.getElementById("ttMins").value) || state.settings.focus));
    const order = state.checklist.flatMap(g => g.tasks).map(t => t.id);
    const tasks = ids.sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(findTask).filter(Boolean);
    const asChoice = document.getElementById("ttMode").value === "choice";
    if (asChoice && tasks.length < 2) { toast("Pick at least two tasks for a choice block"); return; }

    let tpl;
    if ($t.value === "__new") {
      if (!state.templateGroups.length) state.templateGroups.push({ id: uid(), name: "General", templates: [] });
      tpl = { id: uid(), title: document.getElementById("ttNew").value.trim() || "Checklist tasks", blocks: [],
              resources: [], days: [], daysSince: "", window: null, created: Date.now() };
      state.templateGroups[0].templates.push(tpl);
    } else {
      tpl = findTemplate($t.value);
    }
    if (!tpl) { toast("Template not found"); return; }

    if (asChoice) {
      const options = tasks.map(t => ({ topic: t.title, taskId: t.id }));
      tpl.blocks.push({ topic: choiceLabel(options), minutes: mins, days: [], options });
      save();
      closeModal();
      renderTemplates();
      renderPlan();
      toast(`Added a choice of ${options.length} tasks to "${tpl.title}"`);
      return;
    }

    let added = 0, skipped = 0;
    tasks.forEach(t => {
      if (tpl.blocks.some(b => b.taskId === t.id)) { skipped++; return; }
      tpl.blocks.push({ topic: t.title, minutes: mins, days: [], taskId: t.id });
      added++;
    });
    save();
    closeModal();
    renderTemplates();
    renderPlan();
    toast(added ? `Added ${added} topic${added !== 1 ? "s" : ""} to "${tpl.title}"${skipped ? ` (${skipped} already there)` : ""}`
                : "Those tasks are already in that template");
  });
}

ckBody.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const sec = el.closest("[data-g].ck-sec");
  const g = sec ? state.checklist.find(x => x.id === sec.dataset.g) : null;
  const row = el.closest(".ck-row");
  const tid = row ? row.dataset.t : null;

  if (act === "ck-toggle") return;               // handled on change
  if (act === "ck-hide") { state.ui.ckHideDone = !state.ui.ckHideDone; save(); renderChecklist(); return; }
  if (act === "ck-newsec") {
    openNameModal("New section", "Section name", "e.g. Exam prep", "", "Create section", name => {
      state.checklist.push({ id: uid(), name, collapsed: false, tasks: [] });
      closeModal(); ckRefresh(); toast("Section created");
    });
    return;
  }
  if (act === "ck-add") { addTaskTo(el.dataset.g); return; }
  if (act === "ck-io") { openChecklistIOModal(); return; }
  if (!g) return;
  if (act === "ck-fold") { g.collapsed = !g.collapsed; save(); renderChecklist(); return; }
  if (act === "ck-rename") {
    openNameModal("Rename section", "Section name", "Section name", g.name, "Save", name => {
      g.name = name; closeModal(); ckRefresh();
    });
    return;
  }
  if (act === "ck-delsec") {
    if (!confirm(`Delete section "${g.name}" and its ${g.tasks.length} task${g.tasks.length !== 1 ? "s" : ""}?`)) return;
    unlinkTasks(g.tasks.map(t => t.id));
    state.checklist = state.checklist.filter(x => x.id !== g.id);
    ckRefresh(); renderTemplates(); toast("Section deleted");
    return;
  }
  if (act === "ck-sectpl") {
    openTaskToTemplateModal(g.tasks.filter(t => !t.done).map(t => t.id));
    return;
  }
  if (!tid) return;
  if (act === "ck-tpl")  { openTaskToTemplateModal([tid]); return; }
  if (act === "ck-edit") { openTaskEditModal(tid); return; }
  if (act === "ck-del") {
    const linked = templateLinks().get(tid);
    if (linked && !confirm(`This task is a topic in: ${linked.join(", ")}.\nThe blocks keep their text but stop being linked. Delete it?`)) return;
    unlinkTasks([tid]);
    g.tasks = g.tasks.filter(t => t.id !== tid);
    ckRefresh(); renderTemplates();
  }
});

ckBody.addEventListener("change", e => {
