<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Plan</title>
<style>
  :root{
    --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f0f0f2;
    --text:#18181b; --muted:#71717a; --border:#e6e6e9;
    --accent:#5b5bd6; --accent-soft:rgba(91,91,214,.12); --on-accent:#fff;
    --break:#0f9d76;
    --seg-track:#efeff1; --seg-active:#ffffff;
  }
  [data-theme="dark"]{
    --bg:#0a0a0c; --surface:#131316; --surface-2:#1b1b1f;
    --text:#f2f2f4; --muted:#8c8c96; --border:#26262c;
    --accent:#8b87ff; --accent-soft:rgba(139,135,255,.16); --on-accent:#0a0a0c;
    --break:#3ddc9a;
    --seg-track:#1b1b1f; --seg-active:#2c2c34;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    transition:background .2s ease,color .2s ease;
  }
  button{font:inherit}
  a{color:var(--accent)}

  .app{max-width:1020px;margin:0 auto;padding:26px 20px 60px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .brand span{color:var(--accent)}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{border-color:var(--muted)}
  .icon-btn.sm{width:28px;height:28px;border-radius:8px;font-size:12px;background:transparent;border-color:transparent;color:var(--muted)}
  .icon-btn.sm:hover{background:var(--surface-2);color:var(--text)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
  @media(max-width:860px){ .layout{grid-template-columns:1fr} }

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:18px;margin-bottom:18px;
  }
  .col-left .card{position:sticky;top:22px}
  @media(max-width:860px){ .col-left .card{position:static} }

  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .sec-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .sec-actions{display:flex;gap:8px}

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);
    border-radius:13px;padding:4px;margin-bottom:18px;
  }
  .tabs button{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:500;
    cursor:pointer;transition:.15s;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--surface-2);color:var(--text)}
  .tab-panel[hidden]{display:none}

  /* ---------- toggle switch ---------- */
  .switch{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;border:0;padding:2px;cursor:pointer;
    font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);
  }
  .switch:hover{color:var(--text)}
  .switch .track{
    position:relative;width:32px;height:18px;flex-shrink:0;
    border-radius:99px;background:var(--surface-2);
    border:1px solid var(--border);transition:.18s;
  }
  .switch .track::after{
    content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:var(--muted);transition:.18s;
  }
  .switch.on .track{background:var(--accent-soft);border-color:var(--accent)}
  .switch.on .track::after{transform:translateX(14px);background:var(--accent)}

  /* ---------- buttons ---------- */
  .btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:13.5px;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.wide{width:100%;margin-top:4px;padding:10px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--border)}

  /* ---------- timer ---------- */
  .timer-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .pill{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);
    padding:4px 9px;border-radius:99px;
  }
  .timer-session{
    font-size:12.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;
  }

  .ring-wrap{position:relative;width:196px;margin:10px auto 0}
  .ring{display:block;width:196px;height:196px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bg{stroke:var(--surface-2)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s linear,stroke .3s ease}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;pointer-events:none;
  }
  .time{
    font-size:38px;font-weight:300;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .time.over{color:var(--break)}
  .sub{font-size:12px;color:var(--muted);max-width:150px;text-align:center;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .controls{display:flex;gap:8px;margin-top:18px}
  .controls .btn{flex:1;text-align:center;padding:9px 8px}

  .seg{display:flex;background:var(--seg-track);border-radius:11px;padding:3px;gap:3px;margin-top:14px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);
    padding:7px 6px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--seg-active);color:var(--text);font-weight:500}

  /* ---------- settings ---------- */
  details.settings{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  details.settings summary{
    cursor:pointer;font-size:12px;color:var(--muted);list-style:none;
    user-select:none;display:flex;align-items:center;gap:6px;
  }
  details.settings summary::-webkit-details-marker{display:none}
  details.settings summary::before{content:"›";transition:.2s;display:inline-block}
  details.settings[open] summary::before{transform:rotate(90deg)}
  details.settings .inner{padding-top:12px}

  /* ---------- form fields ---------- */
  .fld{display:block;margin-bottom:12px;font-size:12px;font-weight:500;color:var(--muted)}
  .fld .opt{font-weight:400;opacity:.7}
  input,textarea,select{
    display:block;width:100%;margin-top:5px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;
    font-weight:400;outline:none;transition:border-color .15s;
  }
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;font-family:inherit}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* ---------- sessions / templates ---------- */
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}
  .session{
    border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px;
    transition:.18s;
  }
  .session.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .session-title{font-weight:550;font-size:14.5px;letter-spacing:-.01em}
  .session-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .session-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
  .session-actions .btn{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .bar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:11px 0 9px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .blocks{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    font-size:11.5px;padding:3px 9px;border-radius:99px;
    background:var(--surface-2);color:var(--muted);
    cursor:pointer;user-select:none;transition:.15s;border:1px solid transparent;
  }
  .chip:hover{border-color:var(--border)}
  .chip.done{background:var(--accent-soft);color:var(--accent)}
  .chip.static{cursor:default}
  .chip.static:hover{border-color:transparent}

  /* ---------- resources ---------- */
  .res-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:14px}
  .res-form input{margin-top:0}
  @media(max-width:560px){ .res-form{grid-template-columns:1fr} }
  .res{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:7px;
  }
  .res-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-name a{text-decoration:none}
  .res-name a:hover{text-decoration:underline}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);
    animation:fade .15s ease;
  }
  .overlay[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:470px;max-height:86vh;overflow:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .modal-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--text);
  }
  .preview{margin:12px 0;max-height:160px;overflow:auto}
  .prev-item{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface-2);margin-bottom:5px;
  }
  .prev-item span{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .prev-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:10px}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:var(--bg);
    padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;
    opacity:0;pointer-events:none;transition:.22s ease;z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">study<span>plan</span></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>

  <div class="layout">
    <!-- ============ TIMER ============ -->
    <aside class="col-left">
      <div class="card">
        <div class="timer-top">
          <span class="pill" id="phaseEl">Focus</span>
          <span class="timer-session" id="sessionEl">No session</span>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200">
            <circle class="bg" cx="100" cy="100" r="92"></circle>
            <circle class="fg" id="ringFg" cx="100" cy="100" r="92"
                    stroke-dasharray="578.05" stroke-dashoffset="578.05"></circle>
          </svg>
          <div class="ring-center">
            <div class="time" id="timeEl">25:00</div>
            <div class="sub" id="subEl">Pick a session</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn primary" id="startBtn" disabled>Start</button>
          <button class="btn" id="resetBtn">Reset</button>
          <button class="btn" id="skipBtn">Skip</button>
        </div>

        <div class="seg" id="modeSeg">
          <button data-mode="pomodoro">Pomodoro</button>
          <button data-mode="freeflow">Free flow</button>
        </div>

        <details class="settings">
          <summary>Timer settings</summary>
          <div class="inner">
            <div class="two">
              <label class="fld">Focus (min)<input id="setFocus" type="number" min="1" max="180"></label>
              <label class="fld">Short break<input id="setShort" type="number" min="1" max="60"></label>
            </div>
            <div class="two">
              <label class="fld">Long break<input id="setLong" type="number" min="1" max="60"></label>
              <label class="fld">Long every<input id="setEvery" type="number" min="2" max="12"></label>
            </div>
          </div>
        </details>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="col-right">

      <div class="tabs" id="tabBar" role="tablist">
        <button data-tab="sessions"  role="tab" class="on">Sessions</button>
        <button data-tab="resources" role="tab">Resources</button>
        <button data-tab="templates" role="tab">Templates</button>
      </div>

      <!-- ---- Sessions panel ---- -->
      <section class="card tab-panel" data-panel="sessions" role="tabpanel">
        <div class="sec-head">
          <h2>Sessions</h2>
          <div class="sec-actions">
            <button class="btn" id="importBtn">Import</button>
            <button class="btn primary" id="addBtn">+ New</button>
          </div>
        </div>
        <div id="sessionList"></div>
      </section>

      <!-- ---- Resources panel ---- -->
      <section class="card tab-panel" data-panel="resources" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Resources</h2>
          <button class="switch on" id="formToggle" role="switch" aria-checked="true"
                  title="Show or hide the add-resource form">
            <span class="track"></span>
            <span class="lbl">Add form</span>
          </button>
        </div>

        <div id="resFormWrap">
          <form class="res-form" id="resForm">
            <input id="resName" placeholder="Resource name" autocomplete="off" required>
            <input id="resUrl" placeholder="https:// (optional)" autocomplete="off">
            <button class="btn primary" type="submit">Add</button>
          </form>
        </div>

        <div id="resList"></div>
      </section>

      <!-- ---- Templates panel ---- -->
      <section class="card tab-panel" data-panel="templates" role="tabpanel" hidden>
        <div class="sec-head">
          <h2>Templates</h2>
          <div class="sec-actions">
            <button class="btn" id="importTplBtn">Import</button>
            <button class="btn primary" id="addTplBtn">+ New</button>
          </div>
        </div>
        <p class="hint" style="margin-top:-4px">
          Reusable block layouts. Hit <b>Use</b> to turn a template into a session,
          or <b>★</b> on any session to save it as a template.
        </p>
        <div id="templateList"></div>
      </section>

    </main>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn sm" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* =====================================================
   STATE
   ===================================================== */
const KEY = "studyplan.v1";
const BASE_TITLE = "Study Plan";
const TABS = ["sessions", "resources", "templates"];
const $ = (s, r = document) => r.querySelector(s);

let state = {
  theme: null,
  ui: { tab: "sessions", hideResForm: false },
  settings: { mode: "pomodoro", focus: 25, short: 5, long: 15, longEvery: 4 },
  sessions: [],
  resources: [],
  templates: []
};

let timer = {
  sessionId: null, blockIndex: 0, phase: "work",
  running: false, remaining: 0, elapsed: 0, total: 0,
  lastTick: 0, longBreak: false, notified: false, finished: false
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const RING_C = 2 * Math.PI * 92;

/* =====================================================
   PERSISTENCE
   ===================================================== */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = {
        ...state, ...d,
        ui:        { ...state.ui, ...(d.ui || {}) },
        settings:  { ...state.settings, ...(d.settings || {}) },
        sessions:  Array.isArray(d.sessions)  ? d.sessions  : [],
        resources: Array.isArray(d.resources) ? d.resources : [],
        templates: Array.isArray(d.templates) ? d.templates : []
      };
    }
  } catch (e) { /* ignore corrupt storage */ }

  if (!state.theme) {
    state.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  if (!TABS.includes(state.ui.tab)) state.ui.tab = "sessions";
  applyTheme();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* =====================================================
   TOAST
   ===================================================== */
const toastEl = $("#toast");
let toastTimer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* =====================================================
   THEME
   ===================================================== */
const themeBtn = $("#themeBtn");

function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  themeBtn.innerHTML = state.theme === "dark"
    ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`
    : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
}

themeBtn.addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme();
  save();
});

/* =====================================================
   TABS
   ===================================================== */
const tabBar = $("#tabBar");

function setTab(tab) {
  if (!TABS.includes(tab)) tab = "sessions";
  state.ui.tab = tab;
  save();

  [...tabBar.children].forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", String(on));
  });

  document.querySelectorAll(".tab-panel").forEach(p => {
    p.hidden = p.dataset.panel !== tab;
  });
}

tabBar.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});

/* =====================================================
   RESOURCE FORM TOGGLE
   ===================================================== */
const formToggle  = $("#formToggle");
const resFormWrap = $("#resFormWrap");

function applyResFormToggle() {
  const visible = !state.ui.hideResForm;
  resFormWrap.hidden = !visible;
  formToggle.classList.toggle("on", visible);
  formToggle.setAttribute("aria-checked", String(visible));
}

formToggle.addEventListener("click", () => {
  state.ui.hideResForm = !state.ui.hideResForm;
  save();
  applyResFormToggle();
});

/* =====================================================
   AUDIO CUE
   ===================================================== */
let actx = null;
function beep(freq = 660, dur = 0.45) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = "sine"; o.frequency.value = freq;
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}

/* =====================================================
   TIMER CORE
   ===================================================== */
const ringFg   = $("#ringFg");
const timeEl   = $("#timeEl");
const subEl    = $("#subEl");
const phaseEl  = $("#phaseEl");
const sessionEl= $("#sessionEl");
const startBtn = $("#startBtn");
const resetBtn = $("#resetBtn");
const skipBtn  = $("#skipBtn");
const modeSeg  = $("#modeSeg");

const getSession = id => state.sessions.find(s => s.id === id);

function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}

function loadPhase() {
  const s = getSession(timer.sessionId);
  if (!s) return;
  const b = s.blocks[timer.blockIndex];
  if (!b) return;

  timer.notified = false;
  timer.elapsed = 0;

  if (state.settings.mode === "freeflow") {
    timer.total = b.minutes * 60;
    timer.remaining = 0;
  } else {
    if (timer.phase === "work") {
      timer.total = b.minutes * 60;
    } else {
      timer.total = (timer.longBreak ? state.settings.long : state.settings.short) * 60;
    }
    timer.remaining = timer.total;
  }
}

function startSession(id) {
  const s = getSession(id);
  if (!s || !s.blocks.length) return;

  let idx = s.blocks.findIndex(b => !b.done);
  if (idx === -1) {                       // everything done → start over
    s.blocks.forEach(b => (b.done = false));
    idx = 0;
    save();
  }

  timer.sessionId  = id;
  timer.blockIndex = idx;
  timer.phase      = "work";
  timer.longBreak  = false;
  timer.finished   = false;
  timer.notified   = false;

  loadPhase();
  timer.running  = true;
  timer.lastTick = Date.now();

  renderSessions();
  updateTimerUI();
}

function resetPhase() {
  if (!timer.sessionId) return;
  timer.finished = false;
  timer.running  = false;
  loadPhase();
  updateTimerUI();
}

function finishSession(s) {
  timer.running  = false;
  timer.finished = true;
  beep(880, 0.35);
  setTimeout(() => beep(1046, 0.5), 170);
  renderSessions();
}

/* advance the state machine by one phase */
function endPhase() {
  const s = getSession(timer.sessionId);
  if (!s) return;

  const wasRunning = timer.running;
  const mode = state.settings.mode;

  if (mode === "freeflow") {
    s.blocks[timer.blockIndex].done = true;
    if (timer.blockIndex < s.blocks.length - 1) {
      timer.blockIndex++;
      loadPhase();
      timer.running  = wasRunning;
      timer.lastTick = Date.now();
    } else {
      finishSession(s);
    }
  } else if (timer.phase === "work") {
    s.blocks[timer.blockIndex].done = true;
    if (timer.blockIndex >= s.blocks.length - 1) {
      finishSession(s);
    } else {
      timer.longBreak = ((timer.blockIndex + 1) % state.settings.longEvery === 0);
      timer.phase = "break";
      loadPhase();
      timer.running  = wasRunning;
      timer.lastTick = Date.now();
      beep(520, 0.4);
    }
  } else {
    timer.blockIndex++;
    timer.phase = "work";
    loadPhase();
    timer.running  = wasRunning;
    timer.lastTick = Date.now();
    beep(760, 0.35);
  }

  save();
  renderSessions();
  updateTimerUI();
}

/* main tick loop */
setInterval(() => {
  if (!timer.running || !timer.sessionId) return;

  const now = Date.now();
  const dt  = (now - timer.lastTick) / 1000;
  timer.lastTick = now;

  const s = getSession(timer.sessionId);
  if (!s) { timer.running = false; return; }

  if (state.settings.mode === "freeflow") {
    timer.elapsed += dt;
    const b = s.blocks[timer.blockIndex];
    if (b && !timer.notified && timer.elapsed >= b.minutes * 60) {
      timer.notified = true;
      beep(700, 0.4);
    }
  } else {
    timer.remaining -= dt;
    if (timer.remaining <= 0) {
      timer.remaining = 0;
      updateTimerUI();
      endPhase();
      return;
    }
  }
  updateTimerUI();
}, 250);

/* =====================================================
   TIMER UI
   ===================================================== */
function updateTimerUI() {
  const s    = getSession(timer.sessionId);
  const mode = state.settings.mode;

  let secs, progress, phase, sub, over = false;

  if (!s) {
    secs     = mode === "pomodoro" ? state.settings.focus * 60 : 0;
    progress = 0;
    phase    = mode === "pomodoro" ? "Focus" : "Free flow";
    sub      = "Pick a session";
    sessionEl.textContent = "No session";
  } else if (timer.finished) {
    secs     = 0;
    progress = 1;
    phase    = "Complete";
    sub      = "All blocks done";
    sessionEl.textContent = s.title;
  } else {
    const b = s.blocks[timer.blockIndex] || { minutes: 25, topic: "" };

    if (mode === "freeflow") {
      secs     = timer.elapsed;
      progress = Math.min(timer.elapsed / (b.minutes * 60), 1);
      over     = timer.elapsed >= b.minutes * 60;
      phase    = "Free flow";
    } else if (timer.phase === "work") {
      secs     = timer.remaining;
      progress = timer.total ? 1 - timer.remaining / timer.total : 0;
      phase    = "Focus";
    } else {
      secs     = timer.remaining;
      progress = timer.total ? 1 - timer.remaining / timer.total : 0;
      phase    = timer.longBreak ? "Long break" : "Break";
    }

    sub = `Block ${timer.blockIndex + 1}/${s.blocks.length} · ${b.topic || "Untitled"}`;
    sessionEl.textContent = s.title;
  }

  timeEl.textContent = fmtTime(secs);
  timeEl.classList.toggle("over", over);
  phaseEl.textContent = phase;
  subEl.textContent   = sub;

  const p = Math.max(0, Math.min(1, progress));
  ringFg.style.strokeDashoffset = String(RING_C * (1 - p));
  ringFg.style.stroke =
    (s && !timer.finished && mode === "pomodoro" && timer.phase === "break")
      ? "var(--break)" : "var(--accent)";

  // controls
  startBtn.disabled = !timer.sessionId;
  skipBtn.disabled  = !timer.sessionId || timer.finished;
  resetBtn.disabled = !timer.sessionId;

  startBtn.textContent = timer.finished ? "Restart"
                       : timer.running  ? "Pause"
                       : (timer.sessionId ? "Resume" : "Start");

  // segmented control
  [...modeSeg.children].forEach(b =>
    b.classList.toggle("on", b.dataset.mode === mode));

  updateTitle(secs);
}

/* =====================================================
   BROWSER TAB TITLE
   ===================================================== */
function updateTitle(secs) {
  const s = getSession(timer.sessionId);

  if (!s) { document.title = BASE_TITLE; return; }

  if (timer.finished) {
    document.title = `✓ Done · ${BASE_TITLE}`;
    return;
  }

  const prefix = timer.running ? "▶ " : "⏸ ";
  document.title = `${prefix}${fmtTime(secs)} · ${BASE_TITLE}`;
}

/* control handlers */
startBtn.addEventListener("click", () => {
  if (!timer.sessionId) return;
  if (timer.finished) { startSession(timer.sessionId); return; }
  timer.running  = !timer.running;
  timer.lastTick = Date.now();
  updateTimerUI();
});

resetBtn.addEventListener("click", resetPhase);
skipBtn.addEventListener("click", () => {
  if (!timer.sessionId || timer.finished) return;
  endPhase();
});

modeSeg.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (state.settings.mode === b.dataset.mode) return;
  state.settings.mode = b.dataset.mode;
  save();
  if (timer.sessionId && !timer.finished) {
    timer.running = false;
    timer.phase = "work";
    loadPhase();
  }
  renderSessions();
  updateTimerUI();
});

/* =====================================================
   SESSIONS
   ===================================================== */
const sessionList = $("#sessionList");

function renderSessions() {
  if (!state.sessions.length) {
    sessionList.innerHTML =
      `<div class="empty">No sessions yet.<br>Create one, import one, or start from a <b>template</b>.</div>`;
    return;
  }

  sessionList.innerHTML = state.sessions.map(s => {
    const total = s.blocks.length;
    const done  = s.blocks.filter(b => b.done).length;
    const mins  = s.blocks.reduce((a, b) => a + b.minutes, 0);
    const pct   = total ? (done / total) * 100 : 0;
    const active = timer.sessionId === s.id;

    return `
      <div class="session${active ? " active" : ""}" data-id="${s.id}">
        <div class="session-head">
          <div>
            <div class="session-title">${esc(s.title)}</div>
            <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min · ${done}/${total} done</div>
          </div>
          <div class="session-actions">
            <button class="btn" data-act="start">${active ? "Restart" : "Start"}</button>
            <button class="icon-btn sm" data-act="tmpl" title="Save as template">★</button>
            <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
          </div>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="blocks">
          ${s.blocks.map((b, i) => `
            <span class="chip${b.done ? " done" : ""}" data-act="toggle" data-i="${i}"
                  title="Toggle done">${esc(b.topic || "Block " + (i + 1))} · ${b.minutes}m</span>
          `).join("")}
        </div>
      </div>`;
  }).join("");
}

sessionList.addEventListener("click", e => {
  const card = e.target.closest(".session");
  if (!card) return;
  const id  = card.dataset.id;
  const s   = getSession(id);
  if (!s) return;

  const el  = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "start") {
    startSession(id);
  } else if (act === "del") {
    if (!confirm(`Delete "${s.title}"?`)) return;
    state.sessions = state.sessions.filter(x => x.id !== id);
    if (timer.sessionId === id) {
      timer.sessionId = null;
      timer.running = false;
      timer.finished = false;
    }
    save(); renderSessions(); updateTimerUI();
  } else if (act === "tmpl") {
    state.templates.push({
      id: uid(),
      title: s.title,
      blocks: s.blocks.map(b => ({ topic: b.topic, minutes: b.minutes })),
      created: Date.now()
    });
    save();
    renderTemplates();
    const prev = el.textContent;
    el.textContent = "✓";
    setTimeout(() => { el.textContent = prev; }, 900);
    toast("Saved as template");
  } else if (act === "toggle") {
    const i = +el.dataset.i;
    s.blocks[i].done = !s.blocks[i].done;
    save(); renderSessions();
  }
});

/* =====================================================
   TEMPLATES
   ===================================================== */
const templateList = $("#templateList");

function renderTemplates() {
  if (!state.templates.length) {
    templateList.innerHTML =
      `<div class="empty">No templates yet.<br>Create one or hit <b>★</b> on a session to save it here.</div>`;
    return;
  }

  templateList.innerHTML = state.templates.map(t => {
    const total = t.blocks.length;
    const mins  = t.blocks.reduce((a, b) => a + b.minutes, 0);

    return `
      <div class="session" data-id="${t.id}">
        <div class="session-head">
          <div>
            <div class="session-title">${esc(t.title)}</div>
            <div class="session-meta">${total} block${total !== 1 ? "s" : ""} · ${mins} min total</div>
          </div>
          <div class="session-actions">
            <button class="btn primary" data-act="use">Use</button>
            <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
          </div>
        </div>
        <div class="blocks" style="margin-top:11px">
          ${t.blocks.map(b => `
            <span class="chip static">${esc(b.topic || "Block")} · ${b.minutes}m</span>
          `).join("")}
        </div>
      </div>`;
  }).join("");
}

templateList.addEventListener("click", e => {
  const card = e.target.closest(".session");
  if (!card) return;
  const id = card.dataset.id;
  const t  = state.templates.find(x => x.id === id);
  if (!t) return;

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "use") {
    const session = {
      id: uid(),
      title: t.title,
      blocks: t.blocks.map(b => ({ topic: b.topic, minutes: b.minutes, done: false })),
      created: Date.now()
    };
    state.sessions.push(session);
    save();
    renderSessions();
    setTab("sessions");
    toast(`Session "${session.title}" created`);
  } else if (act === "del") {
    if (!confirm(`Delete template "${t.title}"?`)) return;
    state.templates = state.templates.filter(x => x.id !== id);
    save();
    renderTemplates();
  }
});

/* =====================================================
   RESOURCES
   ===================================================== */
const resList = $("#resList");
const resForm = $("#resForm");

function safeUrl(u) {
  if (!u) return "";
  try {
    const url = new URL(u.trim());
    return (url.protocol === "http:" || url.protocol === "https:") ? url.href : "";
  } catch (e) { return ""; }
}

function renderResources() {
  if (!state.resources.length) {
    resList.innerHTML = `<div class="empty">No resources yet.${
      state.ui.hideResForm ? "" : "<br>Add links, books, PDFs above."
    }</div>`;
    return;
  }
  resList.innerHTML = state.resources.map(r => {
    const url = safeUrl(r.url);
    const name = url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`
      : esc(r.name);
    return `
      <div class="res" data-id="${r.id}">
        <div class="res-name">${name}</div>
        ${url ? `<span style="font-size:11px;color:var(--muted)">link</span>` : ""}
        <button class="icon-btn sm" data-act="del" title="Delete">✕</button>
      </div>`;
  }).join("");
}

resForm.addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#resName").value.trim();
  if (!name) return;
  state.resources.push({ id: uid(), name, url: $("#resUrl").value.trim() });
  save(); renderResources();
  resForm.reset();
  $("#resName").focus();
});

resList.addEventListener("click", e => {
  const btn = e.target.closest("[data-act='del']");
  if (!btn) return;
  const row = e.target.closest(".res");
  state.resources = state.resources.filter(r => r.id !== row.dataset.id);
  save(); renderResources();
});

/* =====================================================
   IMPORT PARSER
   -----------------------------------------------------
   "4 topics - 50x4"            → 4 blocks × 50 min
   "Calculus - 25x2, 50x1"      → 2×25 + 1×50
   "Limits, Derivatives - 50x2" → named blocks
   "45"                         → one 45 min block
   ===================================================== */
function parseSessions(text) {
  const out = [];

  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    let title = "", spec = line;

    const m = line.match(/^(.*)\s*[-–—]\s*(.+)$/);
    if (m && /\d/.test(m[2])) {
      title = m[1].trim();
      spec  = m[2].trim();
    }

    const blocks = [];
    spec.split(/[,;]/).map(p => p.trim()).filter(Boolean).forEach(part => {
      const pair = part.match(/(\d+)\s*(?:x|\*|×|X)\s*(\d+)/);
      if (pair) {
        let a = +pair[1], b = +pair[2], count, minutes;
        if (a <= 12 && b > 12) { count = a; minutes = b; }   // 4x50
        else                   { minutes = a; count = b; }   // 50x4
        count   = Math.max(1, Math.min(50, count));
        minutes = Math.max(1, Math.min(300, minutes));
        for (let i = 0; i < count; i++) blocks.push({ topic: "", minutes, done: false });
      } else {
        const single = part.match(/(\d+)/);
        if (single) blocks.push({ topic: "", minutes: Math.min(300, +single[1]), done: false });
      }
    });

    if (!blocks.length) return;

    const topics = title ? title.split(",").map(t => t.trim()).filter(Boolean) : [];
    if (topics.length === blocks.length && topics.length > 1) {
      blocks.forEach((b, i) => (b.topic = topics[i]));
    } else {
      blocks.forEach((b, i) => (b.topic = "Topic " + (i + 1)));
    }

    out.push({ title: title || "Session", blocks });
  });

  return out;
}

/* =====================================================
   MODAL
   ===================================================== */
const overlay    = $("#overlay");
const modalTitle = $("#modalTitle");
const modalBody  = $("#modalBody");

function openModal(title, html) {
  modalTitle.textContent = title;
  modalBody.innerHTML = html;
  overlay.hidden = false;
}

function closeModal() {
  overlay.hidden = true;
  modalBody.innerHTML = "";
}

$("#modalClose").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !overlay.hidden) closeModal();
});

/* =====================================================
   CREATE MODAL (shared by sessions & templates)
   ===================================================== */
function openCreateModal(kind) {
  const isTpl = kind === "template";

  openModal(isTpl ? "New template" : "New session", `
    <label class="fld">Title
      <input id="bTitle" placeholder="${isTpl ? "e.g. Deep work 3h" : "e.g. Calculus"}" autocomplete="off">
    </label>
    <div class="two">
      <label class="fld">Minutes / block
        <input id="bMins" type="number" min="1" max="300" value="${state.settings.focus}">
      </label>
      <label class="fld">Blocks
        <input id="bCount" type="number" min="1" max="50" value="4">
      </label>
    </div>
    <label class="fld">Topics <span class="opt">— optional, comma separated</span>
      <input id="bTopics" placeholder="Limits, Derivatives, Integrals, Series" autocomplete="off">
    </label>
    <button class="btn primary wide" id="bCreate">
      ${isTpl ? "Create template" : "Create session"}
    </button>
  `);

  const titleIn = $("#bTitle");
  titleIn.focus();

  $("#bCreate").addEventListener("click", () => {
    const title  = titleIn.value.trim() || (isTpl ? "Untitled template" : "Untitled session");
    const mins   = Math.max(1, Math.min(300, +$("#bMins").value || 25));
    const count  = Math.max(1, Math.min(50, +$("#bCount").value || 1));
    const topics = $("#bTopics").value.split(",").map(t => t.trim()).filter(Boolean);

    const blocks = Array.from({ length: count }, (_, i) => ({
      topic: topics[i] || "",
      minutes: mins
    }));

    if (isTpl) {
      state.templates.push({ id: uid(), title, blocks, created: Date.now() });
      save(); closeModal(); renderTemplates();
      toast("Template created");
    } else {
      state.sessions.push({
        id: uid(), title,
        blocks: blocks.map(b => ({ ...b, done: false })),
        created: Date.now()
      });
      save(); closeModal(); renderSessions();
    }
  });
}

$("#addBtn").addEventListener("click", () => openCreateModal("session"));
$("#addTplBtn").addEventListener("click", () => openCreateModal("template"));

/* =====================================================
   IMPORT MODAL (shared by sessions & templates)
   ===================================================== */
function openImportModal(kind) {
  const isTpl = kind === "template";

  openModal(isTpl ? "Import templates" : "Import session", `
    <p class="hint">
      One ${isTpl ? "template" : "session"} per line. Format: <code>Title - 50x4</code> = 4 blocks of 50 min.<br>
      Name the blocks with commas: <code>Limits, Derivatives - 50x2</code>
    </p>
    <textarea id="impText" rows="5" spellcheck="false"
      placeholder="4 topics - 50x4&#10;Calculus - 25x2, 50x1"></textarea>
    <div class="preview" id="impPreview"></div>
    <button class="btn primary wide" id="impGo">Import</button>
  `);

  const ta   = $("#impText");
  const prev = $("#impPreview");

  const refresh = () => {
    const list = parseSessions(ta.value);
    prev.innerHTML = list.length
      ? list.map(s => {
          const mins = s.blocks.reduce((a, b) => a + b.minutes, 0);
          return `<div class="prev-item">
                    <b>${esc(s.title)}</b>
                    <span>${s.blocks.length} block${s.blocks.length !== 1 ? "s" : ""} · ${mins} min</span>
                  </div>`;
        }).join("")
      : `<div class="prev-empty">Nothing to import yet</div>`;
  };

  ta.addEventListener("input", refresh);
  refresh();
  ta.focus();

  $("#impGo").addEventListener("click", () => {
    const list = parseSessions(ta.value);
    if (!list.length) return;

    list.forEach(s => {
      if (isTpl) {
        state.templates.push({
          id: uid(),
          title: s.title,
          blocks: s.blocks.map(b => ({ topic: b.topic, minutes: b.minutes })),
          created: Date.now()
        });
      } else {
        state.sessions.push({
          id: uid(), title: s.title, blocks: s.blocks, created: Date.now()
        });
      }
    });

    save();
    closeModal();
    if (isTpl) renderTemplates(); else renderSessions();
    toast(`Imported ${list.length} ${isTpl ? "template" : "session"}${list.length !== 1 ? "s" : ""}`);
  });
}

$("#importBtn").addEventListener("click", () => openImportModal("session"));
$("#importTplBtn").addEventListener("click", () => openImportModal("template"));

/* =====================================================
   SETTINGS INPUTS
   ===================================================== */
function bindSetting(id, key, min, max) {
  const el = $(id);
  el.value = state.settings[key];
  el.addEventListener("change", () => {
    let v = +el.value || min;
    v = Math.max(min, Math.min(max, v));
    el.value = v;
    state.settings[key] = v;
    save();
    if (!timer.running && !timer.finished && !timer.sessionId) updateTimerUI();
  });
}

/* =====================================================
   BOOT
   ===================================================== */
load();

bindSetting("#setFocus", "focus", 1, 180);
bindSetting("#setShort", "short", 1, 60);
bindSetting("#setLong",  "long",  1, 60);
bindSetting("#setEvery", "longEvery", 2, 12);

setTab(state.ui.tab);
applyResFormToggle();

renderSessions();
renderResources();
renderTemplates();
updateTimerUI();

})();
</script>
